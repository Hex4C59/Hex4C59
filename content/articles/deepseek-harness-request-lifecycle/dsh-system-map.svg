<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 920" role="img" aria-labelledby="title desc">
  <title id="title">一次用户请求经过哪些 dsh 模块</title>
  <desc id="desc">浏览器将输入经 Gateway 和会话控制器交给 Agent Loop。Agent 调用模型与工具，并提交 Session 事件。实时帧和日志通过会话下行返回浏览器。图示为运行中的 Web 普通会话，基于固定源码版本 d7432673 的结构归纳。</desc>
  <defs>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", "PingFang SC", sans-serif; fill: #444441; }
      .title { font-size: 16px; font-weight: 600; }
      .name { font-size: 14px; font-weight: 600; }
      .body { font-size: 12px; font-weight: 400; fill: #5f5e5a; }
      .purple { fill: #3c3489; }
      .blue { fill: #0c447c; }
      .green { fill: #085041; }
      .orange { fill: #633806; }
      .main { stroke: #73726c; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .exchange { stroke: #73726c; stroke-width: 1.5; fill: none; marker-start: url(#arrow); marker-end: url(#arrow); }
      .events { stroke: #0f6e56; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow-green); }
      .event-branch { stroke: #0f6e56; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0f6e56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="800" height="920" fill="#fbfaf7"/>
  <rect x="32" y="252" width="736" height="592" rx="12" fill="#ffffff" stroke="#c8c5bc" stroke-width="1" stroke-dasharray="6 5"/>
  <text x="52" y="278" class="body">Host · 已启动的插件组合</text>

  <!-- Connections precede opaque nodes so no line crosses a label or a box. -->
  <path class="main" d="M213 194V304"/>
  <path class="events" d="M587 304V194"/>
  <path class="main" d="M213 380V440"/>
  <path class="exchange" d="M213 530V594"/>
  <path class="exchange" d="M587 530V594"/>
  <path class="main" d="M400 530V734"/>
  <path class="events" d="M732 773H748V342H732"/>
  <path class="event-branch" d="M732 485H748"/>
  <circle cx="748" cy="485" r="3" fill="#0f6e56"/>

  <g data-box="browser">
    <rect x="68" y="112" width="664" height="82" rx="10" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.8"/>
    <text x="400" y="143" text-anchor="middle" class="name">浏览器 · Conversation / Session</text>
    <text x="400" y="167" text-anchor="middle" class="body">组织输入与本地回显，合并实时帧和会话记录</text>
  </g>
  <g data-box="gateway">
    <rect x="68" y="304" width="290" height="76" rx="10" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.8"/>
    <text x="213" y="334" text-anchor="middle" class="name blue">Gateway / Session Controller</text>
    <text x="213" y="357" text-anchor="middle" class="body">校验输入、去重、解析 Agent</text>
  </g>
  <g data-box="downstream">
    <rect x="442" y="304" width="290" height="76" rx="10" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
    <text x="587" y="334" text-anchor="middle" class="name green">会话下行 · follow / control</text>
    <text x="587" y="357" text-anchor="middle" class="body">订阅日志、实时帧与控制状态</text>
  </g>
  <g data-box="agent">
    <rect x="68" y="440" width="664" height="90" rx="12" fill="#eeedfe" stroke="#534ab7" stroke-width="1.1"/>
    <text x="400" y="475" text-anchor="middle" class="title purple">Agent Loop · Inbox → Turn → Step</text>
    <text x="400" y="501" text-anchor="middle" class="body">组装上下文，准备请求，消费模型响应并调度工具</text>
  </g>
  <g data-box="model">
    <rect x="68" y="594" width="290" height="88" rx="10" fill="#eeedfe" stroke="#534ab7" stroke-width="0.8"/>
    <text x="213" y="622" text-anchor="middle" class="name purple">LLM Runtime / Adapter</text>
    <text x="213" y="646" text-anchor="middle" class="body">准备模型调用，转换流式响应</text>
    <text x="213" y="666" text-anchor="middle" class="body">/messages · DeepSeek 示例</text>
  </g>
  <g data-box="tools">
    <rect x="442" y="594" width="290" height="88" rx="10" fill="#faeeda" stroke="#854f0b" stroke-width="0.8"/>
    <text x="587" y="622" text-anchor="middle" class="name orange">Tools · 策略与执行</text>
    <text x="587" y="646" text-anchor="middle" class="body">参数校验、审批、调用与结果</text>
    <text x="587" y="666" text-anchor="middle" class="body">文件 / Shell / 外部能力</text>
  </g>
  <g data-box="session">
    <rect x="68" y="734" width="664" height="78" rx="10" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.8"/>
    <text x="400" y="765" text-anchor="middle" class="name blue">Session · 事件日志</text>
    <text x="400" y="790" text-anchor="middle" class="body">消息、工具结果与边界事件 → 模型历史和客户端重放</text>
  </g>

  <text x="225" y="229" class="body">prompt · 输入上行</text>
  <text x="599" y="229" class="body green">follow · 输出下行</text>
  <text x="225" y="416" class="body">followup → Inbox</text>
  <text x="225" y="568" class="body">请求 / 流式响应</text>
  <text x="599" y="568" class="body">调用 / 结果</text>
  <rect x="350" y="698" width="100" height="22" fill="#ffffff"/>
  <text x="400" y="713" text-anchor="middle" class="body">提交事件</text>

  <path d="M52 874H88" class="main"/>
  <text x="100" y="878" class="body">主请求与执行</text>
  <path d="M270 874H306" class="events"/>
  <text x="318" y="878" class="body green">实时帧与日志下行</text>
  <text x="52" y="902" class="body">日志提交与磁盘刷盘分别处理；本图展示结构关系，时序见另一张图。</text>
  <text x="36" y="48" class="title">一次用户请求，经过哪些 dsh 模块？</text>
  <text x="36" y="74" class="body">Web 普通会话 · queue 提交 · 源码 d7432673</text>
</svg>
