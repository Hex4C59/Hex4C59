<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="736" viewBox="0 0 800 736" role="img" aria-labelledby="packet-playout-title packet-playout-desc" id="packet-playout-root">
<title id="packet-playout-title">收到包与赶上播放是两次判断</title>
<desc id="packet-playout-desc">六个预期包中202在58毫秒收到并在63毫秒准备好，错过60毫秒的播放；204到160毫秒未见，其他四包按时，重复201不提供新声音。</desc>
<defs>
      <style>#packet-playout-root { color: #29323f; font-family: "Hex Sans", "Hex Han Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; }
      #packet-playout-root .diagram-container { width:100%;overflow-x:auto }
      #packet-playout-root .diagram-container { overflow:visible }</style><pattern id="packet-playout-packet-playout-processing" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f1ede7"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#ddd7cf" stroke-width="1"/></pattern></defs>
<rect x="0" y="0" width="800" height="736" rx="0" fill="#fcfaf7" stroke="none" stroke-width="1" />
<text x="32" y="40" font-size="25" fill="#29323f" font-weight="600" text-anchor="start" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >收到了，不一定赶上播放</text>
<text x="32" y="70" font-size="16" fill="#64666b" font-weight="400" text-anchor="start" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >第一次到达 + 5 ms 准备，对照每包的播放计划；观察截止为本地 160 ms。</text>
<line x1="240" y1="112" x2="240" y2="624" stroke="#ddd7cf" stroke-width="1" />
<line x1="366" y1="112" x2="366" y2="624" stroke="#ddd7cf" stroke-width="1" />
<line x1="492" y1="112" x2="492" y2="624" stroke="#ddd7cf" stroke-width="1" />
<line x1="618" y1="112" x2="618" y2="624" stroke="#ddd7cf" stroke-width="1" />
<line x1="744" y1="112" x2="744" y2="624" stroke="#ddd7cf" stroke-width="1" />
<text x="32" y="154" font-size="20" fill="#29323f" font-weight="600" text-anchor="start" font-family="&quot;Monaspace&quot;, &quot;SFMono-Regular&quot;, Consolas, monospace" >200</text>
<text x="32" y="178" font-size="16" fill="#64666b" font-weight="400" text-anchor="start" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >赶上</text>
<line x1="303" y1="136" x2="303" y2="172" stroke="#64666b" stroke-width="2" data-sequence="200" data-playout-ms="20"/>
<text x="303" y="194" font-size="14" fill="#64666b" font-weight="400" text-anchor="middle" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >播放 20</text>
<rect x="240" y="144" width="15.75" height="20" rx="0" fill="#e9edf4" stroke="#405d91" stroke-width="1" data-sequence="200" data-arrival-ms="0" data-ready-ms="5" data-playout-ms="20"/>
<circle cx="240" cy="144" r="2" fill="#405d91"/>
<text x="244" y="134" font-size="14" fill="#405d91" font-weight="400" text-anchor="start" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >0 → 5</text>
<text x="32" y="234" font-size="20" fill="#29323f" font-weight="600" text-anchor="start" font-family="&quot;Monaspace&quot;, &quot;SFMono-Regular&quot;, Consolas, monospace" >201</text>
<text x="32" y="258" font-size="16" fill="#64666b" font-weight="400" text-anchor="start" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >赶上</text>
