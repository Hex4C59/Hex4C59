<rect x="303" y="224" width="15.75" height="20" rx="0" fill="#e9edf4" stroke="#405d91" stroke-width="1" data-sequence="201" data-arrival-ms="20" data-ready-ms="25" data-playout-ms="40"/>
<circle cx="303" cy="224" r="2" fill="#405d91"/>
<text x="310.875" y="214" font-size="14" fill="#405d91" font-weight="400" text-anchor="middle" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >20 → 25</text>
<text x="32" y="314" font-size="20" fill="#29323f" font-weight="600" text-anchor="start" font-family="&quot;Monaspace&quot;, &quot;SFMono-Regular&quot;, Consolas, monospace" >202</text>
<text x="32" y="338" font-size="16" fill="#a13c54" font-weight="400" text-anchor="start" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >迟到 3 ms</text>
<line x1="429" y1="296" x2="429" y2="332" stroke="#a13c54" stroke-width="2" data-sequence="202" data-playout-ms="60"/>
<text x="429" y="354" font-size="14" fill="#64666b" font-weight="400" text-anchor="middle" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >播放 60</text>
<rect x="422.7" y="304" width="15.75" height="20" rx="0" fill="#f5e8e9" stroke="#a13c54" stroke-width="1" data-sequence="202" data-arrival-ms="58" data-ready-ms="63" data-playout-ms="60"/>
<circle cx="422.7" cy="304" r="2" fill="#a13c54"/>
<text x="430.575" y="294" font-size="14" fill="#a13c54" font-weight="400" text-anchor="middle" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >58 → 63</text>
<text x="32" y="394" font-size="20" fill="#29323f" font-weight="600" text-anchor="start" font-family="&quot;Monaspace&quot;, &quot;SFMono-Regular&quot;, Consolas, monospace" >203</text>
<text x="32" y="418" font-size="16" fill="#64666b" font-weight="400" text-anchor="start" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >赶上</text>
<line x1="492" y1="376" x2="492" y2="412" stroke="#64666b" stroke-width="2" data-sequence="203" data-playout-ms="80"/>
<text x="492" y="434" font-size="14" fill="#64666b" font-weight="400" text-anchor="middle" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >播放 80</text>
<rect x="366" y="384" width="15.75" height="20" rx="0" fill="#e9edf4" stroke="#405d91" stroke-width="1" data-sequence="203" data-arrival-ms="40" data-ready-ms="45" data-playout-ms="80"/>
<circle cx="366" cy="384" r="2" fill="#405d91"/>
<text x="373.875" y="374" font-size="14" fill="#405d91" font-weight="400" text-anchor="middle" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >40 → 45</text>
<text x="32" y="474" font-size="20" fill="#29323f" font-weight="600" text-anchor="start" font-family="&quot;Monaspace&quot;, &quot;SFMono-Regular&quot;, Consolas, monospace" >204</text>
<text x="32" y="498" font-size="16" fill="#a13c54" font-weight="400" text-anchor="start" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >到期缺失</text>
<line x1="555" y1="456" x2="555" y2="492" stroke="#64666b" stroke-width="2" stroke-dasharray="4,3" data-sequence="204" data-playout-ms="100"/>
<text x="555" y="514" font-size="14" fill="#64666b" font-weight="400" text-anchor="middle" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >播放 100</text>
<text x="248" y="478" font-size="15" fill="#64666b" font-weight="400" text-anchor="start" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >截至 160 ms 未观察到</text>
<text x="32" y="554" font-size="20" fill="#29323f" font-weight="600" text-anchor="start" font-family="&quot;Monaspace&quot;, &quot;SFMono-Regular&quot;, Consolas, monospace" >205</text>
<text x="32" y="578" font-size="16" fill="#64666b" font-weight="400" text-anchor="start" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >赶上</text>
<line x1="618" y1="536" x2="618" y2="572" stroke="#64666b" stroke-width="2" data-sequence="205" data-playout-ms="120"/>
<text x="618" y="594" font-size="14" fill="#64666b" font-weight="400" text-anchor="middle" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >播放 120</text>
<rect x="539.25" y="544" width="15.75" height="20" rx="0" fill="#e9edf4" stroke="#405d91" stroke-width="1" data-sequence="205" data-arrival-ms="95" data-ready-ms="100" data-playout-ms="120"/>
