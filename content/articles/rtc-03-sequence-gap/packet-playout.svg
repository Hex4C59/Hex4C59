<text x="547.125" y="534" font-size="14" fill="#405d91" font-weight="400" text-anchor="middle" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >95 → 100</text>
<line x1="240" y1="636" x2="240" y2="644" stroke="#64666b" stroke-width="1" />
<text x="240" y="664" font-size="14" fill="#64666b" font-weight="400" text-anchor="middle" font-family="&quot;Monaspace&quot;, &quot;SFMono-Regular&quot;, Consolas, monospace" >0</text>
<line x1="366" y1="636" x2="366" y2="644" stroke="#64666b" stroke-width="1" />
<text x="366" y="664" font-size="14" fill="#64666b" font-weight="400" text-anchor="middle" font-family="&quot;Monaspace&quot;, &quot;SFMono-Regular&quot;, Consolas, monospace" >40</text>
<line x1="492" y1="636" x2="492" y2="644" stroke="#64666b" stroke-width="1" />
<text x="492" y="664" font-size="14" fill="#64666b" font-weight="400" text-anchor="middle" font-family="&quot;Monaspace&quot;, &quot;SFMono-Regular&quot;, Consolas, monospace" >80</text>
<line x1="618" y1="636" x2="618" y2="644" stroke="#64666b" stroke-width="1" />
<text x="618" y="664" font-size="14" fill="#64666b" font-weight="400" text-anchor="middle" font-family="&quot;Monaspace&quot;, &quot;SFMono-Regular&quot;, Consolas, monospace" >120</text>
<line x1="744" y1="636" x2="744" y2="644" stroke="#64666b" stroke-width="1" />
<text x="744" y="664" font-size="14" fill="#64666b" font-weight="400" text-anchor="middle" font-family="&quot;Monaspace&quot;, &quot;SFMono-Regular&quot;, Consolas, monospace" >160</text>
<line x1="240" y1="640" x2="744" y2="640" stroke="#64666b" stroke-width="1" />
<text x="32" y="690" font-size="18" fill="#29323f" font-weight="500" text-anchor="start" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >202 补齐了序号，仍错过播放期限。</text>
<text x="32" y="714" font-size="14" fill="#64666b" font-weight="400" text-anchor="start" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >短条：到达 → 准备好；标线：计划播放。</text>
</svg>
