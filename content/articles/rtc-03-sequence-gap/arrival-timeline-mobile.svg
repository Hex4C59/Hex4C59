<svg xmlns="http://www.w3.org/2000/svg" width="360" height="430" viewBox="0 0 360 430" role="img" aria-labelledby="title desc">
  <title id="title">同样的缺口，两种后续到达情况</title>
  <desc id="desc">上方为甲，下方为乙。两种情况在第 0、20、40 毫秒分别收到 200、201、203，暂缺 202。甲在第 50 毫秒收到 202，乙在第 70 毫秒收到。虚线是 202 对应声音在第 60 毫秒原定的播放时刻；加上 5 毫秒准备，甲可赶上，乙来不及。全部时刻属于接收端同一条本地时间轴。</desc>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; fill: #373733; }
    .group { font-size: 20px; font-weight: 600; }
    .packet { font-size: 18px; text-anchor: middle; }
    .note { font-size: 14px; fill: #656560; }
    .axis { stroke: #9a9a91; stroke-width: 1; fill: none; }
    .tick { stroke: #bfbfb6; stroke-width: 1; }
    .point { fill: #373733; }
    .focus { fill: #8f455d; }
    .deadline { stroke: #8f455d; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
    .leader { stroke: #8f455d; stroke-width: 1; fill: none; }
  </style>
  <rect width="360" height="430" fill="#fff"/>
  <text class="note" x="24" y="28">接收端本地时间（毫秒）</text>
  <text class="group" x="24" y="64">甲</text>
  <text class="note focus" x="248" y="64" text-anchor="middle">202 的播放时刻</text>
  <text class="note focus" x="248" y="84" text-anchor="middle">60 毫秒</text>
  <path class="deadline" d="M248 94V178"/>
  <path class="axis" d="M32 142H320"/>
  <g class="point"><circle cx="32" cy="142" r="3"/><circle cx="104" cy="142" r="3"/><circle cx="176" cy="142" r="3"/></g>
  <circle class="focus" cx="212" cy="142" r="5"/>
  <g class="packet"><text x="32" y="130">200</text><text x="104" y="130">201</text><text x="176" y="130">203</text><text class="focus" x="212" y="108">202</text></g>
  <path class="leader" d="M212 114V134"/>
  <g class="note" text-anchor="middle"><text x="32" y="174">0</text><text x="104" y="174">20</text><text x="176" y="174">40</text><text class="focus" x="212" y="174">50</text><text x="320" y="174">80</text></g>
  <text class="note" x="24" y="204">50 毫秒到达 · 55 毫秒准备好</text>

  <text class="group" x="24" y="264">乙</text>
  <text class="note focus" x="248" y="264" text-anchor="middle">202 的播放时刻</text>
  <text class="note focus" x="248" y="284" text-anchor="middle">60 毫秒</text>
  <path class="deadline" d="M248 294V378"/>
  <path class="axis" d="M32 342H320"/>
  <g class="point"><circle cx="32" cy="342" r="3"/><circle cx="104" cy="342" r="3"/><circle cx="176" cy="342" r="3"/></g>
  <circle class="focus" cx="284" cy="342" r="5"/>
  <g class="packet"><text x="32" y="330">200</text><text x="104" y="330">201</text><text x="176" y="330">203</text><text class="focus" x="284" y="330">202</text></g>
  <g class="note" text-anchor="middle"><text x="32" y="374">0</text><text x="104" y="374">20</text><text x="176" y="374">40</text><text class="focus" x="284" y="374">70</text><text x="320" y="374">80</text></g>
  <text class="note" x="24" y="408">70 毫秒到达 · 75 毫秒准备好</text>
</svg>
