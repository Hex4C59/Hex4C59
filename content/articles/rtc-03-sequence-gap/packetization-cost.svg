<title id="packetization-cost-title">相同音频负载，更短的包付出更多报头开销</title>
<desc id="packetization-cost-desc">固定32kbit每秒音频负载，每包40字节报头；10、20、40毫秒打包分别每秒100、50、25包，IP层总码率64、48、40kbit每秒。</desc>
