<title id="rtp-header-map-title">把12字节RTP报头切成字段</title>
<desc id="rtp-header-map-desc">简化RTP报头由两个控制字节、两字节序列号、四字节时间戳和四字节SSRC组成，本例读出PT111、序号202、时间戳9920和SSRC0x11223344。</desc>
