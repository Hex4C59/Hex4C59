      <style>#playout-deadline-root { color: #29323f; font-family: "Hex Sans", "Hex Han Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; }
      #playout-deadline-root .diagram-container { width:100%;overflow-x:auto }
