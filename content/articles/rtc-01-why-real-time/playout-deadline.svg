<title id="playout-deadline-title">多等一点，C 就赶上了吗</title>
<desc id="playout-deadline-desc">C段在145毫秒收到，最早在165毫秒输出；10、30、40毫秒缓冲分别把播放安排在140、160、170毫秒，对应迟到25、迟到5和剩余5毫秒。</desc>
