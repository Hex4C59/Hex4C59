<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220" role="img" aria-labelledby="title desc">
  <title id="title">声音从电脑到手机的路径</title>
  <desc id="desc">声音从电脑麦克风采集后，经过编码、等待发送和网络传输，到手机接收缓冲、解码，最后由扬声器播放。发送前声音还在电脑，接收缓冲中的数据已经到达手机。箭头仅表示处理顺序，不表示耗时长短。</desc>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; fill: #373733; }
    .group { font-size: 20px; font-weight: 600; }
    .step { font-size: 18px; }
    .note { font-size: 14px; fill: #656560; }
    .wait { fill: #8f455d; }
    .rule { stroke: #d7d7d0; stroke-width: 1; }
    .route { fill: none; stroke: #71716b; stroke-width: 1.5; marker-end: url(#arrow); }
    .point { fill: #373733; }
    .wait-point { fill: #8f455d; }
    .leader { fill: none; stroke: #8f455d; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#71716b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="800" height="220" fill="#fff"/>
  <text class="group" x="32" y="32">电脑<tspan class="note" dx="12">发送端</tspan></text>
  <text class="group" x="354" y="32">网络</text>
  <text class="group" x="496" y="32">手机<tspan class="note" dx="12">接收端</tspan></text>
  <path class="rule" d="M32 50H292 M336 50H452 M496 50H768"/>

  <g class="step" text-anchor="middle">
    <text x="64" y="99">采集</text>
    <text x="162" y="99">编码</text>
    <text class="wait" x="260" y="99">等待发送</text>
    <text x="394" y="99">传输</text>
    <text class="wait" x="528" y="99">接收缓冲</text>
    <text x="626" y="99">解码</text>
    <text x="724" y="99">播放</text>
  </g>
  <path class="route" d="M72 125H150"/>
  <path class="route" d="M170 125H248"/>
  <path class="route" d="M270 125H382"/>
  <path class="route" d="M402 125H516"/>
  <path class="route" d="M538 125H614"/>
  <path class="route" d="M634 125H712"/>
  <g class="point">
    <circle cx="64" cy="125" r="3"/>
    <circle cx="162" cy="125" r="3"/>
    <circle cx="394" cy="125" r="3"/>
    <circle cx="626" cy="125" r="3"/>
    <circle cx="724" cy="125" r="3"/>
  </g>
  <g class="wait-point">
    <circle cx="260" cy="125" r="5"/>
    <circle cx="528" cy="125" r="5"/>
  </g>
  <path class="leader" d="M260 138V166 M528 138V166"/>
  <g class="note" text-anchor="middle">
    <text x="64" y="160">麦克风</text>
    <text x="724" y="160">扬声器</text>
    <text class="wait" x="260" y="192">声音还在电脑里</text>
    <text class="wait" x="528" y="192">数据已经到达手机</text>
  </g>
</svg>
