<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>信令与实际数据路径</title><style>
:root{--paper:#faf9f6;--ink:#242320;--muted:#66635d;--rule:#c2beb5;--accent:#126d61;--link:#6044ab;color-scheme:light dark;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}@media(prefers-color-scheme:dark){:root{--paper:#242320;--ink:#faf9f6;--muted:#c2beb5;--rule:#6d6962;--accent:#8cd9cd;--link:#c3b1f8}}*{box-sizing:border-box}body{margin:0}main{max-width:816px;margin:auto;padding:28px 20px 32px}.eyebrow{font-size:14px;color:var(--muted);margin:0 0 12px}h1{font-family:"Songti SC",Georgia,serif;font-size:30px;line-height:1.35;margin:0 0 12px}p{font-size:15px;line-height:1.8;margin:12px 0}.choices{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}label{cursor:pointer;border-bottom:2px solid var(--rule);padding:8px 12px;font-size:16px;line-height:1.5}input{accent-color:var(--accent);width:18px;height:18px;vertical-align:middle;margin:0 6px 2px 0}label:has(input:checked){border-color:var(--accent);color:var(--accent);font-weight:600}label:has(input:focus-visible){outline:3px solid var(--link);outline-offset:4px}.case{display:none}main:has(#direct:checked) .direct,main:has(#relay:checked) .relay{display:block}.scroll{overflow-x:auto}.wide{display:block}.compact{display:none}svg{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:block;width:100%;height:auto;min-width:720px;color:var(--ink)}.node{fill:var(--paper);stroke:var(--muted);stroke-width:1.2}.name{font-size:17px;font-weight:600;fill:var(--ink);text-anchor:middle}.sub{font-size:14px;fill:var(--muted);text-anchor:middle}.control{fill:none;stroke:var(--link);stroke-width:1.6;stroke-dasharray:5 4}.data{fill:none;stroke:var(--accent);stroke-width:2.4}.label{font-size:14px;fill:var(--ink);text-anchor:middle}.teal{fill:var(--accent)}.purple{fill:var(--link)}.note{color:var(--muted);font-size:14px}.legend{display:flex;gap:16px;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:16px;font-size:14px}.legend span{display:flex;align-items:center;gap:8px}.sample{display:inline-block;width:28px;border-top:2px solid var(--accent)}.sample.control-line{border-color:var(--link);border-top-style:dashed}@media(max-width:759px){main{padding:24px 16px}h1{font-size:26px}.wide{display:none}.compact{display:block}svg{min-width:320px;max-width:400px;margin:auto}}@media print{.scroll{overflow:visible}svg{min-width:0}.wide{display:block}.compact{display:none}}
</style></head><body><main><p class="eyebrow">RTC 07 / 路径对照 · 示意图</p><h1>信令送达后，数据走哪条路？</h1><p>切换已选路径。两端交换会话说明与候选；实际数据可以直达对端，也可以经过中继。</p><div class="choices" role="group" aria-label="选择已选数据路径"><label><input type="radio" id="direct" name="route" checked>直连路径</label><label><input type="radio" id="relay" name="route">经 TURN 中继</label></div><section class="case direct" aria-label="直连路径"><div class="scroll wide"><svg viewBox="0 0 720 408" role="img" aria-labelledby="connection-paths-direct-wide-title connection-paths-direct-wide-desc"><title id="connection-paths-direct-wide-title">直连的数据路径</title><desc id="connection-paths-direct-wide-desc">上方信令服务交换会话说明与候选，下方数据直接在 A 和 B 间传输。</desc><defs><marker id="connection-paths-direct-wide-control" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--link)"/></marker></defs><defs><marker id="connection-paths-direct-wide-data" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--accent)"/></marker></defs><path d="M104 164 V88 Q104 80 112 80 H292" class="control" marker-start="url(#connection-paths-direct-wide-control)" marker-end="url(#connection-paths-direct-wide-control)"/><path d="M428 80 H608 Q616 80 616 88 V164" class="control" marker-start="url(#connection-paths-direct-wide-control)" marker-end="url(#connection-paths-direct-wide-control)"/><text x="200" y="60" class="label purple">交换会话信息</text><text x="520" y="60" class="label purple">交换会话信息</text><path d="M168 200 H552" class="data" marker-start="url(#connection-paths-direct-wide-data)" marker-end="url(#connection-paths-direct-wide-data)"/><text x="360" y="180" class="label teal">已选：直接传输</text><text x="360" y="240" class="sub">两端之间的实际数据</text><rect x="40" y="164" width="128" height="72" rx="6" class="node"/><text x="104" y="192" class="name">A</text><text x="104" y="216" class="sub">本端</text><rect x="552" y="164" width="128" height="72" rx="6" class="node"/><text x="616" y="192" class="name">B</text><text x="616" y="216" class="sub">对端</text><rect x="292" y="40" width="136" height="64" rx="6" class="node"/><text x="360" y="68" class="name">信令服务</text><text x="360" y="92" class="sub">会话说明与候选</text><text x="360" y="348" class="sub">持续数据不必经过信令服务或 STUN 服务</text></svg></div><div class="scroll compact"><svg viewBox="0 0 320 408" role="img" aria-labelledby="connection-paths-direct-compact-title connection-paths-direct-compact-desc"><title id="connection-paths-direct-compact-title">直连的数据路径</title><desc id="connection-paths-direct-compact-desc">上方信令服务交换会话说明与候选，下方数据直接在 A 和 B 间传输。</desc><defs><marker id="connection-paths-direct-compact-control" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--link)"/></marker></defs><defs><marker id="connection-paths-direct-compact-data" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--accent)"/></marker></defs><path d="M64 164 V76 Q64 68 72 68 H100" class="control" marker-start="url(#connection-paths-direct-compact-control)" marker-end="url(#connection-paths-direct-compact-control)"/><path d="M220 68 H248 Q256 68 256 76 V164" class="control" marker-start="url(#connection-paths-direct-compact-control)" marker-end="url(#connection-paths-direct-compact-control)"/><text x="88" y="128" class="label purple">信令</text><text x="232" y="128" class="label purple">信令</text><path d="M108 200 H212" class="data" marker-start="url(#connection-paths-direct-compact-data)" marker-end="url(#connection-paths-direct-compact-data)"/><text x="160" y="248" class="label teal">已选：直接传输</text><text x="160" y="332" class="sub">数据不必经过</text><text x="160" y="356" class="sub">信令服务或 STUN 服务</text><rect x="20" y="164" width="88" height="72" rx="6" class="node"/><text x="64" y="192" class="name">A</text><text x="64" y="216" class="sub">本端</text><rect x="212" y="164" width="88" height="72" rx="6" class="node"/><text x="256" y="192" class="name">B</text><text x="256" y="216" class="sub">对端</text><rect x="100" y="36" width="120" height="64" rx="6" class="node"/><text x="160" y="64" class="name">信令服务</text><text x="160" y="88" class="sub">说明与候选</text></svg></div><p>直连表示这条数据路径不使用 TURN。图中的双向箭头对应已检查并选中的组合；收集到候选时还不能画成这条已通路径。</p></section><section class="case relay" aria-label="中继路径"><div class="scroll wide"><svg viewBox="0 0 720 408" role="img" aria-labelledby="connection-paths-relay-wide-title connection-paths-relay-wide-desc"><title id="connection-paths-relay-wide-title">TURN 中继的数据路径</title><desc id="connection-paths-relay-wide-desc">上方信令服务交换会话说明与候选，下方数据沿 A 到 TURN 到 B 的路径传输，反向同样经过中继。</desc><defs><marker id="connection-paths-relay-wide-control" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--link)"/></marker></defs><defs><marker id="connection-paths-relay-wide-data" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--accent)"/></marker></defs><path d="M104 164 V88 Q104 80 112 80 H292" class="control" marker-start="url(#connection-paths-relay-wide-control)" marker-end="url(#connection-paths-relay-wide-control)"/><path d="M428 80 H608 Q616 80 616 88 V164" class="control" marker-start="url(#connection-paths-relay-wide-control)" marker-end="url(#connection-paths-relay-wide-control)"/><text x="200" y="60" class="label purple">交换会话信息</text><text x="520" y="60" class="label purple">交换会话信息</text><path d="M104 236 V324 Q104 332 112 332 H292" class="data" marker-start="url(#connection-paths-relay-wide-data)" marker-end="url(#connection-paths-relay-wide-data)"/><path d="M428 332 H608 Q616 332 616 324 V236" class="data" marker-start="url(#connection-paths-relay-wide-data)" marker-end="url(#connection-paths-relay-wide-data)"/><text x="200" y="312" class="label teal">客户端到中继</text><text x="520" y="312" class="label teal">中继到对端</text><rect x="292" y="300" width="136" height="64" rx="6" class="node"/><text x="360" y="328" class="name">TURN</text><text x="360" y="352" class="sub">转发数据</text><rect x="40" y="164" width="128" height="72" rx="6" class="node"/><text x="104" y="192" class="name">A</text><text x="104" y="216" class="sub">本端</text><rect x="552" y="164" width="128" height="72" rx="6" class="node"/><text x="616" y="192" class="name">B</text><text x="616" y="216" class="sub">对端</text><rect x="292" y="40" width="136" height="64" rx="6" class="node"/><text x="360" y="68" class="name">信令服务</text><text x="360" y="92" class="sub">会话说明与候选</text><text x="360" y="396" class="sub">只有一端使用 relay，也可以形成中继路径</text></svg></div><div class="scroll compact"><svg viewBox="0 0 320 408" role="img" aria-labelledby="connection-paths-relay-compact-title connection-paths-relay-compact-desc"><title id="connection-paths-relay-compact-title">TURN 中继的数据路径</title><desc id="connection-paths-relay-compact-desc">上方信令服务交换会话说明与候选，下方数据沿 A 到 TURN 到 B 的路径传输，反向同样经过中继。</desc><defs><marker id="connection-paths-relay-compact-control" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--link)"/></marker></defs><defs><marker id="connection-paths-relay-compact-data" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--accent)"/></marker></defs><path d="M64 164 V76 Q64 68 72 68 H100" class="control" marker-start="url(#connection-paths-relay-compact-control)" marker-end="url(#connection-paths-relay-compact-control)"/><path d="M220 68 H248 Q256 68 256 76 V164" class="control" marker-start="url(#connection-paths-relay-compact-control)" marker-end="url(#connection-paths-relay-compact-control)"/><text x="88" y="128" class="label purple">信令</text><text x="232" y="128" class="label purple">信令</text><path d="M64 236 V324 Q64 332 72 332 H100" class="data" marker-start="url(#connection-paths-relay-compact-data)" marker-end="url(#connection-paths-relay-compact-data)"/><path d="M220 332 H248 Q256 332 256 324 V236" class="data" marker-start="url(#connection-paths-relay-compact-data)" marker-end="url(#connection-paths-relay-compact-data)"/><text x="88" y="284" class="label teal">数据</text><text x="232" y="284" class="label teal">数据</text><rect x="100" y="300" width="120" height="64" rx="6" class="node"/><text x="160" y="328" class="name">TURN</text><text x="160" y="352" class="sub">转发数据</text><text x="160" y="396" class="sub">两个方向均经过这次中继</text><rect x="20" y="164" width="88" height="72" rx="6" class="node"/><text x="64" y="192" class="name">A</text><text x="64" y="216" class="sub">本端</text><rect x="212" y="164" width="88" height="72" rx="6" class="node"/><text x="256" y="192" class="name">B</text><text x="256" y="216" class="sub">对端</text><rect x="100" y="36" width="120" height="64" rx="6" class="node"/><text x="160" y="64" class="name">信令服务</text><text x="160" y="88" class="sub">说明与候选</text></svg></div><p>本例 A 使用 relay 候选，B 可使用可达的非 relay 候选。A → TURN → B 与 B → TURN → A 都经过这次中继，不要求双方各有一个中继。</p></section><div class="legend"><span><i class="sample control-line" aria-hidden="true"></i>虚线：会话控制信息</span><span><i class="sample" aria-hidden="true"></i>实线：已选数据路径</span></div><p class="note">仅比较信令与持续数据的位置。地址发现、安全握手和底层路由未展开；STUN 地址发现不等于持续转发媒体。</p></main></body></html>
