<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220" role="img" aria-labelledby="title desc">
  <title id="title">PCM、编码内容和 RTP 包</title>
  <desc id="desc">PCM 样本经过编码得到编码内容，打包再为编码内容添加包含序列号和时间戳等信息的 RTP 报头。图中的 PCM 数值仅作示意，图形尺寸不表示字节数，省略安全处理与下层网络封装。</desc>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; fill: #373733; }
    .title { font-size: 20px; font-weight: 600; }
    .body { font-size: 18px; }
    .note { font-size: 14px; fill: #656560; }
    .outline { fill: #fff; stroke: #8b8b83; stroke-width: 1; }
    .payload { fill: #f0f0eb; }
    .route { fill: none; stroke: #71716b; stroke-width: 1.5; marker-end: url(#arrow); }
    .header { fill: #8f455d; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#71716b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="800" height="220" fill="#fff"/>
  <g class="title">
    <text x="24" y="44">PCM 样本</text>
    <text x="312" y="44">编码内容</text>
    <text x="600" y="44">RTP 包</text>
  </g>
  <rect class="outline" x="24" y="88" width="176" height="76"/>
  <g class="body" text-anchor="middle">
    <text x="112" y="119">120 · 80 · −30</text>
    <text x="112" y="146">−90 · −10 · 60</text>
  </g>
  <path class="route" d="M214 126H294"/>
  <text class="note" x="254" y="109" text-anchor="middle">编码</text>
  <rect class="payload" x="312" y="88" width="176" height="76"/>
  <rect x="312" y="88" width="176" height="76" fill="none" stroke="#8b8b83"/>
  <text class="body" x="400" y="133" text-anchor="middle">编码内容</text>
  <path class="route" d="M502 126H582"/>
  <text class="note" x="542" y="109" text-anchor="middle">打包</text>
  <rect class="outline" x="600" y="88" width="176" height="76"/>
  <rect class="payload" x="600.5" y="120" width="175" height="43.5"/>
  <path d="M600 120H776" fill="none" stroke="#8f455d"/>
  <text class="note header" x="688" y="109" text-anchor="middle">序列号 · 时间戳等</text>
  <text class="body" x="688" y="149" text-anchor="middle">编码内容</text>
  <g class="note" text-anchor="middle">
    <text x="112" y="196">可逐个处理的声音数值</text>
    <text x="400" y="196">供解码器解释的字节</text>
    <text x="688" y="196">报头 + 负载</text>
  </g>
</svg>
