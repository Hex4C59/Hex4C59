<text x="32" y="325" font-size="18" fill="#29323f" font-weight="600" text-anchor="start" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >第 3 块</text>
<text x="32" y="350" font-size="14" fill="#64666b" font-weight="400" text-anchor="start" font-family="&quot;Monaspace&quot;, &quot;SFMono-Regular&quot;, Consolas, monospace" >40 → 44 ms</text>
<rect x="256" y="308" width="19.04" height="24" rx="0" fill="#f1ede7" stroke="#64666b" stroke-width="1" data-block="3" data-arrival-ms="40" data-start-ms="44" data-wait-ms="4"/>
