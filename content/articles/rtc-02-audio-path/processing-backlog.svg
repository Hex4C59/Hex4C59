<text x="32" y="409" font-size="18" fill="#29323f" font-weight="600" text-anchor="start" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >第 50 块</text>
<text x="32" y="434" font-size="14" fill="#64666b" font-weight="400" text-anchor="start" font-family="&quot;Monaspace&quot;, &quot;SFMono-Regular&quot;, Consolas, monospace" >980 → 1078 ms</text>
<rect x="256" y="392" width="466.48" height="24" rx="0" fill="#f5e8e9" stroke="#a13c54" stroke-width="1" data-block="50" data-arrival-ms="980" data-start-ms="1078" data-wait-ms="98"/>
<text x="714.48" y="410" font-size="16" fill="#a13c54" font-weight="400" text-anchor="end" font-family="&quot;Monaspace&quot;, &quot;SFMono-Regular&quot;, Consolas, monospace" >98 ms</text>
<line x1="256" y1="452" x2="256" y2="460" stroke="#64666b" stroke-width="1" />
<text x="256" y="480" font-size="14" fill="#64666b" font-weight="400" text-anchor="middle" font-family="&quot;Monaspace&quot;, &quot;SFMono-Regular&quot;, Consolas, monospace" >0</text>
<line x1="375" y1="452" x2="375" y2="460" stroke="#64666b" stroke-width="1" />
<text x="375" y="480" font-size="14" fill="#64666b" font-weight="400" text-anchor="middle" font-family="&quot;Monaspace&quot;, &quot;SFMono-Regular&quot;, Consolas, monospace" >25</text>
<line x1="494" y1="452" x2="494" y2="460" stroke="#64666b" stroke-width="1" />
<text x="494" y="480" font-size="14" fill="#64666b" font-weight="400" text-anchor="middle" font-family="&quot;Monaspace&quot;, &quot;SFMono-Regular&quot;, Consolas, monospace" >50</text>
<line x1="613" y1="452" x2="613" y2="460" stroke="#64666b" stroke-width="1" />
<text x="613" y="480" font-size="14" fill="#64666b" font-weight="400" text-anchor="middle" font-family="&quot;Monaspace&quot;, &quot;SFMono-Regular&quot;, Consolas, monospace" >75</text>
<line x1="732" y1="452" x2="732" y2="460" stroke="#64666b" stroke-width="1" />
<text x="732" y="480" font-size="14" fill="#64666b" font-weight="400" text-anchor="middle" font-family="&quot;Monaspace&quot;, &quot;SFMono-Regular&quot;, Consolas, monospace" >100</text>
<line x1="256" y1="456" x2="732" y2="456" stroke="#64666b" stroke-width="1" />
<text x="32" y="520" font-size="18" fill="#29323f" font-weight="500" text-anchor="start" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >第 50 块已等 98 ms，才开始处理。</text>
<text x="32" y="542" font-size="14" fill="#64666b" font-weight="400" text-anchor="start" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >横轴：排队等待 · 标签：到达 → 开始</text>
</svg>
