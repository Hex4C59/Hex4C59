<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="632" viewBox="0 0 360 632" role="img" aria-labelledby="processing-backlog-mobile-title processing-backlog-mobile-desc" id="processing-backlog-mobile-root">
<title id="processing-backlog-mobile-title">每块多用2毫秒，队列等待怎样累积</title>
<desc id="processing-backlog-mobile-desc">单个串行处理者每20毫秒收到一块，每块处理22毫秒，第1、2、3、50块分别等待0、2、4、98毫秒。</desc>
<defs>
      <style>#processing-backlog-mobile-root { color: #29323f; font-family: "Hex Sans", "Hex Han Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; }
      #processing-backlog-mobile-root .diagram-container { width:100%;overflow-x:auto }
      #processing-backlog-mobile-root .diagram-container { overflow:visible }</style><pattern id="processing-backlog-mobile-processing-backlog-mobile-processing" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f1ede7"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#ddd7cf" stroke-width="1"/></pattern></defs>
<rect x="0" y="0" width="360" height="632" rx="0" fill="#fcfaf7" stroke="none" stroke-width="1" />
<text x="20" y="34" font-size="21" fill="#29323f" font-weight="600" text-anchor="start" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >每块慢 2 ms，等待不断累积</text>
<text x="20" y="62" font-size="14" fill="#64666b" font-weight="400" text-anchor="start" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >每 20 ms 来一块；处理每块需 22 ms</text>
<text x="20" y="83" font-size="14" fill="#64666b" font-weight="400" text-anchor="start" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >单个串行处理者 · 固定耗时</text>
