<text x="20" y="440" font-size="16" fill="#29323f" font-weight="600" text-anchor="start" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >第 50 块</text>
<text x="332" y="440" font-size="13" fill="#64666b" font-weight="400" text-anchor="end" font-family="&quot;Monaspace&quot;, &quot;SFMono-Regular&quot;, Consolas, monospace" >980 → 1078 ms</text>
