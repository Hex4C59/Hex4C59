<line x1="176" y1="520" x2="176" y2="528" stroke="#64666b" stroke-width="1" />
<text x="176" y="548" font-size="13" fill="#64666b" font-weight="400" text-anchor="middle" font-family="&quot;Monaspace&quot;, &quot;SFMono-Regular&quot;, Consolas, monospace" >50</text>
<line x1="254" y1="520" x2="254" y2="528" stroke="#64666b" stroke-width="1" />
<text x="254" y="548" font-size="13" fill="#64666b" font-weight="400" text-anchor="middle" font-family="&quot;Monaspace&quot;, &quot;SFMono-Regular&quot;, Consolas, monospace" >75</text>
<line x1="332" y1="520" x2="332" y2="528" stroke="#64666b" stroke-width="1" />
<text x="332" y="548" font-size="13" fill="#64666b" font-weight="400" text-anchor="middle" font-family="&quot;Monaspace&quot;, &quot;SFMono-Regular&quot;, Consolas, monospace" >100</text>
<line x1="20" y1="524" x2="332" y2="524" stroke="#64666b" stroke-width="1" />
<text x="20" y="592" font-size="15" fill="#29323f" font-weight="500" text-anchor="start" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >第 50 块已等 98 ms，才开始处理。</text>
<text x="20" y="617" font-size="12" fill="#64666b" font-weight="400" text-anchor="start" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >横轴：排队等待 · 标签：到达 → 开始</text>
