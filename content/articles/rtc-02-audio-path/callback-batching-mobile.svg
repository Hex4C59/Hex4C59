<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="580" viewBox="0 0 360 580" role="img" aria-labelledby="callback-batching-mobile-title callback-batching-mobile-desc" id="callback-batching-mobile-root">
<title id="callback-batching-mobile-title">两次回调，拼成一次编码输入</title>
<desc id="callback-batching-mobile-desc">48kHz单声道16位PCM，每次10毫秒回调有480样本960字节；合并两次后有960样本1920字节，覆盖20毫秒声音。</desc>
<defs>
      <style>#callback-batching-mobile-root { color: #29323f; font-family: "Hex Sans", "Hex Han Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; }
      #callback-batching-mobile-root .diagram-container { width:100%;overflow-x:auto }
      #callback-batching-mobile-root .diagram-container { overflow:visible }</style><pattern id="callback-batching-mobile-callback-batching-mobile-processing" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f1ede7"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#ddd7cf" stroke-width="1"/></pattern></defs>
<rect x="0" y="0" width="360" height="580" rx="0" fill="#fcfaf7" stroke="none" stroke-width="1" />
<text x="20" y="34" font-size="21" fill="#29323f" font-weight="600" text-anchor="start" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >两次回调，拼成一次编码输入</text>
