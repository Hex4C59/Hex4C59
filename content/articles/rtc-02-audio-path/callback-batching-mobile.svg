<text x="180" y="406" font-size="15" fill="#a13c54" font-weight="500" text-anchor="middle" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >960 样本</text>
<text x="180" y="433" font-size="14" fill="#a13c54" font-weight="400" text-anchor="middle" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >1920 字节</text>
<line x1="20" y1="464" x2="20" y2="472" stroke="#64666b" stroke-width="1" />
<text x="20" y="492" font-size="13" fill="#64666b" font-weight="400" text-anchor="middle" font-family="&quot;Monaspace&quot;, &quot;SFMono-Regular&quot;, Consolas, monospace" >0</text>
<line x1="180" y1="464" x2="180" y2="472" stroke="#64666b" stroke-width="1" />
<text x="180" y="492" font-size="13" fill="#64666b" font-weight="400" text-anchor="middle" font-family="&quot;Monaspace&quot;, &quot;SFMono-Regular&quot;, Consolas, monospace" >10</text>
<line x1="340" y1="464" x2="340" y2="472" stroke="#64666b" stroke-width="1" />
<text x="340" y="492" font-size="13" fill="#64666b" font-weight="400" text-anchor="middle" font-family="&quot;Monaspace&quot;, &quot;SFMono-Regular&quot;, Consolas, monospace" >20</text>
<line x1="20" y1="468" x2="340" y2="468" stroke="#64666b" stroke-width="1" />
<text x="20" y="540" font-size="15" fill="#29323f" font-weight="500" text-anchor="start" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >第 20 ms 收齐后，才可提交编码。</text>
<text x="20" y="564" font-size="12" fill="#64666b" font-weight="400" text-anchor="start" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >教学构造 · 块长转换 · 时间单位：毫秒</text>
