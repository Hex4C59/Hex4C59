<text x="20" y="83" font-size="14" fill="#64666b" font-weight="400" text-anchor="start" font-family="&quot;Hex Sans&quot;, &quot;Hex Han Sans&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" >横条表示覆盖的声音区间</text>
<line x1="20" y1="108" x2="20" y2="436" stroke="#ddd7cf" stroke-width="1" />
<line x1="180" y1="108" x2="180" y2="436" stroke="#ddd7cf" stroke-width="1" />
