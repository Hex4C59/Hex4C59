<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多头：分别取信息，再合并</title><style>
*{box-sizing:border-box}
:root{color-scheme:light dark;--color-paper:#faf9f6;--color-ink:#242320;--color-muted:#66635d;--color-soft:#6d6962;--color-accent:#126d61;--color-rule:#c2beb5;--surface:#f1f0ec;--q:#6044ab;--qt:#ece5fa;--k:#126d61;--kt:#dceee7;--v:#96511e;--vt:#f8e4cf;--mask:#a03861;--mt:#f7e1e9;--font-sans:system-ui,-apple-system,"PingFang SC",sans-serif;--font-serif:"Songti SC",Georgia,serif;--font-mono:ui-monospace,"SFMono-Regular",monospace;--motion-fast:160ms;--motion-step:480ms;--motion-hold:1200ms;--motion-total:7200ms;--motion-ease:cubic-bezier(.2,.8,.2,1)}
@media(prefers-color-scheme:dark){:root{--color-paper:#242320;--color-ink:#faf9f6;--color-muted:#c2beb5;--color-soft:#b4aea2;--color-accent:#8cd9cd;--color-rule:#807c74;--surface:#302e29;--q:#c3b1f8;--qt:#332a47;--k:#8cd9cd;--kt:#203c37;--v:#e8b47d;--vt:#453225;--mask:#f1aac4;--mt:#472d39}}
body{margin:0;padding:16px 8px;color:var(--color-ink);background:var(--color-paper);font-family:var(--font-sans)}
main{max-width:704px;min-width:0;margin:auto}h1{margin:0 0 10px;font:500 25px/1.45 var(--font-serif)}
.intro,.foot{font-size:14px;line-height:1.8;color:var(--color-muted);margin:8px 0 14px}.foot{font-size:13px}
.diagram-container{width:100%;overflow-x:auto}svg{display:block;width:680px;min-width:680px;margin:auto}.compact{display:none}
.card{fill:var(--color-paper);stroke:var(--color-rule);stroke-width:1}.node-title{fill:var(--color-ink);font:500 16px var(--font-sans);letter-spacing:.02em}.label{fill:var(--color-ink);font:400 14px var(--font-sans)}.caption{fill:var(--color-muted);font:400 13px var(--font-sans)}
.math-line{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--color-ink);line-height:1.2;overflow:visible;font-weight:400}
.math-line math{margin:0;font-family:"STIX Two Math","Cambria Math","Latin Modern Math",math;font-size:inherit;font-weight:400;line-height:normal}
.q{fill:var(--q);color:var(--q)}.k{fill:var(--k);color:var(--k)}.v{fill:var(--v);color:var(--v)}.mask{fill:var(--mask);color:var(--mask)}.muted{color:var(--color-muted)}
.arrow{fill:none;stroke:var(--color-muted);stroke-width:1.4}.memory-route{stroke:var(--k)}.zone{fill:none;stroke:var(--color-muted);stroke-dasharray:5 4}.cell{fill:var(--surface);stroke:var(--color-rule)}.allowed{fill:var(--kt);stroke:var(--k)}.blocked{fill:var(--mt);stroke:var(--mask)}
@media(max-width:719px){.wide{display:none}.compact{display:block;width:360px;min-width:360px}h1{font-size:23px}.compact .node-title{font-size:14px}.compact .label{font-size:13px}.compact .caption{font-size:12px}}
@media print{body{padding:0}.wide{display:block;width:100%;min-width:0}.compact{display:none}}

    /* Static source is complete. Only an initialized enhancement hides items. */
    .motion-ready [data-motion-item] {
      opacity: .12;
      transform: translateY(8px);
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity var(--motion-step) var(--motion-ease),
                  transform var(--motion-step) var(--motion-ease);
    }
    .motion-ready [data-motion-item].is-visible,
    .motion-ready[data-frame="end"] [data-motion-item],
    .motion-ready[data-frame="static"] [data-motion-item] {
      opacity: 1;
      transform: none;
    }
    .draw-path {
      fill: none;
      stroke: var(--color-accent);
      stroke-width: 3;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      pointer-events: none;
    }
    .motion-ready .draw-path.is-visible {
      animation: draw-path var(--motion-step) linear forwards;
    }
    .flow-token { opacity: 0; pointer-events: none; }
    .motion-ready.is-playing .flow-token.is-visible {
      opacity: 1;
      animation: token-flow 3.2s linear 1 forwards;
    }
    .motion-ready[data-motion-mode="loop"].is-playing .flow-token.is-visible {
      animation-iteration-count: infinite;
    }
    @keyframes draw-path { to { stroke-dashoffset: 0; } }
    @keyframes token-flow {
      0% { transform: translateX(0); }
      100% { transform: translateX(240px); }
    }

    [data-motion-controls] {
      display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--color-rule);
    }
    .motion-ready [data-motion-controls] { display: flex; }
    [data-motion-controls][hidden] { display: none !important; }
    [data-motion-controls] button {
      min-width: 44px;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--color-muted);
      border-radius: 4px;
      color: var(--color-ink);
      background: var(--color-paper);
      font: 600 12px/1 var(--font-sans);
      cursor: pointer;
    }
    [data-motion-controls] button:hover { border-color: var(--color-accent); }
    [data-motion-controls] button:focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 2px;
    }
    [data-motion-controls] button:disabled { cursor: not-allowed; opacity: .45; }
    [data-motion-status-visible] {
      margin-left: auto;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
    noscript p {
      margin: 12px 0 0;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }

    html[data-motion="static"] [data-motion-controls],
    html[data-motion="static"] [data-motion-decorative] { display: none !important; }
    html[data-motion="static"] [data-motion-item] {
      opacity: 1 !important;
      transform: none !important;
      animation: none !important;
      transition: none !important;
    }
    html[data-motion="step"] [data-motion-controls],
    html[data-motion="step"] [data-motion-decorative] { display: none !important; }
    html[data-motion="step"] [data-motion-item] {
      animation: none !important;
      transition: none !important;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
      [data-motion-item] { opacity: 1 !important; transform: none !important; }
      [data-motion-decorative] { display: none !important; }
      [data-motion-controls] { display: none !important; }
    }
    @media print {
      /* Paper has no scrollbar, so the local scroller would clip instead of
         scroll. Let the diagram scale down to the sheet: smaller but whole
         beats sharp but cut off. */
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
      [data-motion-controls], [data-motion-decorative] { display: none !important; }
      [data-motion-item] {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
        transition: none !important;
      }
    }


.motion-ready[data-frame="start"] [data-motion-item]{opacity:1;transform:none}
.motion-ready [data-motion-item].is-current .card{stroke:var(--color-accent);stroke-width:1.6}
[data-motion-controls]{margin:12px 0 24px;padding-top:12px;gap:8px}
[data-motion-controls] button{font:500 13px/1.2 var(--font-sans);padding:9px 12px;border-color:var(--color-rule)}
[data-motion-status-visible]{font:400 12px var(--font-sans)}

multi-head-compact-arrow)"/><path d="M272.0 248 V288" class="arrow " marker-end="url(#multi-head-compact-arrow)"/><path d="M272.0 420 V460" class="arrow " marker-end="url(#multi-head-compact-arrow)"/><path d="M272.0 532 V544 Q272.0 552 264.0 552 H237.33333333333334 Q229.33333333333334 552 229.33333333333334 560 V580" class="arrow " marker-end="url(#multi-head-compact-arrow)"/><path d="M180 680 V720" class="arrow " marker-end="url(#multi-head-compact-arrow)"/><g data-motion-item data-step="1" aria-label="输入序列表示"><rect x="40" y="16" width="280" height="72" rx="6" class="card" /><text x="180.0" y="44" class="node-title " text-anchor="middle">输入序列</text><foreignObject x="56" y="50" width="248" height="32"><div xmlns="http://www.w3.org/1999/xhtml" class="math-line " style="font-size:22px"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>X</mi><mo>∈</mo><msup><mi mathvariant="double-struck">R</mi><mrow><mi>n</mi><mo>×</mo><mn>512</mn></mrow></msup></mrow><annotation encoding="application/x-tex">X\in\mathbb{R}^{n\times512}</annotation></semantics></math></div></foreignObject></g><g data-motion-item data-step="2" aria-label="使用不同投影参数产生各头的查询、键和值"><rect x="16" y="136" width="144" height="112" rx="6" class="card" style="stroke:var(--q)"/><text x="88.0" y="164" class="node-title q" text-anchor="middle">注意力头 1</text><foreignObject x="24" y="178" width="128" height="32"><div xmlns="http://www.w3.org/1999/xhtml" class="math-line q" style="font-size:19px"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msubsup><mi>W</mi><mn>1</mn><mi>Q</mi></msubsup><mo separator="true">,</mo><mtext>  </mtext><msubsup><mi>W</mi><mn>1</mn><mi>K</mi></msubsup><mo separator="true">,</mo><mtext>  </mtext><msubsup><mi>W</mi><mn>1</mn><mi>V</mi></msubsup></mrow><annotation encoding="application/x-tex">W_1^Q,\;W_1^K,\;W_1^V</annotation></semantics></math></div></foreignObject><foreignObject x="24" y="214" width="128" height="24"><div o stretchy="false">(</mo><msub><mi>S</mi><mn>1</mn></msub><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">A_1=\operatorname{softmax}(S_1)</annotation></semantics></math></div></foreignObject><foreignObject x="22" y="362" width="132" height="52"><div xmlns="http://www.w3.org/1999/xhtml" class="math-line " style="font-size:18px"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>S</mi><mn>1</mn></msub><mo>=</mo><mfrac><mrow><msub><mi>Q</mi><mn>1</mn></msub><msubsup><mi>K</mi><mn>1</mn><mi mathvariant="sans-serif">T</mi></msubsup></mrow><mn>8</mn></mfrac></mrow><annotation encoding="application/x-tex">S_1=\frac{Q_1K_1^{\mathsf T}}{8}</annotation></semantics></math></div></foreignObject><rect x="200" y="288" width="144" height="132" rx="6" class="card" style="stroke:var(--k)"/><text x="272.0" y="316" class="node-title k" text-anchor="middle">注意力权重</text><foreignObject x="206" y="328" width="132" height="30"><div xmlns="http://www.w3.org/1999/xhtml" class="math-line k" style="font-size:17px"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>A</mi><mn>8</mn></msub><mo>=</mo><mi mathvariant="normal">softmax</mi><mo>⁡</mo><mo stretchy="false">(</mo><msub><mi>S</mi><mn>8</mn></msub><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">A_8=\operatorname{softmax}(S_8)</annotation></semantics></math></div></foreignObject><foreignObject x="206" y="362" width="132" height="52"><div xmlns="http://www.w3.org/1999/xhtml" class="math-line " style="font-size:18px"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>S</mi><mn>8</mn></msub><mo>=</mo><mfrac><mrow><msub><mi>Q</mi><mn>8</mn></msub><msubsup><mi>K</mi><mn>8</mn><mi mathvariant="sans-serif">T</mi></msubsup></mrow><mn>8</mn></mfrac></mrow><annotation encoding="application/x-tex">S_8=\frac{Q_8K_8^{\mathsf T}}{8}</annotation></semantics></math></div></foreignObject></g><g data-motion-item data-step="4" aria-label="对各头自己的值向量加权，输出每头的结果"><foreignObject x="20" y="460" width="136" height="40"><div xmlns="http://www.w3.org/1999/xhtml" class="math-line v" style="font-size:19px"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mrow><mi mathvariant="normal">head</mi><mo>⁡</mo></mrow><mn>1</mn></msub><mo>=</mo><msub><mi>A</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub></mrow><annotation encoding="application/x-tex">\operatorname{head}_1=A_1V_1</annotation></semantics></math></div></foreignObject><foreignObject x="24" y="504" width="128" height="28"><div xmlns="http://www.w3.org/1999/xhtml" class="math-line muted" style="font-size:17px"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>n</mi><mo>×</mo><mn>64</mn></mrow><annotation encoding="application/x-tex">n\times64</annotation></semantics></math></div></foreignObject><foreignObject x="204" y="460" width="136" height="40"><div xmlns="http://www.w3.org/1999/xhtml" class="math-line v" style="font-size:19px"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mrow><mi mathvariant="normal">head</mi><mo>⁡</mo></mrow><mn>8</mn></msub><mo>=</mo><msub><mi>A</mi><mn>8</mn></msub><msub><mi>V</mi><mn>8</mn></msub></mrow><annotation encoding="application/x-tex">\operatorname{head}_8=A_8V_8</annotation></semantics></math></div></foreignObject><foreignObject x="208" y="504" width="128" height="28"><div xmlns="http://www.w3.org/1999/xhtml" class="math-line muted" style="font-size:17px"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>n</mi><mo>×</mo><mn>64</mn></mrow><annotation encoding="application/x-tex">n\times64</annotation></semantics></math></div></foreignObject></g><g data-motion-item data-step="5" aria-label="沿特征维拼接八个头"><rect x="32" y="580" width="296" height="100" rx="6" class="card" /><text x="180.0" y="608" class="node-title " text-anchor="middle">拼接各头输出</text><foreignObject x="44" y="620" width="272" height="30"><div xmlns="http://www.w3.org/1999/xhtml" class="math-line " style="font-size:18px"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi mathvariant="normal">Concat</mi><mo>⁡</mo><mo stretchy="false">(</mo><msub><mrow><mi mathvariant="normal">head</mi><mo>⁡</mo></mrow><mn>1</mn></msub><mo separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mrow><mi mathvariant="normal">head</mi><mo>⁡</mo></mrow><mn>8</mn></msub><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\operatorname{Concat}(\operatorname{head}_1,\ldots,\operatorname{head}_8)</annotation></semantics></math></div></foreignObject><foreignObject x="44" y="654" width="272" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="math-line muted" style="font-size:17px"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>n</mi><mo>×</mo><mo stretchy="false">(</mo><mn>8</mn><mo>⋅</mo><mn>64</mn><mo stretchy="false">)</mo><mo>=</mo><mi>n</mi><mo>×</mo><mn>512</mn></mrow><annotation encoding="application/x-tex">n\times(8\cdot64)=n\times512</annotation></semantics></math></div></foreignObject></g><g data-motion-item data-step="6" aria-label="通过输出矩阵混合各头信息"><rect x="32" y="720" width="296" height="104" rx="6" class="card" style="stroke:var(--k)"/><text x="180.0" y="748" class="node-title k" text-anchor="middle">输出投影</text><foreignObject x="44" y="760" width="272" height="32"><div xmlns="http://www.w3.org/1999/xhtml" class="math-line k" style="font-size:21px"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msup><mi>W</mi><mi>O</mi></msup><mo>∈</mo><msup><mi mathvariant="double-struck">R</mi><mrow><mn>512</mn><mo>×</mo><mn>512</mn></mrow></msup></mrow><annotation encoding="application/x-tex">W^O\in\mathbb{R}^{512\times512}</annotation></semantics></math></div></foreignObject><foreignObject x="44" y="798" width="272" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="math-line muted" style="font-size:17px"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>输出：</mtext><mtext>  </mtext><mi>n</mi><mo>×</mo><mn>512</mn></mrow><annotation encoding="application/x-tex">\text{输出：}\;n\times512</annotation></semantics></math></div></foreignObject></g></svg></div><p class="sr-only" data-motion-status role="status" aria-live="polite" aria-atomic="true"></p><p class="foot">读图重点：分支表示并行计算，不是沿着 head 编号依次执行。各头独立做 softmax，之后才拼接。图中折叠 head 2 至 7，仅展开 head 1 与 head 8。</p><p class="foot">播放控件显示当前步骤。键盘 ← / → 切换步骤，Home / End 查看起点和终点。</p><noscript><p>当前显示完整静态图，启用 JavaScript 后可以播放。</p></noscript></main><script data-diagram-controls>
    (() => {
      const params = new URLSearchParams(location.search);
      const staticOverride = params.get('motion') === 'static' || document.documentElement.dataset.motion === 'static';
      const requestedStep = params.get('step');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)');
      document.fonts.ready.then(() => { document.documentElement.dataset.fontsReady = 'true'; });

      document.querySelectorAll('[data-motion-root]').forEach((root) => {
        const count = Number(root.dataset.stepCount);
        const hold = parseFloat(getComputedStyle(root).getPropertyValue('--motion-hold')) || 720;
        const parsedStep = requestedStep !== null && /^\d+$/.test(requestedStep) ? Number(requestedStep) : null;
        const exactStep = params.get('motion') === 'step' && Number.isSafeInteger(parsedStep) && parsedStep >= 0 && parsedStep <= count ? parsedStep : null;
        const items = [...root.querySelectorAll('[data-motion-item]')];
        const labels = Array.from({ length: count + 1 }, (_, index) => index === 0
          ? 'Ready'
          : items.filter((item) => !item.hasAttribute('data-motion-decorative') && Number(item.dataset.step) === index)
              .map((item) => item.getAttribute('aria-label')).join('; '));
        const controls = root.querySelector('[data-motion-controls]');
        const status = root.querySelector('[data-motion-status]');
        const visibleStep = root.querySelector('[data-motion-step-label]');
        let step = count;
        let timer = 0;
        let playing = false;
        let stepBeforeReduce = 0;
        let resumeAfterReduce = root.dataset.motionMode === 'reveal';

        const buttons = (action) => controls.querySelector(`[data-motion-action="${action}"]`);
        const clearClock = () => { window.clearTimeout(timer); timer = 0; };
        const announce = () => { status.textContent = `Step ${step} of ${count}: ${labels[step] || 'Complete'}`; };
        const setControlsAvailable = (available) => {
          controls.hidden = !available;
          controls.setAttribute('aria-hidden', String(!available));
          controls.dataset.playbackDisabled = String(!available);
          controls.querySelectorAll('button').forEach((control) => { control.disabled = !available; });
        };

        function render(next, userInitiated = false) {
          step = Math.max(0, Math.min(count, next));
          root.dataset.stepCurrent = String(step);
          root.dataset.frame = step === count ? 'end' : step === 0 ? 'start' : 'step';
          items.forEach((item) => {
            const itemStep = Number(item.dataset.step);
            item.classList.toggle('is-visible', itemStep <= step);
            item.classList.toggle('is-current', itemStep === step);
          });
          if (visibleStep) visibleStep.textContent = String(step);
          const unavailable = controls.dataset.playbackDisabled === 'true';
          buttons('prev').disabled = unavailable || step === 0;
          buttons('next').disabled = unavailable || step === count;
          if (userInitiated) announce();
        }

        function pause(userInitiated = false) {
          clearClock();
          playing = false;
          root.classList.remove('is-playing');
          buttons('play').setAttribute('aria-pressed', 'false');
          buttons('pause').setAttribute('aria-pressed', 'true');
          if (userInitiated) status.textContent = `Paused at step ${step} of ${count}`;
        }

        function finish() {
          pause(false);
          root.dataset.frame = 'end';
          status.textContent = `Complete · step ${count} of ${count}`;
        }

        function tick() {
          if (!playing) return;
          if (step >= count) { finish(); return; }
          render(step + 1, false);
          if (step >= count) { finish(); return; }
          timer = window.setTimeout(tick, hold);
        }

        function play(fromStart = false, userInitiated = false) {
          clearClock();
          if (fromStart || step >= count) render(0, userInitiated);
          playing = true;
          root.classList.add('is-playing');
          buttons('play').setAttribute('aria-pressed', 'true');
          buttons('pause').setAttribute('aria-pressed', 'false');
          timer = window.setTimeout(tick, hold);
        }

        controls.addEventListener('click', (event) => {
          const button = event.target.closest('[data-motion-action]');
          if (!button) return;
          const action = button.dataset.motionAction;
          if (action === 'play') play(false, true);
          if (action === 'pause') pause(true);
          if (action === 'replay') play(true, true);
          if (action === 'prev') { pause(false); render(step - 1, true); }
          if (action === 'next') { pause(false); render(step + 1, true); }
        });

        root.addEventListener('keydown', (event) => {
          if (event.target.matches('input, textarea, select, a[href]')) return;
          const keys = { ArrowLeft: step - 1, ArrowRight: step + 1, Home: 0, End: count };
          if (event.code === 'Space' && !event.target.closest('button')) {
            event.preventDefault();
            playing ? pause(true) : play(false, true);
            return;
          }
          if (!event.ctrlKey && !event.metaKey && !event.altKey && event.key.toLowerCase() === 'r') {
            event.preventDefault();
            play(true, true);
            return;
          }
          if (!(event.key in keys)) return;
          event.preventDefault();
          pause(false);
          render(keys[event.key], true);
        });

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden' && playing) pause(false);
        });
        reduce.addEventListener('change', (event) => {
          if (event.matches && root.dataset.motionState !== 'reduced') {
            stepBeforeReduce = step;
            resumeAfterReduce = playing;
          }
          pause(false);
          if (event.matches) {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'reduced';
            status.textContent = 'Reduced motion · complete static frame · playback controls unavailable';
          } else if (staticOverride || root.dataset.motionMode === 'none') {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'static';
            status.textContent = 'Static frame · complete diagram · playback controls unavailable';
          } else {
            delete root.dataset.motionState;
            if (exactStep !== null) {
              setControlsAvailable(false);
              render(exactStep, false);
              root.dataset.frame = 'step';
              root.dataset.motionState = 'test';
              status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
            } else {
              setControlsAvailable(true);
              render(stepBeforeReduce, false);
              status.textContent = `Ready · step ${step} of ${count}`;
              if (resumeAfterReduce && root.dataset.motionMode === 'reveal') {
                play(false, false);
              }
            }
            resumeAfterReduce = false;
          }
        });

        if (staticOverride) {
          document.documentElement.dataset.motion = 'static';
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = 'static';
          status.textContent = 'Static frame · complete diagram · playback controls unavailable';
        } else if (reduce.matches || root.dataset.motionMode === 'none') {
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = reduce.matches ? 'reduced' : 'static';
          status.textContent = reduce.matches
            ? 'Reduced motion · complete static frame · playback controls unavailable'
            : 'Static frame · complete diagram · playback controls unavailable';
        } else if (exactStep !== null) {
          document.documentElement.dataset.motion = 'step';
          pause(false);
          setControlsAvailable(false);
          render(exactStep, false);
          root.dataset.frame = 'step';
          root.dataset.motionState = 'test';
          status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
        } else if (root.dataset.motionMode === 'reveal') {
          setControlsAvailable(true);
          render(0, false);
          play(false, false);
        } else {
          pause(false);
          setControlsAvailable(true);
          render(0, false);
          status.textContent = `Ready · step 0 of ${count}`;
        }
        root.classList.add('motion-ready');
      });
    })();
  </script></body></html>
