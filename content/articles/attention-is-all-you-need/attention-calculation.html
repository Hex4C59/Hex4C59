></semantics></math></div></foreignObject><text x="180.0" y="336" class="caption" text-anchor="middle">三个分数依次对应：猫、坐、垫</text></g><g data-motion-item data-step="3" aria-label="缩放分数"><rect x="16" y="384" width="328" height="144" rx="6" class="card" /><text x="180.0" y="412" class="node-title " text-anchor="middle">缩放分数</text><foreignObject x="24" y="426" width="312" height="60"><div xmlns="http://www.w3.org/1999/xhtml" class="math-line " style="font-size:19px"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mfrac><mrow><mi>q</mi><msup><mi>K</mi><mi mathvariant="sans-serif">T</mi></msup></mrow><msqrt><mn>2</mn></msqrt></mfrac><mo>≈</mo><mo stretchy="false">[</mo><mn>0.707</mn><mo separator="true">,</mo><mn>0</mn><mo separator="true">,</mo><mn>0.707</mn><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">\frac{qK^{\mathsf T}}{\sqrt{2}}\approx[0.707,0,0.707]</annotation></semantics></math></div></foreignObject><foreignObject x="28" y="492" width="304" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="math-line muted" style="font-size:17px"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>d</mi><mi>k</mi></msub><mo>=</mo><mn>2</mn></mrow><annotation encoding="application/x-tex">d_k=2</annotation></semantics></math></div></foreignObject></g><g data-motion-item data-step="4" aria-label="归一化权重"><rect x="16" y="552" width="328" height="144" rx="6" class="card" /><text x="180.0" y="580" class="node-title " text-anchor="middle">归一化权重</text><foreignObject x="28" y="596" width="304" height="30"><div xmlns="http://www.w3.org/1999/xhtml" class="math-line " style="font-size:21px"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>a</mi><mo>=</mo><mi mathvariant="normal">softmax</mi><mo>⁡</mo><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">a=\operatorname{softmax}(s)</annotation></semantics></math></div></foreignObject><foreignObject x="28" y="630" width="304" height="30"><div xmlns="http://www.w3.org/1999/xhtml" class="math-line k" style="font-size:21px"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mo stretchy="false">[</mo><mn>0.4011</mn><mo separator="true">,</mo><mtext>  </mtext><mn>0.1978</mn><mo separator="true">,</mo><mtext>  </mtext><mn>0.4011</mn><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[0.4011,\;0.1978,\;0.4011]</annotation></semantics></math></div></foreignObject><text x="180.0" y="678" class="caption" text-anchor="middle">每一行的权重之和为 1</text></g><g data-motion-item data-step="5" aria-label="对值向量加权"><rect x="16" y="720" width="328" height="144" rx="6" class="card" /><text x="180.0" y="748" class="node-title " text-anchor="middle">对值向量加权</text><foreignObject x="28" y="766" width="304" height="66"><div xmlns="http://www.w3.org/1999/xhtml" class="math-line " style="font-size:19px"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mtable rowspacing="0.25em" columnalign="center" columnspacing="0em"><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mn>0.4011</mn><mo stretchy="false">[</mo><mn>2</mn><mo separator="true">,</mo><mn>0</mn><mo stretchy="false">]</mo><mo>+</mo><mn>0.1978</mn><mo stretchy="false">[</mo><mn>0</mn><mo separator="true">,</mo><mn>2</mn><mo stretchy="false">]</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mrow></mrow><mo>+</mo><mn>0.4011</mn><mo stretchy="false">[</mo><mn>2</mn><mo separator="true">,</mo><mn>2</mn><mo stretchy="false">]</mo></mrow></mstyle></mtd></mtr></mtable><annotation encoding="application/x-tex">\begin{gathered}0.4011[2,0]+0.1978[0,2]\\{}+0.4011[2,2]\end{gathered}</annotation></semantics></math></div></foreignObject><text x="180.0" y="846" class="caption" text-anchor="middle">权重乘到对应的值向量上</text></g><g data-motion-item data-step="6" aria-label="新的上下文表示"><rect x="16" y="888" width="328" height="144" rx="6" class="card" /><text x="180.0" y="916" class="node-title " text-anchor="middle">新的上下文表示</text><foreignObject x="28" y="934" width="304" height="58"><div xmlns="http://www.w3.org/1999/xhtml" class="math-line k" style="font-size:22px"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>z</mi><mtext>坐</mtext></msub><mo>≈</mo><mo stretchy="false">[</mo><mn>1.6044</mn><mo separator="true">,</mo><mn>1.1978</mn><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">z_{\text{坐}}\approx[1.6044,1.1978]</annotation></semantics></math></div></foreignObject><text x="180.0" y="1014" class="caption" text-anchor="middle">把三个位置的信息汇入一个向量</text></g></svg></div><p class="sr-only" data-motion-status role="status" aria-live="polite" aria-atomic="true"></p><p class="foot">读图重点：K 参与计算“取多少”，V 提供“取什么”。数字在完整精度下计算，显示值四舍五入。</p><p class="foot">播放控件显示当前步骤。键盘 ← / → 切换步骤，Home / End 查看起点和终点。</p><noscript><p>当前显示完整静态图，启用 JavaScript 后可以播放。</p></noscript></main><script data-diagram-controls>
    (() => {
      const params = new URLSearchParams(location.search);
      const staticOverride = params.get('motion') === 'static' || document.documentElement.dataset.motion === 'static';
      const requestedStep = params.get('step');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)');
      document.fonts.ready.then(() => { document.documentElement.dataset.fontsReady = 'true'; });

      document.querySelectorAll('[data-motion-root]').forEach((root) => {
        const count = Number(root.dataset.stepCount);
        const hold = parseFloat(getComputedStyle(root).getPropertyValue('--motion-hold')) || 720;
        const parsedStep = requestedStep !== null && /^\d+$/.test(requestedStep) ? Number(requestedStep) : null;
        const exactStep = params.get('motion') === 'step' && Number.isSafeInteger(parsedStep) && parsedStep >= 0 && parsedStep <= count ? parsedStep : null;
        const items = [...root.querySelectorAll('[data-motion-item]')];
        const labels = Array.from({ length: count + 1 }, (_, index) => index === 0
          ? 'Ready'
          : items.filter((item) => !item.hasAttribute('data-motion-decorative') && Number(item.dataset.step) === index)
              .map((item) => item.getAttribute('aria-label')).join('; '));
        const controls = root.querySelector('[data-motion-controls]');
        const status = root.querySelector('[data-motion-status]');
        const visibleStep = root.querySelector('[data-motion-step-label]');
        let step = count;
        let timer = 0;
        let playing = false;
        let stepBeforeReduce = 0;
        let resumeAfterReduce = root.dataset.motionMode === 'reveal';

        const buttons = (action) => controls.querySelector(`[data-motion-action="${action}"]`);
        const clearClock = () => { window.clearTimeout(timer); timer = 0; };
        const announce = () => { status.textContent = `Step ${step} of ${count}: ${labels[step] || 'Complete'}`; };
        const setControlsAvailable = (available) => {
          controls.hidden = !available;
          controls.setAttribute('aria-hidden', String(!available));
          controls.dataset.playbackDisabled = String(!available);
          controls.querySelectorAll('button').forEach((control) => { control.disabled = !available; });
        };

        function render(next, userInitiated = false) {
          step = Math.max(0, Math.min(count, next));
          root.dataset.stepCurrent = String(step);
          root.dataset.frame = step === count ? 'end' : step === 0 ? 'start' : 'step';
          items.forEach((item) => {
            const itemStep = Number(item.dataset.step);
            item.classList.toggle('is-visible', itemStep <= step);
            item.classList.toggle('is-current', itemStep === step);
          });
          if (visibleStep) visibleStep.textContent = String(step);
          const unavailable = controls.dataset.playbackDisabled === 'true';
          buttons('prev').disabled = unavailable || step === 0;
          buttons('next').disabled = unavailable || step === count;
          if (userInitiated) announce();
        }

        function pause(userInitiated = false) {
          clearClock();
          playing = false;
          root.classList.remove('is-playing');
          buttons('play').setAttribute('aria-pressed', 'false');
          buttons('pause').setAttribute('aria-pressed', 'true');
          if (userInitiated) status.textContent = `Paused at step ${step} of ${count}`;
        }

        function finish() {
          pause(false);
          root.dataset.frame = 'end';
          status.textContent = `Complete · step ${count} of ${count}`;
        }

        function tick() {
          if (!playing) return;
          if (step >= count) { finish(); return; }
          render(step + 1, false);
          if (step >= count) { finish(); return; }
          timer = window.setTimeout(tick, hold);
        }

        function play(fromStart = false, userInitiated = false) {
          clearClock();
          if (fromStart || step >= count) render(0, userInitiated);
          playing = true;
          root.classList.add('is-playing');
          buttons('play').setAttribute('aria-pressed', 'true');
          buttons('pause').setAttribute('aria-pressed', 'false');
          timer = window.setTimeout(tick, hold);
        }

        controls.addEventListener('click', (event) => {
          const button = event.target.closest('[data-motion-action]');
          if (!button) return;
          const action = button.dataset.motionAction;
          if (action === 'play') play(false, true);
          if (action === 'pause') pause(true);
          if (action === 'replay') play(true, true);
          if (action === 'prev') { pause(false); render(step - 1, true); }
          if (action === 'next') { pause(false); render(step + 1, true); }
        });

        root.addEventListener('keydown', (event) => {
          if (event.target.matches('input, textarea, select, a[href]')) return;
          const keys = { ArrowLeft: step - 1, ArrowRight: step + 1, Home: 0, End: count };
          if (event.code === 'Space' && !event.target.closest('button')) {
            event.preventDefault();
            playing ? pause(true) : play(false, true);
            return;
          }
          if (!event.ctrlKey && !event.metaKey && !event.altKey && event.key.toLowerCase() === 'r') {
            event.preventDefault();
            play(true, true);
            return;
          }
          if (!(event.key in keys)) return;
          event.preventDefault();
          pause(false);
          render(keys[event.key], true);
        });

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden' && playing) pause(false);
        });
        reduce.addEventListener('change', (event) => {
          if (event.matches && root.dataset.motionState !== 'reduced') {
            stepBeforeReduce = step;
            resumeAfterReduce = playing;
          }
          pause(false);
          if (event.matches) {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'reduced';
            status.textContent = 'Reduced motion · complete static frame · playback controls unavailable';
          } else if (staticOverride || root.dataset.motionMode === 'none') {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'static';
            status.textContent = 'Static frame · complete diagram · playback controls unavailable';
          } else {
            delete root.dataset.motionState;
            if (exactStep !== null) {
              setControlsAvailable(false);
              render(exactStep, false);
              root.dataset.frame = 'step';
              root.dataset.motionState = 'test';
              status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
            } else {
              setControlsAvailable(true);
              render(stepBeforeReduce, false);
              status.textContent = `Ready · step ${step} of ${count}`;
              if (resumeAfterReduce && root.dataset.motionMode === 'reveal') {
                play(false, false);
              }
            }
            resumeAfterReduce = false;
          }
        });

        if (staticOverride) {
          document.documentElement.dataset.motion = 'static';
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = 'static';
          status.textContent = 'Static frame · complete diagram · playback controls unavailable';
        } else if (reduce.matches || root.dataset.motionMode === 'none') {
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = reduce.matches ? 'reduced' : 'static';
          status.textContent = reduce.matches
            ? 'Reduced motion · complete static frame · playback controls unavailable'
            : 'Static frame · complete diagram · playback controls unavailable';
        } else if (exactStep !== null) {
          document.documentElement.dataset.motion = 'step';
          pause(false);
          setControlsAvailable(false);
          render(exactStep, false);
          root.dataset.frame = 'step';
          root.dataset.motionState = 'test';
          status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
        } else if (root.dataset.motionMode === 'reveal') {
          setControlsAvailable(true);
          render(0, false);
          play(false, false);
        } else {
          pause(false);
          setControlsAvailable(true);
          render(0, false);
          status.textContent = `Ready · step 0 of ${count}`;
        }
        root.classList.add('motion-ready');
      });
    })();
  </script></body></html>
