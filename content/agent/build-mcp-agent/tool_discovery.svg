<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MCP 工具发现与注册流程</title>
  <desc id="desc">展示 Agent 启动时通过 MCP 协议发现和注册工具的详细流程。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .label { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; text-anchor: middle; }
      .title-text { font-size: 14px; font-weight: 500; }
      .body-text { font-size: 12px; font-weight: 400; }
      .heading { font-size: 14px; font-weight: 500; }
      .small-text { font-size: 11px; font-weight: 400; }
      .mono { font-family: "SF Mono", "Fira Code", monospace; font-size: 11px; }
    </style>
  </defs>

  <text x="340" y="28" class="label heading" fill="rgb(20, 20, 19)">动态工具发现流程</text>

  <!-- Three columns -->
  <text x="140" y="56" class="label title-text" fill="rgb(60, 52, 137)">Agent (Host)</text>
  <text x="340" y="56" class="label title-text" fill="rgb(133, 79, 11)">MCP Client</text>
  <text x="540" y="56" class="label title-text" fill="rgb(15, 110, 86)">MCP Server</text>

  <line x1="140" y1="66" x2="140" y2="420" stroke="rgb(83, 74, 183)" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="340" y1="66" x2="340" y2="420" stroke="rgb(133, 79, 11)" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="540" y1="66" x2="540" y2="420" stroke="rgb(15, 110, 86)" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Step 1: Start server process -->
  <rect x="170" y="82" width="140" height="28" rx="4" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="240" y="100" class="label small-text" fill="rgb(83, 74, 183)">启动 Server 进程</text>
  <line x1="310" y1="96" x2="508" y2="96" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.2" fill="none"/>
  <text x="410" y="90" class="label mono" fill="rgb(95, 94, 90)">subprocess.Popen()</text>

  <!-- Step 2: Initialize -->
  <line x1="370" y1="128" x2="508" y2="128" marker-end="url(#arrow)" stroke="rgb(133, 79, 11)" stroke-width="1.2" fill="none"/>
  <text x="440" y="122" class="label mono" fill="rgb(133, 79, 11)">initialize()</text>

  <line x1="508" y1="148" x2="370" y2="148" marker-end="url(#arrow)" stroke="rgb(15, 110, 86)" stroke-width="1.2" fill="none"/>
  <text x="440" y="142" class="label mono" fill="rgb(15, 110, 86)">{capabilities, serverInfo}</text>

  <!-- Step 3: List tools -->
  <line x1="370" y1="180" x2="508" y2="180" marker-end="url(#arrow)" stroke="rgb(133, 79, 11)" stroke-width="1.2" fill="none"/>
  <text x="440" y="174" class="label mono" fill="rgb(133, 79, 11)">tools/list</text>

  <rect x="430" y="194" width="220" height="60" rx="6" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="540" y="212" class="label small-text" fill="rgb(15, 110, 86)">返回工具列表：</text>
  <text x="540" y="228" class="label mono" fill="rgb(15, 110, 86)">[{name, description, inputSchema}]</text>
  <text x="540" y="244" class="label mono" fill="rgb(15, 110, 86)">每个工具都有完整的 JSON Schema</text>

  <line x1="430" y1="224" x2="370" y2="224" marker-end="url(#arrow)" stroke="rgb(15, 110, 86)" stroke-width="1.2" fill="none"/>

  <!-- Step 4: Register to LLM -->
  <line x1="308" y1="276" x2="172" y2="276" marker-end="url(#arrow)" stroke="rgb(133, 79, 11)" stroke-width="1.2" fill="none"/>
  <text x="240" y="270" class="label small-text" fill="rgb(133, 79, 11)">返回工具定义</text>

  <rect x="40" y="290" width="200" height="44" rx="6" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="140" y="308" class="label small-text" fill="rgb(60, 52, 137)">转换为 OpenAI 格式</text>
  <text x="140" y="324" class="label small-text" fill="rgb(83, 74, 183)">注册到 LLM tools 参数</text>

  <!-- Step 5: Call tool at runtime -->
  <rect x="40" y="352" width="200" height="28" rx="4" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="140" y="370" class="label small-text" fill="rgb(83, 74, 183)">LLM 决定调用某工具</text>

  <line x1="240" y1="366" x2="308" y2="366" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.2" fill="none"/>

  <line x1="370" y1="366" x2="508" y2="366" marker-end="url(#arrow)" stroke="rgb(133, 79, 11)" stroke-width="1.2" fill="none"/>
  <text x="440" y="360" class="label mono" fill="rgb(133, 79, 11)">tools/call {name, args}</text>

  <line x1="508" y1="396" x2="370" y2="396" marker-end="url(#arrow)" stroke="rgb(15, 110, 86)" stroke-width="1.2" fill="none"/>
  <text x="440" y="390" class="label mono" fill="rgb(15, 110, 86)">{content: [result]}</text>

  <line x1="308" y1="396" x2="240" y2="396" marker-end="url(#arrow)" stroke="rgb(133, 79, 11)" stroke-width="1.2" fill="none"/>

  <text x="340" y="434" class="label body-text" fill="rgb(95, 94, 90)">关键：Agent 代码不需要知道工具的实现细节——MCP 协议处理一切</text>
</svg>
