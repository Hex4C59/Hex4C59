<svg width="100%" viewBox="0 0 600 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t3 d3">
  <title id="t3">多 Agent 决策检查</title>
  <desc id="d3">判断是否需要多 Agent 的四步决策流程。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .label { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      .t { font-size: 13px; font-weight: 500; }
      .b { font-size: 12px; font-weight: 400; }
    </style>
  </defs>

  <rect x="60" y="20" width="300" height="44" rx="8" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text class="label t" x="210" y="38" text-anchor="middle" fill="rgb(60, 52, 137)">1. 任务能否分解成</text>
  <text class="label t" x="210" y="54" text-anchor="middle" fill="rgb(60, 52, 137)">互相独立的子任务？</text>

  <line x1="360" y1="42" x2="410" y2="42" stroke="rgb(201, 77, 61)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text class="label b" x="385" y="36" text-anchor="middle" fill="rgb(201, 77, 61)">否</text>
  <rect x="412" y="26" width="168" height="32" rx="6" fill="rgb(252, 230, 227)" stroke="rgb(201, 77, 61)" stroke-width="0.5"/>
  <text class="label b" x="496" y="46" text-anchor="middle" fill="rgb(140, 41, 29)">单 Agent + Planning</text>

  <line x1="210" y1="66" x2="210" y2="96" stroke="rgb(15, 110, 86)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text class="label b" x="222" y="84" text-anchor="start" fill="rgb(8, 80, 65)">是</text>

  <rect x="60" y="98" width="300" height="44" rx="8" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text class="label t" x="210" y="116" text-anchor="middle" fill="rgb(60, 52, 137)">2. 需要并行执行</text>
  <text class="label t" x="210" y="132" text-anchor="middle" fill="rgb(60, 52, 137)">以节省时间？</text>

  <line x1="360" y1="120" x2="410" y2="120" stroke="rgb(201, 77, 61)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text class="label b" x="385" y="114" text-anchor="middle" fill="rgb(201, 77, 61)">否</text>
  <rect x="412" y="104" width="168" height="32" rx="6" fill="rgb(252, 230, 227)" stroke="rgb(201, 77, 61)" stroke-width="0.5"/>
  <text class="label b" x="496" y="124" text-anchor="middle" fill="rgb(140, 41, 29)">单 Agent 串行执行</text>

  <line x1="210" y1="144" x2="210" y2="174" stroke="rgb(15, 110, 86)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text class="label b" x="222" y="162" text-anchor="start" fill="rgb(8, 80, 65)">是</text>

  <rect x="60" y="176" width="300" height="44" rx="8" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text class="label t" x="210" y="194" text-anchor="middle" fill="rgb(60, 52, 137)">3. 子任务之间需要</text>
  <text class="label t" x="210" y="210" text-anchor="middle" fill="rgb(60, 52, 137)">互相交流和讨论？</text>

  <line x1="360" y1="192" x2="410" y2="192" stroke="rgb(201, 77, 61)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text class="label b" x="385" y="186" text-anchor="middle" fill="rgb(201, 77, 61)">否</text>
  <rect x="412" y="176" width="168" height="32" rx="6" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text class="label b" x="496" y="196" text-anchor="middle" fill="rgb(8, 80, 65)">Supervisor 模式</text>

  <line x1="360" y1="210" x2="410" y2="230" stroke="rgb(15, 110, 86)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text class="label b" x="385" y="228" text-anchor="middle" fill="rgb(8, 80, 65)">是</text>
  <rect x="412" y="218" width="168" height="32" rx="6" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text class="label b" x="496" y="238" text-anchor="middle" fill="rgb(99, 56, 6)">Peer-to-Peer（高成本）</text>

  <line x1="210" y1="222" x2="210" y2="274" stroke="rgb(15, 110, 86)" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="60" y="276" width="300" height="44" rx="8" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text class="label t" x="210" y="294" text-anchor="middle" fill="rgb(60, 52, 137)">4. 有明确的请求类型</text>
  <text class="label t" x="210" y="310" text-anchor="middle" fill="rgb(60, 52, 137)">需要路由到不同专家？</text>

  <line x1="360" y1="298" x2="410" y2="298" stroke="rgb(15, 110, 86)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text class="label b" x="385" y="292" text-anchor="middle" fill="rgb(8, 80, 65)">是</text>
  <rect x="412" y="282" width="168" height="32" rx="6" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text class="label b" x="496" y="302" text-anchor="middle" fill="rgb(8, 80, 65)">Handoff 模式</text>

  <rect x="60" y="344" width="520" height="28" rx="6" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="0.5"/>
  <text class="label b" x="320" y="362" text-anchor="middle" fill="rgb(68, 68, 65)">如果单 Agent 能搞定，单 Agent 永远是更好的选择</text>
</svg>