<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">单 Agent 天花板的四种典型场景</title>
  <desc id="desc">展示单 Agent 在上下文容量、并行需求、视角独立性、角色纯度四个维度的物理限制。</desc>

  <defs>
    <style>
      .label {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        text-anchor: middle;
      }
      .card-title {
        font-size: 14px;
        font-weight: 600;
      }
      .card-body {
        font-size: 12px;
        font-weight: 400;
      }
      .section-title {
        font-size: 16px;
        font-weight: 600;
      }
    </style>
  </defs>

  <text class="label section-title" x="340" y="32" fill="rgb(68, 68, 65)">单 Agent 的四种物理限制</text>

  <rect x="24" y="56" width="148" height="120" rx="10" fill="rgb(252, 230, 227)" stroke="rgb(201, 77, 61)" stroke-width="0.5"/>
  <text class="label card-title" x="98" y="84" fill="rgb(140, 41, 29)">上下文容量</text>
  <text class="label card-body" x="98" y="108" fill="rgb(201, 77, 61)">信息量超出单个</text>
  <text class="label card-body" x="98" y="124" fill="rgb(201, 77, 61)">context window</text>
  <text class="label card-body" x="98" y="148" fill="rgb(201, 77, 61)">压缩也救不了</text>
  <text class="label card-body" x="98" y="164" fill="rgb(201, 77, 61)">只能丢信息</text>

  <rect x="184" y="56" width="148" height="120" rx="10" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text class="label card-title" x="258" y="84" fill="rgb(99, 56, 6)">并行需求</text>
  <text class="label card-body" x="258" y="108" fill="rgb(133, 79, 11)">多个独立子任务</text>
  <text class="label card-body" x="258" y="124" fill="rgb(133, 79, 11)">串行执行太慢</text>
  <text class="label card-body" x="258" y="148" fill="rgb(133, 79, 11)">瓶颈是物理时间</text>
  <text class="label card-body" x="258" y="164" fill="rgb(133, 79, 11)">不是能力问题</text>

  <rect x="344" y="56" width="148" height="120" rx="10" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text class="label card-title" x="418" y="84" fill="rgb(60, 52, 137)">视角独立性</text>
  <text class="label card-body" x="418" y="108" fill="rgb(83, 74, 183)">自我审查存在</text>
  <text class="label card-body" x="418" y="124" fill="rgb(83, 74, 183)">一致性偏差</text>
  <text class="label card-body" x="418" y="148" fill="rgb(83, 74, 183)">独立上下文才能</text>
  <text class="label card-body" x="418" y="164" fill="rgb(83, 74, 183)">避免推理锚定</text>

  <rect x="504" y="56" width="148" height="120" rx="10" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text class="label card-title" x="578" y="84" fill="rgb(8, 80, 65)">角色纯度</text>
  <text class="label card-body" x="578" y="108" fill="rgb(15, 110, 86)">多角色共用 prompt</text>
  <text class="label card-body" x="578" y="124" fill="rgb(15, 110, 86)">指令互相干扰</text>
  <text class="label card-body" x="578" y="148" fill="rgb(15, 110, 86)">拆分后各自聚焦</text>
  <text class="label card-body" x="578" y="164" fill="rgb(15, 110, 86)">质量更高</text>

  <line x1="98" y1="176" x2="98" y2="204" stroke="rgb(95, 94, 90)" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="258" y1="176" x2="258" y2="204" stroke="rgb(95, 94, 90)" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="418" y1="176" x2="418" y2="204" stroke="rgb(95, 94, 90)" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="578" y1="176" x2="578" y2="204" stroke="rgb(95, 94, 90)" stroke-width="1" stroke-dasharray="4 3"/>

  <rect x="24" y="204" width="628" height="40" rx="8" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="0.5"/>
  <text class="label card-body" x="338" y="229" fill="rgb(68, 68, 65)" font-weight="500">不是不够聪明——换更强的模型也解决不了，这是单 Agent 架构本身的物理限制</text>

  <text class="label card-body" x="340" y="276" fill="rgb(95, 94, 90)">如果任务不触及这四种限制 → 先优化单 Agent 的 Planning、Prompt 和工具设计</text>
</svg>