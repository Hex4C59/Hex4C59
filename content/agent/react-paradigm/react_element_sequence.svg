<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t1 d1">
  <title id="t1">ReAct 循环结构</title>
  <desc id="d1">ReAct 由 Thought、Action、Observation 三种元素交替循环，直到输出 Answer。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .label { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      .t { font-size: 14px; font-weight: 500; }
      .b { font-size: 12px; font-weight: 400; }
    </style>
  </defs>

  <rect x="80" y="30" width="180" height="56" rx="8" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text class="label t" x="170" y="52" text-anchor="middle" fill="rgb(60, 52, 137)">Thought</text>
  <text class="label b" x="170" y="72" text-anchor="middle" fill="rgb(83, 74, 183)">推理判断，规划下一步</text>

  <line x1="170" y1="88" x2="170" y2="118" stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="80" y="120" width="180" height="56" rx="8" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text class="label t" x="170" y="142" text-anchor="middle" fill="rgb(8, 80, 65)">Action</text>
  <text class="label b" x="170" y="162" text-anchor="middle" fill="rgb(15, 110, 86)">调用工具 + 传入参数</text>

  <line x1="170" y1="178" x2="170" y2="208" stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="80" y="210" width="180" height="56" rx="8" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text class="label t" x="170" y="232" text-anchor="middle" fill="rgb(99, 56, 6)">Observation</text>
  <text class="label b" x="170" y="252" text-anchor="middle" fill="rgb(133, 79, 11)">工具返回的结果</text>

  <path d="M 262 238 L 330 238 L 330 58 L 262 58" fill="none" stroke="rgb(115, 114, 108)" stroke-width="1" stroke-dasharray="5 3" opacity="0.5" marker-end="url(#arrow)"/>
  <text class="label b" x="342" y="152" text-anchor="start" fill="rgb(95, 94, 90)">循环</text>

  <line x1="330" y1="58" x2="448" y2="58" stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="label b" x="390" y="48" text-anchor="middle" fill="rgb(95, 94, 90)">信息已足够</text>

  <rect x="450" y="30" width="180" height="56" rx="8" fill="rgb(234, 243, 222)" stroke="rgb(59, 109, 17)" stroke-width="0.5"/>
  <text class="label t" x="540" y="52" text-anchor="middle" fill="rgb(39, 80, 10)">Answer</text>
  <text class="label b" x="540" y="72" text-anchor="middle" fill="rgb(59, 109, 17)">输出最终回答</text>

  <rect x="80" y="282" width="12" height="12" rx="2" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text class="label b" x="98" y="293" text-anchor="start" fill="rgb(61, 61, 58)">推理</text>
  <rect x="160" y="282" width="12" height="12" rx="2" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text class="label b" x="178" y="293" text-anchor="start" fill="rgb(61, 61, 58)">行动</text>
  <rect x="240" y="282" width="12" height="12" rx="2" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text class="label b" x="258" y="293" text-anchor="start" fill="rgb(61, 61, 58)">观察</text>
  <rect x="320" y="282" width="12" height="12" rx="2" fill="rgb(234, 243, 222)" stroke="rgb(59, 109, 17)" stroke-width="0.5"/>
  <text class="label b" x="338" y="293" text-anchor="start" fill="rgb(61, 61, 58)">结束</text>
</svg>