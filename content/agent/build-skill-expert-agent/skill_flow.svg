<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Skill 匹配与注入流程</title>
  <desc id="desc">展示 Agent 如何根据用户任务自动匹配 Skill 并注入上下文。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .label { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; text-anchor: middle; }
      .title-text { font-size: 14px; font-weight: 500; }
      .body-text { font-size: 12px; font-weight: 400; }
      .heading { font-size: 14px; font-weight: 500; }
      .small-text { font-size: 11px; font-weight: 400; }
      .step-num { font-size: 12px; font-weight: 600; }
    </style>
  </defs>

  <text x="340" y="28" class="label heading" fill="rgb(20, 20, 19)">Skill 匹配与注入流程</text>

  <!-- Step 1 -->
  <rect x="40" y="50" width="280" height="44" rx="8" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="0.5"/>
  <text x="60" y="76" class="label step-num" fill="rgb(68, 68, 65)" text-anchor="start">①</text>
  <text x="190" y="76" class="label body-text" fill="rgb(68, 68, 65)">用户输入任务描述</text>

  <line x1="320" y1="72" x2="358" y2="72" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>

  <!-- Step 2: Match -->
  <rect x="360" y="50" width="280" height="44" rx="8" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text x="382" y="76" class="label step-num" fill="rgb(99, 56, 6)" text-anchor="start">②</text>
  <text x="510" y="76" class="label body-text" fill="rgb(99, 56, 6)">Skill 匹配器扫描 Skill 库</text>

  <line x1="500" y1="94" x2="500" y2="116" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>

  <!-- Match detail -->
  <rect x="340" y="118" width="320" height="70" rx="8" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text x="500" y="140" class="label small-text" fill="rgb(99, 56, 6)">匹配策略（按优先级）：</text>
  <text x="500" y="158" class="label small-text" fill="rgb(133, 79, 11)">1. 关键词匹配 description</text>
  <text x="500" y="174" class="label small-text" fill="rgb(133, 79, 11)">2. LLM 语义匹配（可选）</text>

  <line x1="340" y1="153" x2="320" y2="153" stroke="rgb(115, 114, 108)" stroke-width="1" fill="none"/>
  <line x1="320" y1="153" x2="320" y2="220" stroke="rgb(115, 114, 108)" stroke-width="1" fill="none"/>
  <line x1="320" y1="220" x2="338" y2="220" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>

  <!-- Step 3: Inject -->
  <rect x="340" y="202" width="320" height="44" rx="8" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="362" y="228" class="label step-num" fill="rgb(60, 52, 137)" text-anchor="start">③</text>
  <text x="510" y="228" class="label body-text" fill="rgb(60, 52, 137)">读取 Skill 内容 → 注入 System Prompt</text>

  <line x1="500" y1="246" x2="500" y2="266" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>

  <!-- Step 4: Context -->
  <rect x="40" y="268" width="620" height="44" rx="8" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="62" y="294" class="label step-num" fill="rgb(8, 80, 65)" text-anchor="start">④</text>
  <text x="360" y="294" class="label body-text" fill="rgb(8, 80, 65)">最终上下文 = 基础 System Prompt + Skill 内容 + 用户任务</text>

  <text x="340" y="334" class="label body-text" fill="rgb(95, 94, 90)">Skill 在 System Prompt 和 User Message 之间注入——Agent 把它当作"领域专家的指导"</text>
</svg>
