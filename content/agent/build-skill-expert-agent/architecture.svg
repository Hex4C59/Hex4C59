<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Skill Agent 架构</title>
  <desc id="desc">展示 Skill 驱动的专家 Agent 架构——Skill 加载器从文件中读取领域知识，注入 Agent 上下文。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .label { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; text-anchor: middle; }
      .title-text { font-size: 14px; font-weight: 500; }
      .body-text { font-size: 12px; font-weight: 400; }
      .heading { font-size: 14px; font-weight: 500; }
      .small-text { font-size: 11px; font-weight: 400; }
    </style>
  </defs>

  <text x="340" y="28" class="label heading" fill="rgb(20, 20, 19)">Skill 驱动的专家 Agent</text>

  <!-- User Task -->
  <rect x="220" y="46" width="240" height="38" rx="8" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="0.5"/>
  <text x="340" y="70" class="label body-text" fill="rgb(68, 68, 65)">"帮我写一篇关于 X 的博客文章"</text>

  <line x1="340" y1="84" x2="340" y2="106" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>

  <!-- Agent Core -->
  <rect x="100" y="108" width="480" height="150" rx="12" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="340" y="132" class="label title-text" fill="rgb(60, 52, 137)">Agent 核心</text>

  <!-- Skill Loader -->
  <rect x="120" y="148" width="140" height="48" rx="8" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text x="190" y="168" class="label title-text" fill="rgb(99, 56, 6)">Skill 加载器</text>
  <text x="190" y="184" class="label small-text" fill="rgb(133, 79, 11)">匹配 + 读取 + 注入</text>

  <!-- Context Assembly -->
  <rect x="280" y="148" width="140" height="48" rx="8" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="350" y="168" class="label title-text" fill="rgb(60, 52, 137)">上下文组装</text>
  <text x="350" y="184" class="label small-text" fill="rgb(83, 74, 183)">System + Skill + Task</text>

  <!-- ReAct -->
  <rect x="440" y="148" width="120" height="48" rx="8" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="500" y="168" class="label title-text" fill="rgb(8, 80, 65)">ReAct 循环</text>
  <text x="500" y="184" class="label small-text" fill="rgb(15, 110, 86)">推理 + 执行</text>

  <line x1="260" y1="172" x2="278" y2="172" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.2" fill="none"/>
  <line x1="420" y1="172" x2="438" y2="172" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.2" fill="none"/>

  <!-- Skill Quality Gate -->
  <rect x="120" y="210" width="440" height="32" rx="6" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="340" y="230" class="label body-text" fill="rgb(8, 80, 65)">输出校验：用 Skill 中的 Checklist 验证输出是否符合规范</text>

  <!-- Arrow to Skill files -->
  <line x1="190" y1="148" x2="190" y2="108" stroke="rgb(133, 79, 11)" stroke-width="1" fill="none"/>
  <line x1="190" y1="108" x2="190" y2="88" stroke="rgb(133, 79, 11)" stroke-width="1" fill="none"/>

  <!-- Skill Files -->
  <rect x="40" y="280" width="600" height="110" rx="12" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text x="340" y="304" class="label title-text" fill="rgb(99, 56, 6)">Skill 文件库</text>

  <rect x="60" y="316" width="170" height="60" rx="6" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text x="145" y="336" class="label small-text" fill="rgb(99, 56, 6)">write-blog-post.md</text>
  <text x="145" y="352" class="label small-text" fill="rgb(133, 79, 11)">文章结构、Front Matter</text>
  <text x="145" y="366" class="label small-text" fill="rgb(133, 79, 11)">引用规范、风格要求</text>

  <rect x="250" y="316" width="170" height="60" rx="6" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text x="335" y="336" class="label small-text" fill="rgb(99, 56, 6)">create-svg-diagram.md</text>
  <text x="335" y="352" class="label small-text" fill="rgb(133, 79, 11)">配色、字体、布局规范</text>
  <text x="335" y="366" class="label small-text" fill="rgb(133, 79, 11)">SVG 模板和命名规则</text>

  <rect x="440" y="316" width="180" height="60" rx="6" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text x="530" y="336" class="label small-text" fill="rgb(99, 56, 6)">review-code.md</text>
  <text x="530" y="352" class="label small-text" fill="rgb(133, 79, 11)">审查标准、输出格式</text>
  <text x="530" y="366" class="label small-text" fill="rgb(133, 79, 11)">严重等级定义</text>

  <!-- Arrow from skill files to loader -->
  <line x1="190" y1="280" x2="190" y2="258" marker-end="url(#arrow)" stroke="rgb(133, 79, 11)" stroke-width="1.5" fill="none"/>
  <text x="220" y="270" class="label small-text" fill="rgb(133, 79, 11)" text-anchor="start">加载匹配的 Skill</text>

  <text x="340" y="414" class="label body-text" fill="rgb(95, 94, 90)">Skill 文件是纯 Markdown——不是代码，不是配置，是写给 Agent 看的操作手册</text>
</svg>
