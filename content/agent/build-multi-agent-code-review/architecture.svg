<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">代码审查 Multi-Agent 架构</title>
  <desc id="desc">展示代码审查系统的 Supervisor 模式：Supervisor 分发 PR 给三个专家 Agent 并行审查，最终综合意见。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .label { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; text-anchor: middle; }
      .title-text { font-size: 14px; font-weight: 500; }
      .body-text { font-size: 12px; font-weight: 400; }
      .heading { font-size: 14px; font-weight: 500; }
      .small-text { font-size: 11px; font-weight: 400; }
    </style>
  </defs>

  <text x="340" y="28" class="label heading" fill="rgb(20, 20, 19)">代码审查 Multi-Agent 系统</text>

  <!-- Input: PR -->
  <rect x="240" y="46" width="200" height="40" rx="8" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="0.5"/>
  <text x="340" y="70" class="label body-text" fill="rgb(68, 68, 65)">Pull Request (代码变更)</text>

  <line x1="340" y1="86" x2="340" y2="106" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>

  <!-- Supervisor -->
  <rect x="190" y="108" width="300" height="56" rx="10" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="340" y="132" class="label title-text" fill="rgb(60, 52, 137)">Supervisor Agent</text>
  <text x="340" y="152" class="label body-text" fill="rgb(83, 74, 183)">任务分解 → 分发 → 收集 → 综合</text>

  <!-- Three arrows down to workers -->
  <line x1="150" y1="164" x2="150" y2="196" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>
  <line x1="340" y1="164" x2="340" y2="196" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>
  <line x1="530" y1="164" x2="530" y2="196" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>

  <text x="150" y="186" class="label small-text" fill="rgb(95, 94, 90)">分发</text>
  <text x="340" y="186" class="label small-text" fill="rgb(95, 94, 90)">分发</text>
  <text x="530" y="186" class="label small-text" fill="rgb(95, 94, 90)">分发</text>

  <!-- Worker 1: Logic -->
  <rect x="50" y="198" width="200" height="100" rx="10" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="150" y="222" class="label title-text" fill="rgb(8, 80, 65)">逻辑审查 Agent</text>
  <text x="150" y="244" class="label small-text" fill="rgb(15, 110, 86)">• 代码逻辑是否正确</text>
  <text x="150" y="260" class="label small-text" fill="rgb(15, 110, 86)">• 边界条件处理</text>
  <text x="150" y="276" class="label small-text" fill="rgb(15, 110, 86)">• 可读性和可维护性</text>

  <!-- Worker 2: Security -->
  <rect x="270" y="198" width="200" height="100" rx="10" fill="rgb(252, 230, 227)" stroke="rgb(201, 77, 61)" stroke-width="0.5"/>
  <text x="370" y="222" class="label title-text" fill="rgb(140, 41, 29)">安全审查 Agent</text>
  <text x="370" y="244" class="label small-text" fill="rgb(201, 77, 61)">• 注入漏洞检测</text>
  <text x="370" y="260" class="label small-text" fill="rgb(201, 77, 61)">• 认证/授权缺陷</text>
  <text x="370" y="276" class="label small-text" fill="rgb(201, 77, 61)">• 敏感信息泄露</text>

  <!-- Worker 3: Performance -->
  <rect x="490" y="198" width="160" height="100" rx="10" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text x="570" y="222" class="label title-text" fill="rgb(99, 56, 6)">性能审查 Agent</text>
  <text x="570" y="244" class="label small-text" fill="rgb(133, 79, 11)">• N+1 查询</text>
  <text x="570" y="260" class="label small-text" fill="rgb(133, 79, 11)">• 内存泄漏风险</text>
  <text x="570" y="276" class="label small-text" fill="rgb(133, 79, 11)">• 算法复杂度</text>

  <!-- Parallel indicator -->
  <rect x="255" y="308" width="170" height="22" rx="4" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="0.5"/>
  <text x="340" y="323" class="label small-text" fill="rgb(95, 94, 90)">⚡ 三个 Agent 并行执行</text>

  <!-- Three arrows back up to supervisor/synthesis -->
  <line x1="150" y1="298" x2="150" y2="348" stroke="rgb(115, 114, 108)" stroke-width="1" fill="none"/>
  <line x1="370" y1="298" x2="370" y2="348" stroke="rgb(115, 114, 108)" stroke-width="1" fill="none"/>
  <line x1="570" y1="298" x2="570" y2="348" stroke="rgb(115, 114, 108)" stroke-width="1" fill="none"/>
  <line x1="150" y1="348" x2="570" y2="348" stroke="rgb(115, 114, 108)" stroke-width="1" fill="none"/>
  <line x1="340" y1="348" x2="340" y2="362" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>

  <!-- Synthesis -->
  <rect x="190" y="364" width="300" height="36" rx="8" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="340" y="386" class="label title-text" fill="rgb(60, 52, 137)">Supervisor 综合审查意见</text>

  <line x1="340" y1="400" x2="340" y2="418" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>

  <text x="340" y="436" class="label body-text" fill="rgb(95, 94, 90)">输出：结构化审查报告（每个问题标注发现者和严重等级）</text>
</svg>
