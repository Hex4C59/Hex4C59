<svg width="100%" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Research Agent 执行流程</title>
  <desc id="desc">展示 Research Agent 从任务接收到报告输出的完整执行流程，包括规划、多轮检索、质量审查和综合报告。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .label {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        text-anchor: middle;
      }
      .title-text { font-size: 14px; font-weight: 500; }
      .body-text { font-size: 12px; font-weight: 400; }
      .heading { font-size: 14px; font-weight: 500; }
      .small-text { font-size: 11px; font-weight: 400; }
      .step-num { font-size: 12px; font-weight: 600; }
    </style>
  </defs>

  <text x="340" y="28" class="label heading" fill="rgb(20, 20, 19)">Research Agent 执行流程</text>

  <!-- Step 1: Task Input -->
  <rect x="210" y="46" width="260" height="44" rx="8" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="0.5"/>
  <text x="230" y="72" class="label step-num" fill="rgb(68, 68, 65)" text-anchor="start">①</text>
  <text x="350" y="72" class="label body-text" fill="rgb(68, 68, 65)">接收研究任务</text>

  <line x1="340" y1="90" x2="340" y2="106" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>

  <!-- Step 2: Planning -->
  <rect x="160" y="108" width="360" height="60" rx="8" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="180" y="134" class="label step-num" fill="rgb(60, 52, 137)" text-anchor="start">②</text>
  <text x="350" y="134" class="label title-text" fill="rgb(60, 52, 137)">制定研究计划</text>
  <text x="350" y="154" class="label body-text" fill="rgb(83, 74, 183)">分解为 3~5 个具体研究问题 + 确定检索策略</text>

  <line x1="340" y1="168" x2="340" y2="184" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>

  <!-- Step 3: Research Loop (big box) -->
  <rect x="80" y="186" width="520" height="140" rx="10" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text x="100" y="210" class="label step-num" fill="rgb(99, 56, 6)" text-anchor="start">③</text>
  <text x="340" y="210" class="label title-text" fill="rgb(99, 56, 6)">Agentic RAG 研究循环（对每个研究问题）</text>

  <!-- Sub-steps inside loop -->
  <rect x="100" y="224" width="120" height="36" rx="6" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text x="160" y="246" class="label small-text" fill="rgb(133, 79, 11)">生成检索查询</text>

  <line x1="220" y1="242" x2="240" y2="242" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.2" fill="none"/>

  <rect x="242" y="224" width="120" height="36" rx="6" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text x="302" y="246" class="label small-text" fill="#185fa5">多源检索</text>

  <line x1="362" y1="242" x2="382" y2="242" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.2" fill="none"/>

  <rect x="384" y="224" width="120" height="36" rx="6" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text x="444" y="246" class="label small-text" fill="rgb(133, 79, 11)">评估信息质量</text>

  <!-- Loop back arrow -->
  <path d="M 444 260 L 444 280 L 160 280 L 160 260" fill="none" stroke="rgb(133, 79, 11)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="302" y="296" class="label small-text" fill="rgb(133, 79, 11)">信息不足 → 优化查询后重新检索</text>

  <!-- Sufficient info arrow -->
  <text x="530" y="246" class="label small-text" fill="rgb(15, 110, 86)" text-anchor="start">信息</text>
  <text x="530" y="260" class="label small-text" fill="rgb(15, 110, 86)" text-anchor="start">充分 ↓</text>

  <line x1="340" y1="326" x2="340" y2="342" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>

  <!-- Step 4: Reflection -->
  <rect x="160" y="344" width="360" height="52" rx="8" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="180" y="366" class="label step-num" fill="rgb(8, 80, 65)" text-anchor="start">④</text>
  <text x="350" y="366" class="label title-text" fill="rgb(8, 80, 65)">全局质量审查</text>
  <text x="350" y="384" class="label body-text" fill="rgb(15, 110, 86)">覆盖度检查 + 信息矛盾检测 + 来源可靠性评估</text>

  <line x1="340" y1="396" x2="340" y2="412" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>

  <!-- Step 5: Report -->
  <rect x="160" y="414" width="360" height="52" rx="8" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="180" y="436" class="label step-num" fill="rgb(60, 52, 137)" text-anchor="start">⑤</text>
  <text x="350" y="436" class="label title-text" fill="rgb(60, 52, 137)">综合报告生成</text>
  <text x="350" y="454" class="label body-text" fill="rgb(83, 74, 183)">结构化输出 + 每个结论标注信息来源</text>

  <!-- Bottom note -->
  <text x="340" y="510" class="label body-text" fill="rgb(95, 94, 90)">关键：步骤 ③ 不是一次性的检索，而是 Agent 自动驱动的多轮迭代</text>
</svg>
