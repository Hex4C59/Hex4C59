<svg width="100%" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Research Agent 整体架构</title>
  <desc id="desc">展示 Research Agent 的三层架构：用户任务层、Agent 核心层（Planning + Agentic RAG 循环）、工具与知识层。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .label {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        text-anchor: middle;
      }
      .title-text { font-size: 14px; font-weight: 500; }
      .body-text { font-size: 12px; font-weight: 400; }
      .heading { font-size: 14px; font-weight: 500; }
      .small-text { font-size: 11px; font-weight: 400; }
    </style>
  </defs>

  <text x="340" y="28" class="label heading" fill="rgb(20, 20, 19)">Research Agent 整体架构</text>

  <!-- Layer 1: User Task -->
  <rect x="200" y="46" width="280" height="48" rx="10" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="0.5"/>
  <text x="340" y="66" class="label title-text" fill="rgb(68, 68, 65)">用户研究任务</text>
  <text x="340" y="84" class="label body-text" fill="rgb(95, 94, 90)">"分析 2025 年 AI Agent 框架的技术趋势"</text>

  <line x1="340" y1="94" x2="340" y2="116" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>

  <!-- Layer 2: Agent Core -->
  <rect x="40" y="118" width="600" height="220" rx="12" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="340" y="142" class="label title-text" fill="rgb(60, 52, 137)">Agent 核心</text>

  <!-- Planning sub-module -->
  <rect x="60" y="158" width="260" height="60" rx="8" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="190" y="180" class="label title-text" fill="rgb(60, 52, 137)">研究规划器</text>
  <text x="190" y="198" class="label body-text" fill="rgb(83, 74, 183)">任务分解 → 研究问题列表</text>

  <!-- Agentic RAG Loop -->
  <rect x="360" y="158" width="260" height="60" rx="8" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text x="490" y="180" class="label title-text" fill="rgb(99, 56, 6)">Agentic RAG 循环</text>
  <text x="490" y="198" class="label body-text" fill="rgb(133, 79, 11)">检索 → 评估 → 追问 → 再检索</text>

  <line x1="320" y1="188" x2="358" y2="188" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>

  <!-- Reflection -->
  <rect x="60" y="234" width="170" height="48" rx="8" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="145" y="254" class="label title-text" fill="rgb(8, 80, 65)">信息质量审查</text>
  <text x="145" y="270" class="label body-text" fill="rgb(15, 110, 86)">充分性 + 可靠性判断</text>

  <!-- Synthesis -->
  <rect x="250" y="234" width="170" height="48" rx="8" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="335" y="254" class="label title-text" fill="rgb(8, 80, 65)">信息综合引擎</text>
  <text x="335" y="270" class="label body-text" fill="rgb(15, 110, 86)">多源整合 + 矛盾处理</text>

  <!-- Report -->
  <rect x="440" y="234" width="180" height="48" rx="8" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="530" y="254" class="label title-text" fill="rgb(8, 80, 65)">报告生成</text>
  <text x="530" y="270" class="label body-text" fill="rgb(15, 110, 86)">结构化输出 + 来源引用</text>

  <!-- Arrows between sub-modules -->
  <line x1="230" y1="258" x2="248" y2="258" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.2" fill="none"/>
  <line x1="420" y1="258" x2="438" y2="258" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.2" fill="none"/>

  <!-- Feedback arrow from Reflection back to Agentic RAG -->
  <path d="M 145 234 L 145 224 L 490 224 L 490 218" fill="none" stroke="rgb(83, 74, 183)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="320" y="220" class="label small-text" fill="rgb(83, 74, 183)">信息不足时触发追加检索</text>

  <line x1="340" y1="310" x2="340" y2="316" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>

  <!-- Arrow to tools -->
  <line x1="340" y1="338" x2="340" y2="352" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>

  <!-- Layer 3: Tools & Knowledge -->
  <rect x="40" y="354" width="600" height="70" rx="12" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="0.5"/>
  <text x="340" y="376" class="label title-text" fill="rgb(68, 68, 65)">工具与知识层</text>

  <rect x="60" y="388" width="115" height="28" rx="6" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="0.5"/>
  <text x="117" y="406" class="label body-text" fill="rgb(95, 94, 90)">网络搜索</text>

  <rect x="190" y="388" width="115" height="28" rx="6" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="0.5"/>
  <text x="247" y="406" class="label body-text" fill="rgb(95, 94, 90)">网页内容提取</text>

  <rect x="320" y="388" width="115" height="28" rx="6" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="0.5"/>
  <text x="377" y="406" class="label body-text" fill="rgb(95, 94, 90)">知识库检索</text>

  <rect x="450" y="388" width="170" height="28" rx="6" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="0.5"/>
  <text x="535" y="406" class="label body-text" fill="rgb(95, 94, 90)">文件读写 / 笔记</text>

  <!-- Bottom note -->
  <text x="340" y="450" class="label body-text" fill="rgb(95, 94, 90)">与 Coding Agent 的区别：信息检索替代代码执行，综合分析替代代码编写</text>
</svg>
