<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">文件管理 Agent 整体架构</title>
  <desc id="desc">展示文件管理 Agent 的三层架构：用户任务层、Agent 核心层（ReAct + Guardrails）、工具层（按权限分级）。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .label { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; text-anchor: middle; }
      .title-text { font-size: 14px; font-weight: 500; }
      .body-text { font-size: 12px; font-weight: 400; }
      .heading { font-size: 14px; font-weight: 500; }
      .small-text { font-size: 11px; font-weight: 400; }
    </style>
  </defs>

  <text x="340" y="28" class="label heading" fill="rgb(20, 20, 19)">文件管理 Agent 架构</text>

  <!-- Layer 1: User -->
  <rect x="200" y="46" width="280" height="44" rx="10" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="0.5"/>
  <text x="340" y="66" class="label title-text" fill="rgb(68, 68, 65)">用户任务</text>
  <text x="340" y="82" class="label body-text" fill="rgb(95, 94, 90)">"帮我整理 Downloads 目录里的文件"</text>

  <line x1="340" y1="90" x2="340" y2="110" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>

  <!-- Layer 2: Agent Core -->
  <rect x="40" y="112" width="600" height="150" rx="12" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="340" y="136" class="label title-text" fill="rgb(60, 52, 137)">Agent 核心</text>

  <!-- ReAct -->
  <rect x="60" y="150" width="170" height="48" rx="8" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="145" y="170" class="label title-text" fill="rgb(60, 52, 137)">ReAct 循环</text>
  <text x="145" y="186" class="label body-text" fill="rgb(83, 74, 183)">推理 → 行动 → 观察</text>

  <!-- Guardrails -->
  <rect x="255" y="150" width="170" height="48" rx="8" fill="rgb(252, 230, 227)" stroke="rgb(201, 77, 61)" stroke-width="0.5"/>
  <text x="340" y="170" class="label title-text" fill="rgb(140, 41, 29)">执行防护层</text>
  <text x="340" y="186" class="label body-text" fill="rgb(201, 77, 61)">权限校验 + 确认审批</text>

  <!-- Dry-run -->
  <rect x="450" y="150" width="170" height="48" rx="8" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="535" y="170" class="label title-text" fill="rgb(8, 80, 65)">Dry-run 引擎</text>
  <text x="535" y="186" class="label body-text" fill="rgb(15, 110, 86)">预览变更 → 确认执行</text>

  <line x1="230" y1="174" x2="253" y2="174" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.2" fill="none"/>
  <line x1="425" y1="174" x2="448" y2="174" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.2" fill="none"/>

  <!-- Undo Log -->
  <rect x="60" y="212" width="560" height="36" rx="6" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text x="340" y="234" class="label body-text" fill="rgb(99, 56, 6)">操作日志 &amp; Undo 栈：记录每一步操作，支持回滚</text>

  <line x1="340" y1="262" x2="340" y2="282" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>

  <!-- Layer 3: Tools -->
  <rect x="40" y="284" width="600" height="124" rx="12" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="0.5"/>
  <text x="340" y="308" class="label title-text" fill="rgb(68, 68, 65)">工具层（按权限分级）</text>

  <!-- Auto tools -->
  <rect x="60" y="318" width="135" height="36" rx="6" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="127" y="340" class="label body-text" fill="rgb(15, 110, 86)">列目录 / 读文件</text>
  <text x="127" y="362" class="label small-text" fill="rgb(15, 110, 86)">自动执行</text>

  <rect x="210" y="318" width="135" height="36" rx="6" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text x="277" y="340" class="label body-text" fill="rgb(133, 79, 11)">创建目录 / 复制</text>
  <text x="277" y="362" class="label small-text" fill="rgb(133, 79, 11)">通知后执行</text>

  <rect x="360" y="318" width="135" height="36" rx="6" fill="rgb(252, 230, 227)" stroke="rgb(201, 77, 61)" stroke-width="0.5"/>
  <text x="427" y="340" class="label body-text" fill="rgb(201, 77, 61)">移动 / 重命名</text>
  <text x="427" y="362" class="label small-text" fill="rgb(201, 77, 61)">确认后执行</text>

  <rect x="510" y="318" width="115" height="36" rx="6" fill="rgb(252, 230, 227)" stroke="rgb(153, 40, 27)" stroke-width="1"/>
  <text x="567" y="340" class="label body-text" fill="rgb(113, 30, 18)">删除文件</text>
  <text x="567" y="362" class="label small-text" fill="rgb(113, 30, 18)">Dry-run + 确认</text>

  <!-- Risk arrow -->
  <line x1="80" y1="392" x2="600" y2="392" stroke="rgb(201, 77, 61)" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <text x="80" y="408" class="label small-text" fill="rgb(95, 94, 90)" text-anchor="start">低风险</text>
  <text x="600" y="408" class="label small-text" fill="rgb(140, 41, 29)" text-anchor="end">高风险</text>

  <!-- Bottom note -->
  <text x="340" y="436" class="label body-text" fill="rgb(95, 94, 90)">风险越高的操作，需要越多的安全检查；删除操作必须先 Dry-run 再确认</text>
</svg>
