<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Guardrails 三层防护架构</title>
  <desc id="desc">展示 Agent 系统中输入防护、执行防护和输出防护三层安全边界的关系。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .label {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        text-anchor: middle;
      }
      .title-text {
        font-size: 14px;
        font-weight: 500;
      }
      .body-text {
        font-size: 12px;
        font-weight: 400;
      }
      .heading {
        font-size: 14px;
        font-weight: 500;
      }
    </style>
  </defs>

  <!-- Title -->
  <text x="340" y="28" class="label heading" fill="rgb(20, 20, 19)">Agent Guardrails：三层防护架构</text>

  <!-- Layer 1: Input Guardrails -->
  <rect x="40" y="50" width="180" height="310" rx="12" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="130" y="78" class="label title-text" fill="rgb(8, 80, 65)">输入防护</text>
  <text x="130" y="98" class="label body-text" fill="rgb(15, 110, 86)">Input Guardrails</text>

  <rect x="56" y="116" width="148" height="32" rx="6" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="130" y="136" class="label body-text" fill="rgb(15, 110, 86)">Prompt Injection 检测</text>

  <rect x="56" y="160" width="148" height="32" rx="6" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="130" y="180" class="label body-text" fill="rgb(15, 110, 86)">意图分类 &amp; 越界拦截</text>

  <rect x="56" y="204" width="148" height="32" rx="6" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="130" y="224" class="label body-text" fill="rgb(15, 110, 86)">输入内容过滤</text>

  <rect x="56" y="248" width="148" height="32" rx="6" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="130" y="268" class="label body-text" fill="rgb(15, 110, 86)">Schema 参数校验</text>

  <text x="130" y="322" class="label body-text" fill="rgb(15, 110, 86)">在模型推理之前</text>
  <text x="130" y="340" class="label body-text" fill="rgb(15, 110, 86)">过滤恶意和越界输入</text>

  <!-- Layer 2: Execution Guardrails -->
  <rect x="250" y="50" width="180" height="310" rx="12" fill="rgb(252, 230, 227)" stroke="rgb(201, 77, 61)" stroke-width="0.5"/>
  <text x="340" y="78" class="label title-text" fill="rgb(140, 41, 29)">执行防护</text>
  <text x="340" y="98" class="label body-text" fill="rgb(201, 77, 61)">Execution Guardrails</text>

  <rect x="266" y="116" width="148" height="32" rx="6" fill="rgb(252, 230, 227)" stroke="rgb(201, 77, 61)" stroke-width="0.5"/>
  <text x="340" y="136" class="label body-text" fill="rgb(201, 77, 61)">工具白名单 &amp; 权限分级</text>

  <rect x="266" y="160" width="148" height="32" rx="6" fill="rgb(252, 230, 227)" stroke="rgb(201, 77, 61)" stroke-width="0.5"/>
  <text x="340" y="180" class="label body-text" fill="rgb(201, 77, 61)">操作审批 &amp; 确认</text>

  <rect x="266" y="204" width="148" height="32" rx="6" fill="rgb(252, 230, 227)" stroke="rgb(201, 77, 61)" stroke-width="0.5"/>
  <text x="340" y="224" class="label body-text" fill="rgb(201, 77, 61)">沙箱隔离 &amp; 资源限制</text>

  <rect x="266" y="248" width="148" height="32" rx="6" fill="rgb(252, 230, 227)" stroke="rgb(201, 77, 61)" stroke-width="0.5"/>
  <text x="340" y="268" class="label body-text" fill="rgb(201, 77, 61)">执行频率 &amp; 成本熔断</text>

  <text x="340" y="322" class="label body-text" fill="rgb(201, 77, 61)">在工具调用时</text>
  <text x="340" y="340" class="label body-text" fill="rgb(201, 77, 61)">控制行为边界和影响范围</text>

  <!-- Layer 3: Output Guardrails -->
  <rect x="460" y="50" width="180" height="310" rx="12" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="550" y="78" class="label title-text" fill="rgb(60, 52, 137)">输出防护</text>
  <text x="550" y="98" class="label body-text" fill="rgb(83, 74, 183)">Output Guardrails</text>

  <rect x="476" y="116" width="148" height="32" rx="6" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="550" y="136" class="label body-text" fill="rgb(83, 74, 183)">敏感信息检测 &amp; 脱敏</text>

  <rect x="476" y="160" width="148" height="32" rx="6" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="550" y="180" class="label body-text" fill="rgb(83, 74, 183)">内容安全审核</text>

  <rect x="476" y="204" width="148" height="32" rx="6" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="550" y="224" class="label body-text" fill="rgb(83, 74, 183)">格式 &amp; 合规校验</text>

  <rect x="476" y="248" width="148" height="32" rx="6" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="550" y="268" class="label body-text" fill="rgb(83, 74, 183)">幻觉 &amp; 事实核查</text>

  <text x="550" y="322" class="label body-text" fill="rgb(83, 74, 183)">在结果返回之前</text>
  <text x="550" y="340" class="label body-text" fill="rgb(83, 74, 183)">确保输出安全、合规、准确</text>

  <!-- Arrows between layers -->
  <line x1="220" y1="205" x2="248" y2="205" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>
  <line x1="430" y1="205" x2="458" y2="205" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>

  <!-- Bottom note -->
  <text x="340" y="388" class="label body-text" fill="rgb(95, 94, 90)">每一层独立运作，三层叠加形成纵深防御；任何一层拦截成功，流程终止</text>
</svg>
