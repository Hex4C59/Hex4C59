<svg width="100%" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Guardrails 纵深防御流程</title>
  <desc id="desc">展示用户输入经过输入防护、模型推理、执行防护、工具执行、输出防护到最终输出的完整流程。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .label {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        text-anchor: middle;
      }
      .title-text {
        font-size: 14px;
        font-weight: 500;
      }
      .body-text {
        font-size: 12px;
        font-weight: 400;
      }
      .heading {
        font-size: 14px;
        font-weight: 500;
      }
      .small-text {
        font-size: 11px;
        font-weight: 400;
      }
    </style>
  </defs>

  <!-- Title -->
  <text x="340" y="28" class="label heading" fill="rgb(20, 20, 19)">Guardrails 纵深防御流程</text>

  <!-- Step 1: User Input -->
  <rect x="250" y="48" width="180" height="44" rx="8" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="0.5"/>
  <text x="340" y="75" class="label title-text" fill="rgb(68, 68, 65)">用户输入</text>

  <line x1="340" y1="92" x2="340" y2="108" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>

  <!-- Step 2: Input Guardrails -->
  <rect x="200" y="110" width="280" height="56" rx="8" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="340" y="134" class="label title-text" fill="rgb(8, 80, 65)">输入防护层</text>
  <text x="340" y="152" class="label body-text" fill="rgb(15, 110, 86)">Injection 检测 → 意图分类 → 内容过滤</text>

  <!-- Reject branch from Input -->
  <line x1="480" y1="138" x2="560" y2="138" marker-end="url(#arrow)" stroke="rgb(201, 77, 61)" stroke-width="1.2" fill="none"/>
  <rect x="562" y="122" width="80" height="32" rx="6" fill="rgb(252, 230, 227)" stroke="rgb(201, 77, 61)" stroke-width="0.5"/>
  <text x="602" y="142" class="label body-text" fill="rgb(201, 77, 61)">拦截拒绝</text>

  <line x1="340" y1="166" x2="340" y2="182" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>

  <!-- Step 3: Model Reasoning -->
  <rect x="250" y="184" width="180" height="44" rx="8" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="340" y="211" class="label title-text" fill="rgb(60, 52, 137)">模型推理决策</text>

  <line x1="340" y1="228" x2="340" y2="244" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>

  <!-- Step 4: Execution Guardrails -->
  <rect x="200" y="246" width="280" height="56" rx="8" fill="rgb(252, 230, 227)" stroke="rgb(201, 77, 61)" stroke-width="0.5"/>
  <text x="340" y="270" class="label title-text" fill="rgb(140, 41, 29)">执行防护层</text>
  <text x="340" y="288" class="label body-text" fill="rgb(201, 77, 61)">权限校验 → 审批确认 → 沙箱隔离</text>

  <!-- Reject branch from Execution -->
  <line x1="480" y1="274" x2="560" y2="274" marker-end="url(#arrow)" stroke="rgb(201, 77, 61)" stroke-width="1.2" fill="none"/>
  <rect x="562" y="258" width="80" height="32" rx="6" fill="rgb(252, 230, 227)" stroke="rgb(201, 77, 61)" stroke-width="0.5"/>
  <text x="602" y="278" class="label body-text" fill="rgb(201, 77, 61)">阻断执行</text>

  <line x1="340" y1="302" x2="340" y2="318" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>

  <!-- Step 5: Tool Execution -->
  <rect x="250" y="320" width="180" height="44" rx="8" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text x="340" y="347" class="label title-text" fill="rgb(99, 56, 6)">工具执行</text>

  <line x1="340" y1="364" x2="340" y2="380" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>

  <!-- Step 6: Output Guardrails -->
  <rect x="200" y="382" width="280" height="56" rx="8" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="340" y="406" class="label title-text" fill="rgb(60, 52, 137)">输出防护层</text>
  <text x="340" y="424" class="label body-text" fill="rgb(83, 74, 183)">PII 脱敏 → 内容审核 → 事实核查</text>

  <!-- Reject branch from Output -->
  <line x1="480" y1="410" x2="560" y2="410" marker-end="url(#arrow)" stroke="rgb(201, 77, 61)" stroke-width="1.2" fill="none"/>
  <rect x="562" y="394" width="80" height="32" rx="6" fill="rgb(252, 230, 227)" stroke="rgb(201, 77, 61)" stroke-width="0.5"/>
  <text x="602" y="414" class="label body-text" fill="rgb(201, 77, 61)">过滤替换</text>

  <line x1="340" y1="438" x2="340" y2="454" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>

  <!-- Step 7: Final Output -->
  <rect x="250" y="456" width="180" height="44" rx="8" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="340" y="483" class="label title-text" fill="rgb(8, 80, 65)">安全输出</text>

  <!-- Left annotation: "纵深防御" vertical text-like annotation -->
  <line x1="60" y1="118" x2="60" y2="430" stroke="rgb(95, 94, 90)" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
  <text x="60" y="108" class="label small-text" fill="rgb(95, 94, 90)">纵深防御</text>
  <text x="60" y="448" class="label small-text" fill="rgb(95, 94, 90)">三层独立</text>

  <!-- Bottom note -->
  <text x="340" y="514" class="label body-text" fill="rgb(95, 94, 90)">每一层有独立的拦截能力，不依赖其他层的判断</text>
</svg>
