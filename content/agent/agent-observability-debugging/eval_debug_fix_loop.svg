<svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">评测-调试-修复闭环</title>
  <desc id="desc">展示评测发现问题、调试定位原因、修复解决问题的完整闭环。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .label { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; text-anchor: middle; }
      .title-text { font-size: 14px; font-weight: 500; }
      .body-text { font-size: 12px; font-weight: 400; }
      .heading { font-size: 14px; font-weight: 500; }
      .small-text { font-size: 11px; font-weight: 400; }
    </style>
  </defs>

  <text x="340" y="28" class="label heading" fill="rgb(20, 20, 19)">评测 → 调试 → 修复 闭环</text>

  <!-- Step 1: Evaluate -->
  <rect x="40" y="60" width="180" height="200" rx="12" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="130" y="88" class="label title-text" fill="rgb(60, 52, 137)">评测</text>
  <text x="130" y="108" class="label body-text" fill="rgb(83, 74, 183)">发现问题</text>

  <rect x="56" y="124" width="148" height="24" rx="6" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="130" y="140" class="label small-text" fill="rgb(83, 74, 183)">任务完成率下降</text>
  <rect x="56" y="156" width="148" height="24" rx="6" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="130" y="172" class="label small-text" fill="rgb(83, 74, 183)">某类任务系统性失败</text>
  <rect x="56" y="188" width="148" height="24" rx="6" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="130" y="204" class="label small-text" fill="rgb(83, 74, 183)">成本异常升高</text>

  <text x="130" y="240" class="label body-text" fill="rgb(83, 74, 183)">知道"出了问题"</text>
  <text x="130" y="256" class="label body-text" fill="rgb(83, 74, 183)">但不知道为什么</text>

  <!-- Arrow 1→2 -->
  <line x1="220" y1="160" x2="248" y2="160" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>

  <!-- Step 2: Debug -->
  <rect x="250" y="60" width="180" height="200" rx="12" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text x="340" y="88" class="label title-text" fill="rgb(99, 56, 6)">调试</text>
  <text x="340" y="108" class="label body-text" fill="rgb(133, 79, 11)">定位原因</text>

  <rect x="266" y="124" width="148" height="24" rx="6" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text x="340" y="140" class="label small-text" fill="rgb(133, 79, 11)">Trace 还原执行路径</text>
  <rect x="266" y="156" width="148" height="24" rx="6" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text x="340" y="172" class="label small-text" fill="rgb(133, 79, 11)">Log 分析推理链断点</text>
  <rect x="266" y="188" width="148" height="24" rx="6" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text x="340" y="204" class="label small-text" fill="rgb(133, 79, 11)">Replay 复现问题场景</text>

  <text x="340" y="240" class="label body-text" fill="rgb(133, 79, 11)">知道"问题出在哪"</text>
  <text x="340" y="256" class="label body-text" fill="rgb(133, 79, 11)">和"为什么出问题"</text>

  <!-- Arrow 2→3 -->
  <line x1="430" y1="160" x2="458" y2="160" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>

  <!-- Step 3: Fix -->
  <rect x="460" y="60" width="180" height="200" rx="12" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="550" y="88" class="label title-text" fill="rgb(8, 80, 65)">修复</text>
  <text x="550" y="108" class="label body-text" fill="rgb(15, 110, 86)">解决问题</text>

  <rect x="476" y="124" width="148" height="24" rx="6" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="550" y="140" class="label small-text" fill="rgb(15, 110, 86)">调整 Prompt 约束</text>
  <rect x="476" y="156" width="148" height="24" rx="6" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="550" y="172" class="label small-text" fill="rgb(15, 110, 86)">修改工具返回值</text>
  <rect x="476" y="188" width="148" height="24" rx="6" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="550" y="204" class="label small-text" fill="rgb(15, 110, 86)">增加 Guardrails 规则</text>

  <text x="550" y="240" class="label body-text" fill="rgb(15, 110, 86)">问题解决</text>
  <text x="550" y="256" class="label body-text" fill="rgb(15, 110, 86)">回到评测验证效果</text>

  <!-- Loop arrow from Fix back to Evaluate -->
  <path d="M 550 260 L 550 290 L 130 290 L 130 260" fill="none" stroke="rgb(95, 94, 90)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="340" y="306" class="label small-text" fill="rgb(95, 94, 90)">回归验证</text>
</svg>
