<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agent 可观测性三支柱</title>
  <desc id="desc">展示 Agent 可观测性的三个支柱——Tracing、Logging、Metrics——各自的职责和关系。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .label { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; text-anchor: middle; }
      .title-text { font-size: 14px; font-weight: 500; }
      .body-text { font-size: 12px; font-weight: 400; }
      .heading { font-size: 14px; font-weight: 500; }
      .small-text { font-size: 11px; font-weight: 400; }
    </style>
  </defs>

  <text x="340" y="28" class="label heading" fill="rgb(20, 20, 19)">Agent 可观测性三支柱</text>

  <!-- Center: Agent Execution -->
  <rect x="230" y="48" width="220" height="44" rx="10" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="340" y="68" class="label title-text" fill="rgb(60, 52, 137)">Agent 执行过程</text>
  <text x="340" y="84" class="label body-text" fill="rgb(83, 74, 183)">推理 → 工具调用 → 观察 → 推理 ...</text>

  <!-- Three arrows down -->
  <line x1="150" y1="92" x2="150" y2="120" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>
  <line x1="340" y1="92" x2="340" y2="120" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>
  <line x1="530" y1="92" x2="530" y2="120" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>

  <!-- Pillar 1: Tracing -->
  <rect x="40" y="122" width="220" height="230" rx="12" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="150" y="150" class="label title-text" fill="rgb(60, 52, 137)">Tracing</text>
  <text x="150" y="170" class="label body-text" fill="rgb(83, 74, 183)">执行轨迹追踪</text>

  <rect x="56" y="186" width="188" height="28" rx="6" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="150" y="204" class="label small-text" fill="rgb(83, 74, 183)">每一步推理的输入/输出</text>

  <rect x="56" y="222" width="188" height="28" rx="6" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="150" y="240" class="label small-text" fill="rgb(83, 74, 183)">工具调用参数和返回值</text>

  <rect x="56" y="258" width="188" height="28" rx="6" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="150" y="276" class="label small-text" fill="rgb(83, 74, 183)">Span 嵌套的父子关系</text>

  <text x="150" y="316" class="label body-text" fill="rgb(83, 74, 183)">回答：发生了什么？</text>
  <text x="150" y="334" class="label body-text" fill="rgb(83, 74, 183)">按什么顺序发生的？</text>

  <!-- Pillar 2: Logging -->
  <rect x="280" y="122" width="220" height="230" rx="12" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text x="390" y="150" class="label title-text" fill="rgb(99, 56, 6)">Logging</text>
  <text x="390" y="170" class="label body-text" fill="rgb(133, 79, 11)">结构化日志</text>

  <rect x="296" y="186" width="188" height="28" rx="6" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text x="390" y="204" class="label small-text" fill="rgb(133, 79, 11)">推理链（Thought 文本）</text>

  <rect x="296" y="222" width="188" height="28" rx="6" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text x="390" y="240" class="label small-text" fill="rgb(133, 79, 11)">错误和异常详情</text>

  <rect x="296" y="258" width="188" height="28" rx="6" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text x="390" y="276" class="label small-text" fill="rgb(133, 79, 11)">决策点和分支选择</text>

  <text x="390" y="316" class="label body-text" fill="rgb(133, 79, 11)">回答：为什么这么做？</text>
  <text x="390" y="334" class="label body-text" fill="rgb(133, 79, 11)">哪一步出了问题？</text>

  <!-- Pillar 3: Metrics -->
  <rect x="420" y="122" width="220" height="230" rx="12" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="530" y="150" class="label title-text" fill="rgb(8, 80, 65)">Metrics</text>
  <text x="530" y="170" class="label body-text" fill="rgb(15, 110, 86)">量化指标</text>

  <rect x="436" y="186" width="188" height="28" rx="6" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="530" y="204" class="label small-text" fill="rgb(15, 110, 86)">Token 用量 &amp; 成本</text>

  <rect x="436" y="222" width="188" height="28" rx="6" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="530" y="240" class="label small-text" fill="rgb(15, 110, 86)">延迟（总/每步/工具）</text>

  <rect x="436" y="258" width="188" height="28" rx="6" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="530" y="276" class="label small-text" fill="rgb(15, 110, 86)">成功率 &amp; 重试次数</text>

  <text x="530" y="316" class="label body-text" fill="rgb(15, 110, 86)">回答：表现怎么样？</text>
  <text x="530" y="334" class="label body-text" fill="rgb(15, 110, 86)">趋势在变好还是变差？</text>

  <!-- Bottom connections -->
  <line x1="150" y1="352" x2="150" y2="372" stroke="rgb(115, 114, 108)" stroke-width="1" fill="none"/>
  <line x1="390" y1="352" x2="390" y2="372" stroke="rgb(115, 114, 108)" stroke-width="1" fill="none"/>
  <line x1="530" y1="352" x2="530" y2="372" stroke="rgb(115, 114, 108)" stroke-width="1" fill="none"/>
  <line x1="150" y1="372" x2="530" y2="372" stroke="rgb(115, 114, 108)" stroke-width="1" fill="none"/>
  <line x1="340" y1="372" x2="340" y2="384" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.5" fill="none"/>

  <text x="340" y="398" class="label body-text" fill="rgb(95, 94, 90)">三者结合：Trace 定位问题位置 → Log 理解问题原因 → Metrics 衡量问题影响</text>
</svg>
