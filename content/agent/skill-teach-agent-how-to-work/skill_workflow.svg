<svg width="100%" viewBox="0 0 480 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t4 d4">
  <title id="t4">Skill 工作流程</title>
  <desc id="d4">Agent 自动发现、匹配、注入 Skill 并按指导执行任务的完整流程。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .label { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      .t { font-size: 14px; font-weight: 500; }
      .b { font-size: 12px; font-weight: 400; }
    </style>
  </defs>

  <rect x="140" y="20" width="200" height="44" rx="8" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="0.5"/>
  <text class="label t" x="240" y="46" text-anchor="middle" fill="rgb(68, 68, 65)">用户发出任务</text>

  <line x1="240" y1="66" x2="240" y2="88" stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="140" y="90" width="200" height="44" rx="8" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text class="label t" x="240" y="108" text-anchor="middle" fill="rgb(60, 52, 137)">扫描可用 Skill 列表</text>
  <text class="label b" x="240" y="126" text-anchor="middle" fill="rgb(83, 74, 183)">Agent 自动发现</text>

  <line x1="240" y1="136" x2="240" y2="158" stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="120" y="160" width="240" height="44" rx="8" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text class="label t" x="240" y="178" text-anchor="middle" fill="rgb(99, 56, 6)">根据 description 匹配</text>
  <text class="label b" x="240" y="196" text-anchor="middle" fill="rgb(133, 79, 11)">选择最相关的 Skill</text>

  <line x1="240" y1="206" x2="240" y2="228" stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="120" y="230" width="240" height="44" rx="8" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text class="label t" x="240" y="248" text-anchor="middle" fill="rgb(8, 80, 65)">注入 Skill 内容</text>
  <text class="label b" x="240" y="266" text-anchor="middle" fill="rgb(15, 110, 86)">读取并加入当前上下文</text>

  <line x1="240" y1="276" x2="240" y2="298" stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="140" y="300" width="200" height="44" rx="8" fill="rgb(234, 243, 222)" stroke="rgb(59, 109, 17)" stroke-width="0.5"/>
  <text class="label t" x="240" y="318" text-anchor="middle" fill="rgb(39, 80, 10)">按 Skill 指导执行</text>
  <text class="label b" x="240" y="336" text-anchor="middle" fill="rgb(59, 109, 17)">输出结果</text>
</svg>