<svg width="100%" viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t5 d5">
  <title id="t5">MCP 与 Skill 的分工</title>
  <desc id="d5">MCP 解决怎么连接工具，Skill 解决怎么用好工具。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .label { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      .t { font-size: 14px; font-weight: 500; }
      .b { font-size: 12px; font-weight: 400; }
      .s { font-size: 13px; font-weight: 600; }
    </style>
  </defs>

  <text class="label s" x="170" y="24" text-anchor="middle" fill="rgb(60, 52, 137)">MCP 解决的问题</text>
  <rect x="30" y="36" width="280" height="80" rx="8" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text class="label t" x="170" y="60" text-anchor="middle" fill="rgb(60, 52, 137)">怎么连接？</text>
  <text class="label b" x="170" y="80" text-anchor="middle" fill="rgb(83, 74, 183)">用什么协议？认证怎么走？</text>
  <text class="label b" x="170" y="100" text-anchor="middle" fill="rgb(83, 74, 183)">标准化的 Client-Server 协议</text>

  <text class="label s" x="510" y="24" text-anchor="middle" fill="rgb(8, 80, 65)">Skill 解决的问题</text>
  <rect x="370" y="36" width="280" height="80" rx="8" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text class="label t" x="510" y="60" text-anchor="middle" fill="rgb(8, 80, 65)">怎么用好？</text>
  <text class="label b" x="510" y="80" text-anchor="middle" fill="rgb(15, 110, 86)">什么时候该创建 issue / PR？</text>
  <text class="label b" x="510" y="100" text-anchor="middle" fill="rgb(15, 110, 86)">项目级别的 Skill 文档</text>

  <rect x="30" y="136" width="620" height="56" rx="8" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="0.5"/>
  <text class="label t" x="340" y="160" text-anchor="middle" fill="rgb(68, 68, 65)">MCP = 万能钥匙　　Skill = 开锁说明书</text>
  <text class="label b" x="340" y="180" text-anchor="middle" fill="rgb(95, 94, 90)">两者组合：MCP 提供标准化工具接入，Skill 提供特定场景使用指南</text>
</svg>