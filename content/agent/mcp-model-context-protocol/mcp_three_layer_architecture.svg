<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t3 d3">
  <title id="t3">MCP 三层架构</title>
  <desc id="d3">MCP 的 Host、Client、Server 三层角色及其通信关系。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .label { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      .t { font-size: 14px; font-weight: 500; }
      .b { font-size: 12px; font-weight: 400; }
      .s { font-size: 15px; font-weight: 600; }
    </style>
  </defs>

  <rect x="60" y="20" width="560" height="160" rx="10" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="0.5"/>
  <text class="label s" x="90" y="46" text-anchor="start" fill="rgb(68, 68, 65)">Host（宿主应用）</text>
  <text class="label b" x="90" y="64" text-anchor="start" fill="rgb(95, 94, 90)">例如：Cursor、Claude Desktop</text>

  <rect x="100" y="84" width="140" height="76" rx="8" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text class="label t" x="170" y="114" text-anchor="middle" fill="rgb(60, 52, 137)">Client A</text>
  <text class="label b" x="170" y="134" text-anchor="middle" fill="rgb(83, 74, 183)">协议通信层</text>

  <rect x="270" y="84" width="140" height="76" rx="8" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text class="label t" x="340" y="114" text-anchor="middle" fill="rgb(60, 52, 137)">Client B</text>
  <text class="label b" x="340" y="134" text-anchor="middle" fill="rgb(83, 74, 183)">协议通信层</text>

  <rect x="440" y="84" width="140" height="76" rx="8" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text class="label t" x="510" y="114" text-anchor="middle" fill="rgb(60, 52, 137)">Client C</text>
  <text class="label b" x="510" y="134" text-anchor="middle" fill="rgb(83, 74, 183)">协议通信层</text>

  <line x1="170" y1="180" x2="170" y2="260" stroke="rgb(115, 114, 108)" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <line x1="340" y1="180" x2="340" y2="260" stroke="rgb(115, 114, 108)" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <line x1="510" y1="180" x2="510" y2="260" stroke="rgb(115, 114, 108)" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

  <text class="label b" x="130" y="224" text-anchor="middle" fill="rgb(95, 94, 90)">MCP 协议</text>
  <text class="label b" x="300" y="224" text-anchor="middle" fill="rgb(95, 94, 90)">MCP 协议</text>
  <text class="label b" x="470" y="224" text-anchor="middle" fill="rgb(95, 94, 90)">MCP 协议</text>

  <rect x="100" y="262" width="140" height="76" rx="8" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text class="label t" x="170" y="292" text-anchor="middle" fill="rgb(99, 56, 6)">Server A</text>
  <text class="label b" x="170" y="312" text-anchor="middle" fill="rgb(133, 79, 11)">GitHub</text>

  <rect x="270" y="262" width="140" height="76" rx="8" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text class="label t" x="340" y="292" text-anchor="middle" fill="rgb(99, 56, 6)">Server B</text>
  <text class="label b" x="340" y="312" text-anchor="middle" fill="rgb(133, 79, 11)">Slack</text>

  <rect x="440" y="262" width="140" height="76" rx="8" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text class="label t" x="510" y="292" text-anchor="middle" fill="rgb(99, 56, 6)">Server C</text>
  <text class="label b" x="510" y="312" text-anchor="middle" fill="rgb(133, 79, 11)">数据库</text>

  <rect x="180" y="356" width="12" height="12" rx="2" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="0.5"/>
  <text class="label b" x="198" y="367" text-anchor="start" fill="rgb(61, 61, 58)">Host</text>
  <rect x="260" y="356" width="12" height="12" rx="2" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text class="label b" x="278" y="367" text-anchor="start" fill="rgb(61, 61, 58)">Client</text>
  <rect x="340" y="356" width="12" height="12" rx="2" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text class="label b" x="358" y="367" text-anchor="start" fill="rgb(61, 61, 58)">Server</text>
</svg>