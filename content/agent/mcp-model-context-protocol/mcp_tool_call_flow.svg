<svg width="100%" viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t6 d6">
  <title id="t6">工具调用流程</title>
  <desc id="d6">MCP 正常操作阶段的 tools/list 和 tools/call 消息交换。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .label { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      .t { font-size: 14px; font-weight: 500; }
      .b { font-size: 12px; font-weight: 400; }
      .code { font-size: 12px; font-weight: 500; font-family: "SF Mono", "Fira Code", Menlo, monospace; }
    </style>
  </defs>

  <rect x="100" y="20" width="100" height="280" rx="0" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5" opacity="0.3"/>
  <text class="label t" x="150" y="16" text-anchor="middle" fill="rgb(60, 52, 137)">Client</text>
  <rect x="380" y="20" width="100" height="280" rx="0" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5" opacity="0.3"/>
  <text class="label t" x="430" y="16" text-anchor="middle" fill="rgb(99, 56, 6)">Server</text>

  <line x1="150" y1="20" x2="150" y2="300" stroke="rgb(83, 74, 183)" stroke-width="1" opacity="0.5"/>
  <line x1="430" y1="20" x2="430" y2="300" stroke="rgb(133, 79, 11)" stroke-width="1" opacity="0.5"/>

  <line x1="152" y1="60" x2="428" y2="60" stroke="rgb(15, 110, 86)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="label code" x="290" y="52" text-anchor="middle" fill="rgb(8, 80, 65)">tools/list</text>

  <line x1="428" y1="100" x2="152" y2="100" stroke="rgb(83, 74, 183)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="label b" x="290" y="92" text-anchor="middle" fill="rgb(60, 52, 137)">返回工具描述数组</text>

  <line x1="20" y1="140" x2="560" y2="140" stroke="rgb(95, 94, 90)" stroke-width="0.5" stroke-dasharray="4 3" opacity="0.5"/>

  <line x1="152" y1="180" x2="428" y2="180" stroke="rgb(15, 110, 86)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="label code" x="290" y="172" text-anchor="middle" fill="rgb(8, 80, 65)">tools/call</text>

  <rect x="190" y="196" width="200" height="32" rx="4" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="0.5"/>
  <text class="label code" x="290" y="216" text-anchor="middle" fill="rgb(68, 68, 65)">name: "create_issue"</text>

  <line x1="428" y1="260" x2="152" y2="260" stroke="rgb(83, 74, 183)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="label b" x="290" y="252" text-anchor="middle" fill="rgb(60, 52, 137)">返回执行结果</text>
</svg>