<svg width="100%" viewBox="0 0 520 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t5 d5">
  <title id="t5">Streamable HTTP 传输</title>
  <desc id="d5">远程场景下通过 HTTP POST 发送请求，可选 SSE 流式推送。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .label { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      .t { font-size: 14px; font-weight: 500; }
      .b { font-size: 12px; font-weight: 400; }
    </style>
  </defs>

  <rect x="20" y="30" width="160" height="100" rx="10" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text class="label t" x="100" y="68" text-anchor="middle" fill="rgb(60, 52, 137)">Client</text>
  <text class="label b" x="100" y="88" text-anchor="middle" fill="rgb(83, 74, 183)">MCP 客户端</text>

  <rect x="340" y="30" width="160" height="100" rx="10" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text class="label t" x="420" y="68" text-anchor="middle" fill="rgb(99, 56, 6)">Server</text>
  <text class="label b" x="420" y="88" text-anchor="middle" fill="rgb(133, 79, 11)">MCP 服务端</text>

  <line x1="182" y1="62" x2="338" y2="62" stroke="rgb(15, 110, 86)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="label b" x="260" y="54" text-anchor="middle" fill="rgb(8, 80, 65)">HTTP POST (JSON-RPC)</text>

  <line x1="338" y1="96" x2="182" y2="96" stroke="rgb(83, 74, 183)" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text class="label b" x="260" y="118" text-anchor="middle" fill="rgb(60, 52, 137)">SSE 流（可选，流式进度）</text>
</svg>