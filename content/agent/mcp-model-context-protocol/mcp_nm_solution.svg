<svg width="100%" viewBox="0 0 560 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t2 d2">
  <title id="t2">MCP 协议解法</title>
  <desc id="d2">通过 MCP 协议把集成问题从 N×M 变成 N+M。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .label { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      .t { font-size: 14px; font-weight: 500; }
      .b { font-size: 12px; font-weight: 400; }
    </style>
  </defs>

  <rect x="20" y="20" width="100" height="36" rx="6" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text class="label t" x="70" y="42" text-anchor="middle" fill="rgb(60, 52, 137)">Agent A</text>
  <rect x="20" y="72" width="100" height="36" rx="6" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text class="label t" x="70" y="94" text-anchor="middle" fill="rgb(60, 52, 137)">Agent B</text>
  <rect x="20" y="124" width="100" height="36" rx="6" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text class="label t" x="70" y="146" text-anchor="middle" fill="rgb(60, 52, 137)">Agent C</text>

  <rect x="190" y="20" width="80" height="140" rx="8" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text class="label t" x="230" y="95" text-anchor="middle" fill="rgb(8, 80, 65)" transform="rotate(-90 230 95)">MCP 协议</text>

  <rect x="340" y="8" width="200" height="36" rx="6" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text class="label b" x="440" y="30" text-anchor="middle" fill="rgb(99, 56, 6)">GitHub MCP Server</text>
  <rect x="340" y="56" width="200" height="36" rx="6" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text class="label b" x="440" y="78" text-anchor="middle" fill="rgb(99, 56, 6)">Slack MCP Server</text>
  <rect x="340" y="104" width="200" height="36" rx="6" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text class="label b" x="440" y="126" text-anchor="middle" fill="rgb(99, 56, 6)">PostgreSQL MCP Server</text>
  <rect x="340" y="152" width="200" height="36" rx="6" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text class="label b" x="440" y="174" text-anchor="middle" fill="rgb(99, 56, 6)">文件系统 MCP Server</text>

  <line x1="120" y1="38" x2="188" y2="60" stroke="rgb(15, 110, 86)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="120" y1="90" x2="188" y2="90" stroke="rgb(15, 110, 86)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="120" y1="142" x2="188" y2="120" stroke="rgb(15, 110, 86)" stroke-width="1.2" marker-end="url(#arrow)"/>

  <line x1="272" y1="50" x2="338" y2="26" stroke="rgb(15, 110, 86)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="272" y1="70" x2="338" y2="74" stroke="rgb(15, 110, 86)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="272" y1="110" x2="338" y2="122" stroke="rgb(15, 110, 86)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="272" y1="130" x2="338" y2="170" stroke="rgb(15, 110, 86)" stroke-width="1.2" marker-end="url(#arrow)"/>

  <text class="label b" x="280" y="216" text-anchor="middle" fill="rgb(8, 80, 65)">3 + 4 = 7 份实现，全部可复用</text>
</svg>