<svg width="100%" viewBox="0 0 480 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t4 d4">
  <title id="t4">stdio 传输方式</title>
  <desc id="d4">Client 以子进程方式启动 Server，通过 stdin/stdout 通信。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .label { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      .t { font-size: 14px; font-weight: 500; }
      .b { font-size: 12px; font-weight: 400; }
    </style>
  </defs>

  <rect x="20" y="20" width="180" height="160" rx="10" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="0.5"/>
  <text class="label t" x="110" y="48" text-anchor="middle" fill="rgb(68, 68, 65)">Host 进程</text>

  <rect x="40" y="64" width="140" height="44" rx="6" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text class="label b" x="110" y="90" text-anchor="middle" fill="rgb(60, 52, 137)">MCP Client</text>

  <rect x="280" y="44" width="180" height="120" rx="10" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text class="label t" x="370" y="72" text-anchor="middle" fill="rgb(99, 56, 6)">子进程: Server</text>
  <text class="label b" x="370" y="92" text-anchor="middle" fill="rgb(133, 79, 11)">python server.py</text>

  <line x1="182" y1="76" x2="278" y2="116" stroke="rgb(15, 110, 86)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="label b" x="222" y="86" text-anchor="middle" fill="rgb(8, 80, 65)">stdin</text>

  <line x1="278" y1="142" x2="182" y2="102" stroke="rgb(83, 74, 183)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="label b" x="238" y="136" text-anchor="middle" fill="rgb(60, 52, 137)">stdout</text>

  <text class="label b" x="370" y="148" text-anchor="middle" fill="rgb(133, 79, 11)">进程隔离 = 天然安全边界</text>
</svg>