<svg width="100%" viewBox="0 0 560 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t8 d8">
  <title id="t8">MCP 信任边界</title>
  <desc id="d8">MCP 三层架构中的信任关系：用户信任 Host，Host 有限信任 Server。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .label { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      .t { font-size: 14px; font-weight: 500; }
      .b { font-size: 12px; font-weight: 400; }
    </style>
  </defs>

  <rect x="20" y="30" width="100" height="50" rx="8" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="0.5"/>
  <text class="label t" x="70" y="60" text-anchor="middle" fill="rgb(68, 68, 65)">用户</text>

  <line x1="122" y1="55" x2="188" y2="55" stroke="rgb(15, 110, 86)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="label b" x="155" y="46" text-anchor="middle" fill="rgb(8, 80, 65)">信任</text>

  <rect x="190" y="30" width="140" height="50" rx="8" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text class="label t" x="260" y="60" text-anchor="middle" fill="rgb(60, 52, 137)">Host</text>

  <line x1="332" y1="55" x2="408" y2="55" stroke="rgb(133, 79, 11)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="label b" x="370" y="46" text-anchor="middle" fill="rgb(99, 56, 6)">有限信任</text>

  <rect x="410" y="30" width="130" height="50" rx="8" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text class="label t" x="475" y="60" text-anchor="middle" fill="rgb(99, 56, 6)">Server</text>

  <line x1="260" y1="82" x2="260" y2="120" stroke="rgb(115, 114, 108)" stroke-width="1" stroke-dasharray="4 3"/>

  <rect x="140" y="120" width="240" height="40" rx="6" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="0.5"/>
  <text class="label b" x="260" y="144" text-anchor="middle" fill="rgb(68, 68, 65)">Host 负责执行授权策略</text>
</svg>