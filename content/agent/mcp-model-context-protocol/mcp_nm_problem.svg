<svg width="100%" viewBox="0 0 560 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t1 d1">
  <title id="t1">工具集成的 N×M 问题</title>
  <desc id="d1">每个 Agent 都需要独立实现每个工具的适配层，导致大量重复工作。</desc>
  <defs>
    <style>
      .label { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      .t { font-size: 14px; font-weight: 500; }
      .b { font-size: 12px; font-weight: 400; }
    </style>
  </defs>

  <rect x="20" y="20" width="100" height="36" rx="6" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text class="label t" x="70" y="42" text-anchor="middle" fill="rgb(60, 52, 137)">Agent A</text>
  <rect x="20" y="100" width="100" height="36" rx="6" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text class="label t" x="70" y="122" text-anchor="middle" fill="rgb(60, 52, 137)">Agent B</text>
  <rect x="20" y="180" width="100" height="36" rx="6" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text class="label t" x="70" y="202" text-anchor="middle" fill="rgb(60, 52, 137)">Agent C</text>

  <rect x="360" y="20" width="180" height="36" rx="6" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text class="label b" x="450" y="42" text-anchor="middle" fill="rgb(99, 56, 6)">GitHub 适配层</text>
  <rect x="360" y="68" width="180" height="36" rx="6" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text class="label b" x="450" y="90" text-anchor="middle" fill="rgb(99, 56, 6)">Slack 适配层</text>
  <rect x="360" y="116" width="180" height="36" rx="6" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text class="label b" x="450" y="138" text-anchor="middle" fill="rgb(99, 56, 6)">PostgreSQL 适配层</text>
  <rect x="360" y="164" width="180" height="36" rx="6" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text class="label b" x="450" y="186" text-anchor="middle" fill="rgb(99, 56, 6)">文件系统适配层</text>

  <line x1="120" y1="38" x2="360" y2="38" stroke="rgb(201, 77, 61)" stroke-width="0.8" opacity="0.5"/>
  <line x1="120" y1="38" x2="360" y2="86" stroke="rgb(201, 77, 61)" stroke-width="0.8" opacity="0.5"/>
  <line x1="120" y1="38" x2="360" y2="134" stroke="rgb(201, 77, 61)" stroke-width="0.8" opacity="0.5"/>
  <line x1="120" y1="38" x2="360" y2="182" stroke="rgb(201, 77, 61)" stroke-width="0.8" opacity="0.5"/>
  <line x1="120" y1="118" x2="360" y2="38" stroke="rgb(201, 77, 61)" stroke-width="0.8" opacity="0.5"/>
  <line x1="120" y1="118" x2="360" y2="86" stroke="rgb(201, 77, 61)" stroke-width="0.8" opacity="0.5"/>
  <line x1="120" y1="118" x2="360" y2="134" stroke="rgb(201, 77, 61)" stroke-width="0.8" opacity="0.5"/>
  <line x1="120" y1="118" x2="360" y2="182" stroke="rgb(201, 77, 61)" stroke-width="0.8" opacity="0.5"/>
  <line x1="120" y1="198" x2="360" y2="38" stroke="rgb(201, 77, 61)" stroke-width="0.8" opacity="0.5"/>
  <line x1="120" y1="198" x2="360" y2="86" stroke="rgb(201, 77, 61)" stroke-width="0.8" opacity="0.5"/>
  <line x1="120" y1="198" x2="360" y2="134" stroke="rgb(201, 77, 61)" stroke-width="0.8" opacity="0.5"/>
  <line x1="120" y1="198" x2="360" y2="182" stroke="rgb(201, 77, 61)" stroke-width="0.8" opacity="0.5"/>

  <text class="label b" x="280" y="238" text-anchor="middle" fill="rgb(140, 41, 29)">每条连线 = 一套独立实现的适配逻辑</text>
  <text class="label b" x="280" y="260" text-anchor="middle" fill="rgb(95, 94, 90)">3 × 4 = 12 份重复工作</text>
</svg>