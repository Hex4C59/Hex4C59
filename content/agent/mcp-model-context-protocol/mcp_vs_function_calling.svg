<svg width="100%" viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t7 d7">
  <title id="t7">直接 Function Calling 与 MCP 对比</title>
  <desc id="d7">紧耦合的直接调用 vs 通过 MCP 标准协议解耦的工具复用。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .label { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      .t { font-size: 14px; font-weight: 500; }
      .b { font-size: 12px; font-weight: 400; }
      .s { font-size: 13px; font-weight: 600; }
    </style>
  </defs>

  <text class="label s" x="170" y="24" text-anchor="middle" fill="rgb(140, 41, 29)">直接 Function Calling</text>
  <rect x="30" y="40" width="120" height="40" rx="6" fill="rgb(252, 230, 227)" stroke="rgb(201, 77, 61)" stroke-width="0.5"/>
  <text class="label b" x="90" y="64" text-anchor="middle" fill="rgb(140, 41, 29)">Agent 代码</text>
  <line x1="150" y1="60" x2="200" y2="60" stroke="rgb(201, 77, 61)" stroke-width="1.5"/>
  <line x1="200" y1="60" x2="200" y2="60" stroke="rgb(201, 77, 61)" stroke-width="1.5"/>
  <rect x="200" y="40" width="120" height="40" rx="6" fill="rgb(252, 230, 227)" stroke="rgb(201, 77, 61)" stroke-width="0.5"/>
  <text class="label b" x="260" y="64" text-anchor="middle" fill="rgb(140, 41, 29)">工具实现</text>
  <text class="label b" x="175" y="50" text-anchor="middle" fill="rgb(201, 77, 61)">紧耦合</text>

  <text class="label b" x="170" y="108" text-anchor="middle" fill="rgb(95, 94, 90)">每换一个 Agent 框架就要重新适配</text>

  <line x1="340" y1="10" x2="340" y2="210" stroke="rgb(95, 94, 90)" stroke-width="0.5" stroke-dasharray="4 3" opacity="0.4"/>

  <text class="label s" x="510" y="24" text-anchor="middle" fill="rgb(8, 80, 65)">MCP</text>
  <rect x="370" y="40" width="100" height="40" rx="6" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text class="label b" x="420" y="56" text-anchor="middle" fill="rgb(8, 80, 65)">Agent</text>
  <text class="label b" x="420" y="70" text-anchor="middle" fill="rgb(15, 110, 86)">(MCP Client)</text>

  <line x1="470" y1="60" x2="508" y2="60" stroke="rgb(15, 110, 86)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="510" y="40" width="60" height="40" rx="6" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text class="label b" x="540" y="56" text-anchor="middle" fill="rgb(8, 80, 65)">MCP</text>
  <text class="label b" x="540" y="70" text-anchor="middle" fill="rgb(15, 110, 86)">Server</text>

  <line x1="570" y1="60" x2="608" y2="60" stroke="rgb(15, 110, 86)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="610" y="40" width="60" height="40" rx="6" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text class="label b" x="640" y="56" text-anchor="middle" fill="rgb(99, 56, 6)">工具</text>
  <text class="label b" x="640" y="70" text-anchor="middle" fill="rgb(133, 79, 11)">实现</text>

  <text class="label b" x="510" y="108" text-anchor="middle" fill="rgb(95, 94, 90)">Server 写一次，所有兼容 Agent 都能用</text>

  <rect x="30" y="140" width="620" height="48" rx="8" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="0.5"/>
  <text class="label b" x="340" y="162" text-anchor="middle" fill="rgb(68, 68, 65)">简单封闭系统 → 直接 Function Calling 更轻量</text>
  <text class="label b" x="340" y="178" text-anchor="middle" fill="rgb(68, 68, 65)">需要工具复用、生态互通 → MCP 价值最大</text>
</svg>