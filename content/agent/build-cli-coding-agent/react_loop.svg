<svg width="100%" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Title -->
<text x="340" y="32" text-anchor="middle" style="fill:rgb(20,20,19);font-family:'Inter',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">ReAct 循环执行流程</text>

<!-- ① 用户输入 -->
<g style="font-family:'Inter',-apple-system,'system-ui','Segoe UI',sans-serif;">
  <rect x="240" y="48" width="200" height="44" rx="8" style="fill:rgb(241,239,232);stroke:rgb(95,94,90);stroke-width:0.5px;"/>
  <text x="340" y="70" text-anchor="middle" dominant-baseline="central" style="fill:rgb(68,68,65);font-size:14px;font-weight:500;">用户输入任务</text>
</g>

<line x1="340" y1="92" x2="340" y2="124" marker-end="url(#arrow)" style="stroke:rgb(115,114,108);stroke-width:1.5px;fill:none;"/>

<!-- ② 注入对话历史 -->
<g style="font-family:'Inter',-apple-system,'system-ui','Segoe UI',sans-serif;">
  <rect x="240" y="126" width="200" height="44" rx="8" style="fill:rgb(241,239,232);stroke:rgb(95,94,90);stroke-width:0.5px;"/>
  <text x="340" y="144" text-anchor="middle" dominant-baseline="central" style="fill:rgb(68,68,65);font-size:13px;font-weight:500;">追加 user_message</text>
  <text x="340" y="162" text-anchor="middle" dominant-baseline="central" style="fill:rgb(95,94,90);font-size:11px;">→ conversation_history</text>
</g>

<line x1="340" y1="170" x2="340" y2="202" marker-end="url(#arrow)" style="stroke:rgb(115,114,108);stroke-width:1.5px;fill:none;"/>

<!-- ③ 调用 LLM -->
<g style="font-family:'Inter',-apple-system,'system-ui','Segoe UI',sans-serif;">
  <rect x="200" y="204" width="280" height="56" rx="8" style="fill:rgb(238,237,254);stroke:rgb(83,74,183);stroke-width:0.5px;"/>
  <text x="340" y="226" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60,52,137);font-size:14px;font-weight:500;">调用 Anthropic API</text>
  <text x="340" y="248" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83,74,183);font-size:12px;">传入完整 conversation_history</text>
</g>

<line x1="340" y1="260" x2="340" y2="292" marker-end="url(#arrow)" style="stroke:rgb(115,114,108);stroke-width:1.5px;fill:none;"/>

<!-- ④ 判断 stop_reason -->
<polygon points="340,294 430,326 340,358 250,326" style="fill:none;stroke:rgba(31,30,29,0.35);stroke-width:0.8px;"/>
<text x="340" y="322" text-anchor="middle" dominant-baseline="central" style="fill:rgb(61,61,58);font-family:'Inter',-apple-system,sans-serif;font-size:12px;">stop_reason?</text>

<!-- end_turn 路径 → 右 -->
<line x1="430" y1="326" x2="532" y2="326" marker-end="url(#arrow)" style="stroke:rgb(115,114,108);stroke-width:1.5px;fill:none;"/>
<text x="476" y="316" text-anchor="middle" style="fill:rgb(61,61,58);font-family:'Inter',-apple-system,sans-serif;font-size:11px;">end_turn</text>

<g style="font-family:'Inter',-apple-system,'system-ui','Segoe UI',sans-serif;">
  <rect x="534" y="300" width="120" height="52" rx="8" style="fill:rgb(225,245,238);stroke:rgb(15,110,86);stroke-width:0.5px;"/>
  <text x="594" y="322" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8,80,65);font-size:14px;font-weight:500;">✓ 完成</text>
  <text x="594" y="342" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15,110,86);font-size:11px;">输出最终回答</text>
</g>

<!-- tool_use 路径 → 下 -->
<line x1="340" y1="358" x2="340" y2="390" marker-end="url(#arrow)" style="stroke:rgb(115,114,108);stroke-width:1.5px;fill:none;"/>
<text x="350" y="378" style="fill:rgb(61,61,58);font-family:'Inter',-apple-system,sans-serif;font-size:11px;">tool_use</text>

<!-- ⑤ 执行工具 -->
<g style="font-family:'Inter',-apple-system,'system-ui','Segoe UI',sans-serif;">
  <rect x="200" y="392" width="280" height="56" rx="8" style="fill:rgb(250,238,218);stroke:rgb(133,79,11);stroke-width:0.5px;"/>
  <text x="340" y="414" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99,56,6);font-size:14px;font-weight:500;">执行工具</text>
  <text x="340" y="436" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133,79,11);font-size:12px;">TOOL_REGISTRY[tool_name](**tool_input)</text>
</g>

<line x1="340" y1="448" x2="340" y2="480" marker-end="url(#arrow)" style="stroke:rgb(115,114,108);stroke-width:1.5px;fill:none;"/>

<!-- ⑥ 注入工具结果 -->
<g style="font-family:'Inter',-apple-system,'system-ui','Segoe UI',sans-serif;">
  <rect x="220" y="482" width="240" height="44" rx="8" style="fill:rgb(241,239,232);stroke:rgb(95,94,90);stroke-width:0.5px;"/>
  <text x="340" y="500" text-anchor="middle" dominant-baseline="central" style="fill:rgb(68,68,65);font-size:13px;font-weight:500;">将 tool_result 注入历史</text>
  <text x="340" y="518" text-anchor="middle" dominant-baseline="central" style="fill:rgb(95,94,90);font-size:11px;">驱动下一轮推理</text>
</g>

<!-- 循环回路：左侧大弧 -->
<path d="M 220 504 L 100 504 L 100 232 L 198 232" fill="none" stroke="rgb(115,114,108)" stroke-width="1" stroke-dasharray="5,3" opacity="0.6" marker-end="url(#arrow)"/>
<text x="72" y="376" text-anchor="middle" dominant-baseline="central" style="fill:rgb(95,94,90);font-family:'Inter',-apple-system,sans-serif;font-size:11px;" transform="rotate(-90 72 376)">继续迭代</text>

<!-- other 路径 → 左 -->
<line x1="250" y1="326" x2="170" y2="326" marker-end="url(#arrow)" style="stroke:rgb(115,114,108);stroke-width:1.5px;fill:none;"/>
<text x="206" y="316" text-anchor="middle" style="fill:rgb(61,61,58);font-family:'Inter',-apple-system,sans-serif;font-size:11px;">other</text>

<g style="font-family:'Inter',-apple-system,'system-ui','Segoe UI',sans-serif;">
  <rect x="28" y="300" width="140" height="52" rx="8" style="fill:rgb(250,236,231);stroke:rgb(153,60,29);stroke-width:0.5px;"/>
  <text x="98" y="322" text-anchor="middle" dominant-baseline="central" style="fill:rgb(113,43,19);font-size:13px;font-weight:500;">记录并中止</text>
  <text x="98" y="342" text-anchor="middle" dominant-baseline="central" style="fill:rgb(153,60,29);font-size:11px;">max_tokens 等</text>
</g>

<!-- MAX_ITERATIONS 标注框 -->
<rect x="28" y="432" width="164" height="52" rx="6" style="fill:none;stroke:rgba(133,79,11,0.4);stroke-width:1px;stroke-dasharray:4,3;"/>
<text x="110" y="454" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99,56,6);font-family:'Inter',-apple-system,sans-serif;font-size:11px;font-weight:500;">MAX_ITERATIONS = 30</text>
<text x="110" y="474" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133,79,11);font-family:'Inter',-apple-system,sans-serif;font-size:11px;">超出后强制中止循环</text>

<!-- 图例 -->
<g style="font-family:'Inter',-apple-system,sans-serif;">
  <rect x="140" y="572" width="10" height="10" rx="2" style="fill:rgb(238,237,254);stroke:rgb(83,74,183);stroke-width:0.5px;"/>
  <text x="156" y="581" dominant-baseline="central" style="fill:rgb(61,61,58);font-size:11px;">LLM 调用</text>

  <rect x="230" y="572" width="10" height="10" rx="2" style="fill:rgb(250,238,218);stroke:rgb(133,79,11);stroke-width:0.5px;"/>
  <text x="246" y="581" dominant-baseline="central" style="fill:rgb(61,61,58);font-size:11px;">工具执行</text>

  <rect x="320" y="572" width="10" height="10" rx="2" style="fill:rgb(225,245,238);stroke:rgb(15,110,86);stroke-width:0.5px;"/>
  <text x="336" y="581" dominant-baseline="central" style="fill:rgb(61,61,58);font-size:11px;">完成退出</text>

  <rect x="410" y="572" width="10" height="10" rx="2" style="fill:rgb(250,236,231);stroke:rgb(153,60,29);stroke-width:0.5px;"/>
  <text x="426" y="581" dominant-baseline="central" style="fill:rgb(61,61,58);font-size:11px;">异常中止</text>

  <rect x="500" y="572" width="10" height="10" rx="2" style="fill:rgb(241,239,232);stroke:rgb(95,94,90);stroke-width:0.5px;"/>
  <text x="516" y="581" dominant-baseline="central" style="fill:rgb(61,61,58);font-size:11px;">状态传递</text>
</g>
</svg>
