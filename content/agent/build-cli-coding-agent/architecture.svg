<svg width="100%" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Title -->
<text x="340" y="32" text-anchor="middle" style="fill:rgb(20,20,19);font-family:'Inter',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">CLI Coding Agent 三层结构</text>

<!-- ===== 层一：Shell 接口 ===== -->
<g style="font-family:'Inter',-apple-system,'system-ui','Segoe UI',sans-serif;">
  <rect x="220" y="50" width="240" height="64" rx="8" style="fill:rgb(241,239,232);stroke:rgb(95,94,90);stroke-width:0.5px;"/>
  <text x="340" y="76" text-anchor="middle" dominant-baseline="central" style="fill:rgb(68,68,65);font-size:14px;font-weight:500;">Shell 接口</text>
  <text x="340" y="98" text-anchor="middle" dominant-baseline="central" style="fill:rgb(95,94,90);font-size:12px;">cli/main.py · 用户输入 / 流式输出</text>
</g>

<!-- 左侧注释 1 -->
<text x="28" y="79" style="fill:rgb(95,94,90);font-family:'Inter',-apple-system,sans-serif;font-size:11px;">仅负责 I/O</text>
<text x="28" y="97" style="fill:rgb(95,94,90);font-family:'Inter',-apple-system,sans-serif;font-size:11px;">不含推理逻辑</text>

<!-- 箭头 1→2 -->
<line x1="340" y1="114" x2="340" y2="148" marker-end="url(#arrow)" style="stroke:rgb(115,114,108);stroke-width:1.5px;fill:none;"/>
<text x="350" y="136" style="fill:rgb(115,114,108);font-family:'Inter',-apple-system,sans-serif;font-size:11px;">user_message</text>

<!-- ===== 层二：Agent 核心 ===== -->
<g style="font-family:'Inter',-apple-system,'system-ui','Segoe UI',sans-serif;">
  <rect x="180" y="150" width="320" height="86" rx="8" style="fill:rgb(238,237,254);stroke:rgb(83,74,183);stroke-width:0.5px;"/>
  <text x="340" y="178" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60,52,137);font-size:14px;font-weight:500;">Agent 核心（ReAct 循环）</text>
  <text x="340" y="200" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83,74,183);font-size:12px;">agent/core.py</text>
  <text x="340" y="222" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83,74,183);font-size:12px;">Thought → Action → Observation · conversation_history</text>
</g>

<!-- 左侧注释 2 -->
<text x="28" y="175" style="fill:rgb(95,94,90);font-family:'Inter',-apple-system,sans-serif;font-size:11px;">调用 Anthropic API</text>
<text x="28" y="193" style="fill:rgb(95,94,90);font-family:'Inter',-apple-system,sans-serif;font-size:11px;">解析 stop_reason</text>
<text x="28" y="211" style="fill:rgb(95,94,90);font-family:'Inter',-apple-system,sans-serif;font-size:11px;">分发工具调用</text>
<text x="28" y="229" style="fill:rgb(95,94,90);font-family:'Inter',-apple-system,sans-serif;font-size:11px;">注入工具结果</text>

<!-- 箭头 2→3 -->
<line x1="340" y1="236" x2="340" y2="270" marker-end="url(#arrow)" style="stroke:rgb(115,114,108);stroke-width:1.5px;fill:none;"/>
<text x="350" y="258" style="fill:rgb(115,114,108);font-family:'Inter',-apple-system,sans-serif;font-size:11px;">tool_input</text>

<!-- ===== 层三：工具集主框 ===== -->
<g style="font-family:'Inter',-apple-system,'system-ui','Segoe UI',sans-serif;">
  <rect x="220" y="272" width="240" height="56" rx="8" style="fill:rgb(250,238,218);stroke:rgb(133,79,11);stroke-width:0.5px;"/>
  <text x="340" y="294" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99,56,6);font-size:14px;font-weight:500;">工具集</text>
  <text x="340" y="314" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133,79,11);font-size:12px;">agent/tools.py</text>
</g>

<!-- 工具集展开：四个工具 -->
<g style="font-family:'Inter',-apple-system,'system-ui','Segoe UI',sans-serif;">
  <!-- read_file -->
  <rect x="60" y="370" width="120" height="54" rx="8" style="fill:rgb(250,238,218);stroke:rgb(133,79,11);stroke-width:0.5px;"/>
  <text x="120" y="392" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99,56,6);font-size:13px;font-weight:500;">read_file</text>
  <text x="120" y="412" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133,79,11);font-size:11px;">文件读取</text>

  <!-- write_file -->
  <rect x="200" y="370" width="120" height="54" rx="8" style="fill:rgb(250,238,218);stroke:rgb(133,79,11);stroke-width:0.5px;"/>
  <text x="260" y="392" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99,56,6);font-size:13px;font-weight:500;">write_file</text>
  <text x="260" y="412" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133,79,11);font-size:11px;">文件写入</text>

  <!-- run_command -->
  <rect x="340" y="370" width="140" height="54" rx="8" style="fill:rgb(250,238,218);stroke:rgb(133,79,11);stroke-width:0.5px;"/>
  <text x="410" y="392" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99,56,6);font-size:13px;font-weight:500;">run_command</text>
  <text x="410" y="412" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133,79,11);font-size:11px;">Shell 执行</text>

  <!-- list_dir -->
  <rect x="500" y="370" width="120" height="54" rx="8" style="fill:rgb(250,238,218);stroke:rgb(133,79,11);stroke-width:0.5px;"/>
  <text x="560" y="392" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99,56,6);font-size:13px;font-weight:500;">list_dir</text>
  <text x="560" y="412" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133,79,11);font-size:11px;">目录探索</text>
</g>

<!-- 连接线：工具集主框 → 四个工具 -->
<line x1="340" y1="328" x2="340" y2="366" marker-end="url(#arrow)" style="stroke:rgb(115,114,108);stroke-width:1.5px;fill:none;"/>

<line x1="280" y1="346" x2="120" y2="370" style="stroke:rgb(185,182,170);stroke-width:1px;fill:none;stroke-dasharray:4,3;"/>
<line x1="300" y1="350" x2="260" y2="370" style="stroke:rgb(185,182,170);stroke-width:1px;fill:none;stroke-dasharray:4,3;"/>
<line x1="380" y1="350" x2="410" y2="370" style="stroke:rgb(185,182,170);stroke-width:1px;fill:none;stroke-dasharray:4,3;"/>
<line x1="400" y1="346" x2="560" y2="370" style="stroke:rgb(185,182,170);stroke-width:1px;fill:none;stroke-dasharray:4,3;"/>

<!-- 回传箭头：右侧大弧，从工具集回到 Agent 核心 -->
<path d="M 460 328 L 620 328 L 620 193 L 502 193" fill="none" stroke="rgb(115,114,108)" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<text x="628" y="268" text-anchor="start" style="fill:rgb(95,94,90);font-family:'Inter',-apple-system,sans-serif;font-size:11px;" transform="rotate(-90 628 268)">tool_result 回传</text>

<!-- 设计约束标注框 -->
<rect x="60" y="470" width="560" height="54" rx="6" style="fill:none;stroke:rgba(95,94,90,0.25);stroke-width:1px;stroke-dasharray:5,3;"/>
<text x="340" y="492" text-anchor="middle" dominant-baseline="central" style="fill:rgb(95,94,90);font-family:'Inter',-apple-system,sans-serif;font-size:11px;font-weight:500;">设计约束</text>
<text x="340" y="511" text-anchor="middle" dominant-baseline="central" style="fill:rgb(115,114,108);font-family:'Inter',-apple-system,sans-serif;font-size:11px;">core.py 不依赖 CLI 层 · tools.py 不依赖 LLM 层 · 每一层可独立测试与替换</text>
</svg>
