<svg width="100%" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">记忆提取与注入流程</title>
  <desc id="desc">展示记忆管理器在会话开始和结束时的完整数据流。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .label { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; text-anchor: middle; }
      .title-text { font-size: 14px; font-weight: 500; }
      .body-text { font-size: 12px; font-weight: 400; }
      .heading { font-size: 14px; font-weight: 500; }
      .small-text { font-size: 11px; font-weight: 400; }
    </style>
  </defs>

  <!-- ===== LEFT HALF: Session Start (Retrieval) ===== -->
  <text x="170" y="24" class="label heading" fill="rgb(15, 110, 86)">会话开始：检索与注入</text>

  <!-- Step 1: User Input -->
  <rect x="80" y="40" width="180" height="34" rx="6" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="0.5"/>
  <text x="170" y="62" class="label body-text" fill="rgb(68, 68, 65)">① 用户输入任务</text>

  <line x1="170" y1="74" x2="170" y2="95" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.2" fill="none"/>

  <!-- Step 2: Load Profile -->
  <rect x="80" y="97" width="180" height="34" rx="6" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text x="170" y="119" class="label body-text" fill="rgb(99, 56, 6)">② 加载用户画像</text>

  <line x1="170" y1="131" x2="170" y2="152" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.2" fill="none"/>

  <!-- Step 3: Search Episodes -->
  <rect x="80" y="154" width="180" height="34" rx="6" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="170" y="176" class="label body-text" fill="rgb(8, 80, 65)">③ 向量检索情景记忆</text>

  <line x1="170" y1="188" x2="170" y2="209" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.2" fill="none"/>

  <!-- Step 4: Recent Episodes -->
  <rect x="80" y="211" width="180" height="34" rx="6" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="170" y="233" class="label body-text" fill="rgb(8, 80, 65)">④ 获取最近交互</text>

  <line x1="170" y1="245" x2="170" y2="266" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.2" fill="none"/>

  <!-- Step 5: Build Context -->
  <rect x="60" y="268" width="220" height="44" rx="8" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="170" y="286" class="label title-text" fill="rgb(60, 52, 137)">⑤ 构建记忆前缀</text>
  <text x="170" y="302" class="label small-text" fill="rgb(83, 74, 183)">注入 System Prompt 后</text>

  <line x1="170" y1="312" x2="170" y2="333" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.2" fill="none"/>

  <!-- Step 6: Agent Executes -->
  <rect x="60" y="335" width="220" height="44" rx="8" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="170" y="353" class="label title-text" fill="rgb(60, 52, 137)">⑥ Agent 执行任务</text>
  <text x="170" y="369" class="label small-text" fill="rgb(83, 74, 183)">带着记忆进入 ReAct 循环</text>

  <!-- Divider -->
  <line x1="340" y1="30" x2="340" y2="440" stroke="rgb(200, 198, 192)" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ===== RIGHT HALF: Session End (Extraction) ===== -->
  <text x="510" y="24" class="label heading" fill="rgb(133, 79, 11)">会话结束：提取与存储</text>

  <!-- Step 1: Conversation Ends -->
  <rect x="400" y="40" width="220" height="34" rx="6" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="0.5"/>
  <text x="510" y="62" class="label body-text" fill="rgb(68, 68, 65)">① 用户退出 / 会话结束</text>

  <line x1="510" y1="74" x2="510" y2="95" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.2" fill="none"/>

  <!-- Step 2: Convert to Text -->
  <rect x="400" y="97" width="220" height="34" rx="6" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="0.5"/>
  <text x="510" y="119" class="label body-text" fill="rgb(68, 68, 65)">② 对话历史转纯文本</text>

  <line x1="510" y1="131" x2="510" y2="152" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.2" fill="none"/>

  <!-- Step 3: Extract Episodes -->
  <rect x="400" y="154" width="220" height="44" rx="6" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="510" y="172" class="label body-text" fill="rgb(8, 80, 65)">③ LLM 提取关键事件</text>
  <text x="510" y="188" class="label small-text" fill="rgb(15, 110, 86)">gpt-4o-mini · JSON 格式</text>

  <line x1="510" y1="198" x2="510" y2="219" marker-end="url(#arrow)" stroke="rgb(115, 114, 108)" stroke-width="1.2" fill="none"/>

  <!-- Step 4: Extract Profile -->
  <rect x="400" y="221" width="220" height="44" rx="6" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text x="510" y="239" class="label body-text" fill="rgb(99, 56, 6)">④ LLM 提取用户信息</text>
  <text x="510" y="255" class="label small-text" fill="rgb(133, 79, 11)">事实 + 偏好 · JSON 格式</text>

  <!-- Two arrows down to the two stores -->
  <line x1="460" y1="265" x2="460" y2="310" marker-end="url(#arrow)" stroke="rgb(15, 110, 86)" stroke-width="1.2" fill="none"/>
  <line x1="560" y1="265" x2="560" y2="310" marker-end="url(#arrow)" stroke="rgb(133, 79, 11)" stroke-width="1.2" fill="none"/>

  <!-- Step 5: Save to Episodic -->
  <rect x="390" y="312" width="140" height="50" rx="8" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="460" y="333" class="label body-text" fill="rgb(8, 80, 65)">⑤ 存入情景</text>
  <text x="460" y="349" class="label small-text" fill="rgb(15, 110, 86)">+ 生成 embedding</text>

  <!-- Step 6: Merge to Semantic -->
  <rect x="540" y="312" width="120" height="50" rx="8" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text x="600" y="333" class="label body-text" fill="rgb(99, 56, 6)">⑥ 合并画像</text>
  <text x="600" y="349" class="label small-text" fill="rgb(133, 79, 11)">冲突解决</text>

  <!-- Arrow from right to left (next session) -->
  <path d="M460 362 L460 410 L170 410 L170 395" marker-end="url(#arrow)" fill="none" stroke="rgb(83, 74, 183)" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="315" y="428" class="label small-text" fill="rgb(83, 74, 183)">下次会话开始时，检索这些记忆注入上下文 →  形成闭环</text>

  <!-- Bottom note -->
  <text x="340" y="464" class="label body-text" fill="rgb(95, 94, 90)">提取用 gpt-4o-mini（便宜快速），推理用 gpt-4o（强能力）——角色分工</text>
</svg>
