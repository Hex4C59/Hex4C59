<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t2 d2">
  <title id="t2">结构化计划与执行</title>
  <desc id="d2">Plan-and-Execute 范式中的带依赖关系的结构化计划。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .label { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      .t { font-size: 14px; font-weight: 500; }
      .b { font-size: 12px; font-weight: 400; }
      .s { font-size: 13px; font-weight: 600; }
    </style>
  </defs>

  <text class="label s" x="340" y="24" text-anchor="middle" fill="rgb(60, 52, 137)">规划阶段</text>

  <rect x="160" y="36" width="360" height="36" rx="6" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text class="label b" x="340" y="58" text-anchor="middle" fill="rgb(60, 52, 137)">Goal: 分析 Q1 用户流失原因并给出改进建议</text>

  <rect x="30" y="92" width="180" height="44" rx="6" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text class="label t" x="120" y="110" text-anchor="middle" fill="rgb(8, 80, 65)">Step 1: 提取数据</text>
  <text class="label b" x="120" y="126" text-anchor="middle" fill="rgb(15, 110, 86)">依赖：无</text>

  <line x1="120" y1="138" x2="120" y2="162" stroke="rgb(115, 114, 108)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="120" y1="138" x2="340" y2="162" stroke="rgb(115, 114, 108)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <rect x="30" y="164" width="180" height="44" rx="6" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text class="label t" x="120" y="182" text-anchor="middle" fill="rgb(99, 56, 6)">Step 2: 趋势分析</text>
  <text class="label b" x="120" y="198" text-anchor="middle" fill="rgb(133, 79, 11)">依赖：Step 1</text>

  <rect x="250" y="164" width="180" height="44" rx="6" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text class="label t" x="340" y="182" text-anchor="middle" fill="rgb(99, 56, 6)">Step 3: 行为路径</text>
  <text class="label b" x="340" y="198" text-anchor="middle" fill="rgb(133, 79, 11)">依赖：Step 1</text>

  <rect x="470" y="92" width="180" height="44" rx="6" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text class="label t" x="560" y="110" text-anchor="middle" fill="rgb(8, 80, 65)">Step 4: 反馈分析</text>
  <text class="label b" x="560" y="126" text-anchor="middle" fill="rgb(15, 110, 86)">依赖：无（可并行）</text>

  <line x1="120" y1="210" x2="280" y2="252" stroke="rgb(115, 114, 108)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="340" y1="210" x2="340" y2="252" stroke="rgb(115, 114, 108)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="560" y1="138" x2="400" y2="252" stroke="rgb(115, 114, 108)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <rect x="250" y="254" width="180" height="44" rx="6" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text class="label t" x="340" y="272" text-anchor="middle" fill="rgb(60, 52, 137)">Step 5: 综合分析</text>
  <text class="label b" x="340" y="288" text-anchor="middle" fill="rgb(83, 74, 183)">依赖：Step 2、3、4</text>

  <line x1="340" y1="300" x2="340" y2="322" stroke="rgb(115, 114, 108)" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="250" y="324" width="180" height="44" rx="6" fill="rgb(234, 243, 222)" stroke="rgb(59, 109, 17)" stroke-width="0.5"/>
  <text class="label t" x="340" y="342" text-anchor="middle" fill="rgb(39, 80, 10)">Step 6: 生成报告</text>
  <text class="label b" x="340" y="358" text-anchor="middle" fill="rgb(59, 109, 17)">依赖：Step 5</text>

  <line x1="30" y1="392" x2="650" y2="392" stroke="rgb(95, 94, 90)" stroke-width="0.5" stroke-dasharray="4 3" opacity="0.5"/>
  <text class="label s" x="340" y="412" text-anchor="middle" fill="rgb(99, 56, 6)">执行阶段</text>
  <text class="label b" x="340" y="432" text-anchor="middle" fill="rgb(95, 94, 90)">按计划逐步执行，每步完成后更新状态</text>
</svg>