<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 486" role="img" aria-labelledby="title desc">
<title id="title">String 的移动与借用</title><desc id="desc">创建后 title 拥有字符数据；移动后由 moved 拥有；view 只借用这些数据，不取得所有权。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#444441;font-size:14px}.title{font-size:16px;font-weight:600}.small{font-size:12px;fill:#5f5e5a}.panel{fill:#faf9f6;stroke:#d8d6cf;stroke-width:1}.value{fill:#eeedfe;stroke:#534ab7;stroke-width:1}.owner{fill:#e1f5ee;stroke:#0f6e56;stroke-width:1}.ref{fill:#e6f1fb;stroke:#185fa5;stroke-width:1}.arrow{fill:none;stroke:#0f6e56;stroke-width:1.5;marker-end:url(#arrow)}.borrow{fill:none;stroke:#185fa5;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#arrow)}.invalid{fill:#fce6e3;stroke:#c94d3d;stroke-width:1}.muted{fill:#f1efe8;stroke:#aaa89e;stroke-width:1}</style>
<rect width="680" height="486" rx="8" fill="#fff"/>
<text x="24" y="30" class="title">String 的移动与借用：跟踪同一份字符数据</text>
<rect class="panel" x="16" y="46" width="648" height="104" rx="8"/>
<text x="32" y="70">1. 创建 String</text>
<rect class="owner" x="48" y="88" width="112" height="36" rx="8"/><text x="104" y="111" text-anchor="middle">title</text>
<path class="arrow" d="M164 106H452"/><text x="290" y="100" text-anchor="middle" class="small">拥有</text>
<rect class="value" x="460" y="88" width="172" height="36" rx="8"/><text x="546" y="111" text-anchor="middle">学习 Rust</text>
<rect class="panel" x="16" y="162" width="648" height="122" rx="8"/>
<text x="32" y="186">2. let moved = title：转移所有权</text>
<rect class="muted" x="48" y="202" width="112" height="36" rx="8"/><text x="104" y="225" text-anchor="middle">title</text><path d="M56 230L150 210" stroke="#993c1d" stroke-width="1.5"/>
<text x="48" y="260" class="small">旧绑定不可继续使用</text>
<rect class="owner" x="236" y="202" width="112" height="36" rx="8"/><text x="292" y="225" text-anchor="middle">moved</text>
<path class="arrow" d="M352 220H452"/><text x="401" y="212" text-anchor="middle" class="small">拥有</text>
<rect class="value" x="460" y="202" width="172" height="36" rx="8"/><text x="546" y="225" text-anchor="middle">学习 Rust</text>
<rect class="panel" x="16" y="296" width="648" height="144" rx="8"/>
<text x="32" y="320">3. let view = moved.as_str()：创建文本视图</text>
<rect class="owner" x="48" y="338" width="112" height="36" rx="8"/><text x="104" y="361" text-anchor="middle">moved</text>
<path class="arrow" d="M164 356H452"/><text x="290" y="348" text-anchor="middle" class="small">仍然拥有</text>
<rect class="value" x="460" y="338" width="172" height="36" rx="8"/><text x="546" y="361" text-anchor="middle">学习 Rust</text>
<rect class="ref" x="236" y="390" width="112" height="32" rx="8"/><text x="292" y="411" text-anchor="middle">view: &amp;str</text>
<path class="borrow" d="M352 406H548V380"/><text x="407" y="398" class="small">借用</text>
<text x="24" y="464" class="small">实线标记所有权，虚线标记借用；这是关系示意，不是内存布局图。</text>
</svg>
