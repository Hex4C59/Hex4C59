<div class="footer-identity">
  {{ partialCached "reader/brand.html" site }}
  <a class="footer-title" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
</div>
<div class="footer-links">
  {{ range site.Params.social }}<a href="{{ .url }}" target="_blank" rel="noopener noreferrer me">{{ .name }}</a>{{ end }}
  {{ with site.Home.OutputFormats.Get "RSS" }}<a href="{{ .RelPermalink }}">RSS</a>{{ end }}
</div>
<p class="footer-credit">© {{ now.Year }} {{ site.Params.author }} · 由 <a href="https://gohugo.io/">Hugo</a> 与 <a href="https://github.com/tomfran/typo">Typo</a> 构建</p>

<nav class="footer-browse" aria-label="更多浏览入口"><a href="{{ "archives/" | relURL }}">归档</a><a href="{{ "categories/" | relURL }}">分类</a><a href="{{ "tags/" | relURL }}">标签</a><a href="{{ "about/" | relURL }}">关于</a></nav>

<button id="motion-toggle" type="button" aria-label="动效：开，点击关闭动态效果" aria-pressed="true" hidden>动效：开</button>
