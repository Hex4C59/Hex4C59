{{ $series := .Series }}{{ $current := .Current }}
<div class="series-contents">
  {{ range $series.Groups }}
  <section class="series-part">
    <h3>{{ .Title }}</h3>
    <ol class="series-chapters">
      {{ range .Pages }}
      <li>
        <a href="{{ .RelPermalink }}"{{ if eq . $current }} aria-current="page"{{ end }}>
          <span class="chapter-number">{{ with .Params.series_number }}{{ printf "%02d" (int .) }}{{ else }}序言{{ end }}</span>
          <span class="chapter-body"><span class="chapter-title">{{ .Params.series_label | default .Title }}</span></span>
        </a>
      </li>
      {{ end }}
    </ol>
  </section>
  {{ end }}
</div>
