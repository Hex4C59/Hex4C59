<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}" dir="ltr">
<head>{{ partial "head.html" . }}</head>
<body id="top">
  <script>document.body.classList.add(document.documentElement.dataset.theme);</script>
  <a class="skip-link" href="#main-content">跳到正文</a>
  <div class="content">
    <header>{{ partial "header.html" . }}</header>
    <main class="main" id="main-content">{{ block "main" . }}{{ end }}</main>
  </div>
  {{ partial "functions/get_hook.html" (dict "hook" "body_end" "context" .) }}
  <footer>{{ partial "footer.html" . }}</footer>
  {{ if .Param "math" }}{{ partialCached "math.html" . }}{{ end }}
  <script defer src="{{ "js/copy-code.js" | relURL }}"></script>
</body>
</html>
