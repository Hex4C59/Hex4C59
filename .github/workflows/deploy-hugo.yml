name: Deploy Hugo Site to Pages

on:
  push:
    branches: ["source"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install pinned Hugo
        run: |
          HUGO_VERSION="$(cat .hugo-version)"
          HUGO_ARCHIVE="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          HUGO_RELEASE="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/${HUGO_ARCHIVE}" "${HUGO_RELEASE}/${HUGO_ARCHIVE}"
          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/hugo-checksums.txt" "${HUGO_RELEASE}/hugo_${HUGO_VERSION}_checksums.txt"
          cd "${RUNNER_TEMP}"
          awk -v name="${HUGO_ARCHIVE}" '$2 == name { print }' hugo-checksums.txt > hugo-selected-checksum.txt
          test -s hugo-selected-checksum.txt
          sha256sum --check hugo-selected-checksum.txt
          mkdir -p "${HOME}/.local/hugo"
          tar -xf "${HUGO_ARCHIVE}" -C "${HOME}/.local/hugo" hugo
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"
      - name: Check validation tools
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Cache restore
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ hashFiles('.hugo-version') }}-${{ github.run_id }}
          restore-keys:
            hugo-${{ hashFiles('.hugo-version') }}-
      - name: Build and validate site
        env:
          HUGO_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: |
          python3 scripts/build.py \
            --base-url "${{ steps.pages.outputs.base_url }}/" \
            --cache-dir "${{ runner.temp }}/hugo_cache"
          git diff --check
      - name: Cache save
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
