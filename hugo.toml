# 文件名: hugo.toml (已修正语法)

baseURL = "https://www.hex4c59.fun/"
languageCode = "zh-cn"
title = "Hex4C59's Blog"
theme = "PaperMod"
hasCJKLanguage = true
enableGitInfo = true  

[author]
  name = "Hex4C59"
  email = "hex4c59@users.noreply.github.com"

# Hugo 会为 "archives", "search", "tags" 等页面自动生成列表，无需手动创建 .md 文件
enableRobotsTXT = true
buildFuture = true
buildExpired = false

[pagination]
  pageSize = 5

# 这是正确的输出配置
[outputs]
  home = ["HTML", "RSS", "JSON"]

# ----------------- 这是修正后的 params 部分 -----------------
[params]
  author = "Hex4C59"
  description = "在这里记录我的学习与思考"
  authorEmail = "hex4c59@users.noreply.github.com"
  defaultTheme = "auto"
  mainSections = ["posts", "leetcode"]
  ShowReadingTime = true
  ShowRssButtonInSectionTermList = true
  ShowWordCount = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowLastmode = true
  ShowToc = true
  math = true
  katex = "/katex/"

  # 归档页面的配置
  [params.archives]
    enabled = true

  # 主页的配置
  [params.homeInfoParams]
    Title = "好的想法需要地方降落，否则它们只会飘走!"
    Content = "👋欢迎来到我的博客。在这里我会分享一些关于技术和生活的思考。"

  # 社交图标的配置
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Hex4C59"
  [[params.socialIcons]]
    name = "twitter"
    url = "https://x.com/Hex4C59/"
  [[params.socialIcons]]
  name = "leetcode"
  url = "https://www.leetcode.cn/hex4c59"
  [[params.socialIcons]]
    name = "reddit"
    url = "https://www.reddit.com/u/ParticularTwo2653"

  # 资源文件的配置
  [params.assets]
    favicon = "favicon.ico"
    favicon16x16 = "favicon.png"
    favicon32x32 = "favicon.png" 
    apple_touch_icon = "favicon.png"

  # 文章封面的配置
  [params.cover]
    hidden = true
    hiddenInList = true
    hiddenInSingle = true

  # 评论功能配置（推荐使用 giscus，基于 GitHub Discussions）
  [params.comments]
    enabled = true
    provider = "giscus"
    repo = "Hex4C59/Hex4C59"
    repoId = ""
    category = "Comments"
    categoryId = ""
    mapping = "pathname"
    strict = "0"
    reactionsEnabled = "1"
    emitMetadata = "0"
    inputPosition = "top"
    lang = "zh-CN"
    loading = "lazy"
    themeLight = "light"
    themeDark = "dark"

  # 如果以后想改用 utterances，可改为：
  # provider = "utterances"
  # issueTerm = "pathname"
  # label = "comment"
  # themeLight = "github-light"
  # themeDark = "github-dark"

  # 搜索功能的配置
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content", "tags", "series"]

# ----------------- 这是修正后的 menu 部分 -----------------
[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    identifier = "leetcode"
    name = "LeetCode"
    url = "/leetcode/"
    weight = 5
  [[menu.main]]
    identifier = "archive"
    name = "Archive"
    url = "/archives/"
    weight = 10
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 15
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 20

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
