baseURL = "https://hex4c59.cc/"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "Hex4C59's Blog"
theme = "typo"
hasCJKLanguage = true
enableGitInfo = true
enableRobotsTXT = true
buildFuture = true
buildExpired = false

[frontmatter]
  lastmod = ["lastmod", ":git", "date", "publishDate"]

[pagination]
  pageSize = 5

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  author = "Hex4C59"
  authorEmail = "hex4c59@users.noreply.github.com"
  description = "在这里记录我的学习与思考"
  theme = "auto"
  colorPalette = "default"
  homeIntroTitle = "好的想法需要地方降落，否则它们只会飘走!"
  homeIntroContent = "欢迎来到我的博客。在这里分享技术学习、AI Agent 实践，以及生活中的思考。"
  paginationSize = 5
  featuredSeries = ["agent-engineering", "智能体工程模式", "DeepSeek Harness"]
  listDateFormat = "2006-01-02"
  singleDateFormat = "2006-01-02"
  listSummaries = true
  readTime = true
  showTags = true
  toc = true

  [params.breadcrumbs]
    enabled = true
    showCurrentPage = false
    home = "首页"

  [[params.utilityMenu]]
    name = "归档"
    url = "/archives/"
  [[params.utilityMenu]]
    name = "搜索"
    url = "/search/"
  [[params.utilityMenu]]
    name = "标签"
    url = "/tags/"

  [[params.social]]
    name = "GitHub"
    url = "https://github.com/Hex4C59"
  [[params.social]]
    name = "X"
    url = "https://x.com/Hex4C59/"
  [[params.social]]
    name = "Reddit"
    url = "https://www.reddit.com/u/ParticularTwo2653"

  [params.comments]
    enabled = true
    provider = "giscus"
    repo = "Hex4C59/Hex4C59"
    repoId = "R_kgDOPvFwkg"
    category = "Comments"
    categoryId = "DIC_kwDOPvFwks4C5BOF"
    mapping = "pathname"
    strict = "0"
    reactionsEnabled = "1"
    emitMetadata = "0"
    inputPosition = "top"
    lang = "zh-CN"
    loading = "lazy"
    themeLight = "light"
    themeDark = "dark"

  [params.analytics.cloudflare]
    enabled = true
    # Read the site beacon token from HUGO_CLOUDFLARE_WEB_ANALYTICS_TOKEN at build time.

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    threshold = 0.4
    ignoreLocation = true
    minMatchCharLength = 2
    keys = ["title", "summary", "content", "tags", "series"]

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
